name: Test envío de correo (temporal)

on:
  workflow_dispatch: {}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install requests pandas pypdf

      - name: Crear fondo de prueba sintético
        run: |
          mkdir -p data
          cat > data/nuevos_ultima_corrida.csv <<'EOF'
          id_registro,fecha_deposito,run_fondo,nombre_fondo,administradora,estado_registro,estado_liquidacion,tipo_fondo,reglamento_codigo,reglamento_url,fecha_ultima_modificacion,primera_deteccion
          TEST001,2026-08-24,999999,FONDO DE PRUEBA - Envio de correo,ADMINISTRADORA DE PRUEBA S.A.,Vigente,No liquidado,Fondo Mutuo,00000,https://www.cmfchile.cl/documentos/rfm/rfm_00000.pdf,2026-08-24,2026-08-24
          EOF

      - name: Enviar correo de prueba
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: python scripts/send_email.py --new-rows data/nuevos_ultima_corrida.csv --to ordenes.camilo@gmail.com

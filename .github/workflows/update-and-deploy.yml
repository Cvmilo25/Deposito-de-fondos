name: Actualizar datos CMF y publicar dashboard

on:
  schedule:
    # Lunes a viernes 13:00 hora Chile (UTC-4, horario de invierno vigente hoy).
    # Cron es siempre UTC y Chile cambia de huso con el horario de verano
    # (UTC-3 aprox. sept-abril), así que en horario de verano esta hora fija
    # corre a las ~14:00 hora Chile en vez de las 13:00. Ajustar el "17" a
    # "16" cuando entre el horario de verano si se quiere la hora exacta.
    - cron: "0 17 * * 1-5"
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "scripts/**"
      - ".github/workflows/update-and-deploy.yml"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Descargar Excel desde la CMF
        run: python scripts/fetch_cmf.py --output data/raw/deposito_fondos_mutuos_latest.xlsx

      - name: Procesar y actualizar histórico
        run: python scripts/process.py --input data/raw/deposito_fondos_mutuos_latest.xlsx --history data/historico_depositos.csv

      - name: Enviar aviso por correo de fondos nuevos
        # No debe frenar el resto de la corrida (commit + deploy de Pages) si Gmail falla
        # por algo transitorio: el dato ya está procesado, el aviso es un "plus".
        continue-on-error: true
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: python scripts/send_email.py --new-rows data/nuevos_ultima_corrida.csv --to ordenes.camilo@gmail.com

      - name: Commit histórico actualizado
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/historico_depositos.csv data/last_update.json docs/data/historico_depositos.csv docs/data/last_update.json
          git diff --cached --quiet || git commit -m "chore: actualizar datos CMF $(date -u +%Y-%m-%d)"
          git push

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Deploy a GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

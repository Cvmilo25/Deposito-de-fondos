<title>The Metro Vocabulary</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Overpass:wght@500;700;800&family=Noto+Sans:wght@400&display=swap">
<style>
/* Layout: una línea de metro. Los bloques de 6 palabras son estaciones; el progreso se lee como un recorrido. */
:root{
  --bg:#EDF1F0; --surface:#FFFFFF; --surface-2:#F5F8F7; --ink:#13201C; --muted:#56665F; --line:#D4DDDA;
  --accent:#2747D0; --accent-ink:#FFFFFF; --accent-soft:#E2E8FC; --signal:#F2B705; --signal-ink:#1F1700;
  --ok:#16773A; --ok-soft:#E0F2E6; --bad:#B53920; --bad-soft:#FBE6E0; --warn:#8F5D00; --warn-soft:#FBF0D6;
  --lv0:#C5D0CC; --lv1:#A6BEF4; --lv2:#6B8EEE; --lv3:#2747D0; --lv4:#E0A912; --lv5:#16773A;
  --shadow:0 1px 2px rgb(19 32 28 / .06), 0 8px 24px rgb(19 32 28 / .07);
  --f-display:"Overpass","Segoe UI",system-ui,sans-serif;
  --f-body:"Atkinson Hyperlegible","Segoe UI",system-ui,sans-serif;
  --f-ipa:"Noto Sans","Segoe UI","Lucida Sans Unicode",system-ui,sans-serif;
  --r:16px; --r-sm:10px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0E1412; --surface:#161E1B; --surface-2:#1C2622; --ink:#E6EEEA; --muted:#9AABA4; --line:#2A3632;
  --accent:#7F9CFF; --accent-ink:#0B1230; --accent-soft:#1F2A4D; --signal:#F4C430; --signal-ink:#1F1700;
  --ok:#4CC57A; --ok-soft:#14301F; --bad:#FF8466; --bad-soft:#3A1C14; --warn:#E9B54D; --warn-soft:#33270F;
  --lv0:#34403C; --lv1:#3A5296; --lv2:#5578EE; --lv3:#8FA8FF; --lv4:#F4C430; --lv5:#4CC57A;
  --shadow:0 1px 2px rgb(0 0 0 / .3), 0 8px 24px rgb(0 0 0 / .25); color-scheme:dark; } }
:root[data-theme="dark"]{
  --bg:#0E1412; --surface:#161E1B; --surface-2:#1C2622; --ink:#E6EEEA; --muted:#9AABA4; --line:#2A3632;
  --accent:#7F9CFF; --accent-ink:#0B1230; --accent-soft:#1F2A4D; --signal:#F4C430; --signal-ink:#1F1700;
  --ok:#4CC57A; --ok-soft:#14301F; --bad:#FF8466; --bad-soft:#3A1C14; --warn:#E9B54D; --warn-soft:#33270F;
  --lv0:#34403C; --lv1:#3A5296; --lv2:#5578EE; --lv3:#8FA8FF; --lv4:#F4C430; --lv5:#4CC57A;
  --shadow:0 1px 2px rgb(0 0 0 / .3), 0 8px 24px rgb(0 0 0 / .25); color-scheme:dark; }

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
h1,h2,h3,h4{font-family:var(--f-display);line-height:1.15;margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:clamp(1.7rem,4vw,2.4rem);font-weight:800}
h2{font-size:1.45rem;font-weight:800}
h3{font-size:1.1rem;font-weight:700}
p{margin:0}
button,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:6px}
mark{background:var(--signal);color:var(--signal-ink);padding:0 .2em;border-radius:4px;font-weight:700}
.ipa{font-family:var(--f-ipa);color:var(--muted)}
.muted{color:var(--muted)}
.small{font-size:.875rem}
.eyebrow{font-family:var(--f-display);font-size:.75rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.num{font-variant-numeric:tabular-nums}

/* Header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.top-in{max-width:1120px;margin:0 auto;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--f-display);font-weight:800;font-size:1.05rem;white-space:nowrap;background:none;border:0;padding:0;cursor:pointer}
.brand .roundel{width:30px;height:30px;border-radius:50%;border:5px solid var(--accent);position:relative;flex:none}
.brand .roundel::after{content:"";position:absolute;left:-9px;right:-9px;top:50%;height:6px;margin-top:-3px;background:var(--signal);border-radius:2px}
.nav{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;flex:0 1 auto;min-width:0}
.nav::-webkit-scrollbar{display:none}
.nav button{display:flex;align-items:center;gap:6px;border:0;background:none;padding:8px 12px;border-radius:999px;cursor:pointer;font-weight:700;font-size:.92rem;color:var(--muted);white-space:nowrap}
.nav button svg{width:18px;height:18px;flex:none}
.nav button:hover{background:var(--surface-2);color:var(--ink)}
.nav button[aria-current="page"]{background:var(--accent);color:var(--accent-ink)}
.nav .badge{background:var(--signal);color:var(--signal-ink);border-radius:999px;font-size:.72rem;padding:0 7px;line-height:1.5}
.save-state{margin-left:auto;font-size:.78rem;color:var(--muted);display:flex;align-items:center;gap:6px;white-space:nowrap}
.save-state .dot{width:8px;height:8px;border-radius:50%;background:var(--warn)}
.save-state.cloud .dot{background:var(--ok)}
@media (max-width:760px){ .top-in{gap:8px} .nav{order:3;flex-basis:100%} .nav button span.lbl-long{display:none} }

main{max-width:1120px;margin:0 auto;padding-block:24px 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:24px}

/* Generic */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;box-shadow:var(--shadow);min-width:0}
.card.flat{box-shadow:none}
.stack{display:grid;gap:12px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.grid-2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:20px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:var(--surface);padding:10px 16px;border-radius:999px;font-weight:700;cursor:pointer;transition:transform .12s ease, background .15s ease;text-decoration:none;min-height:44px}
.btn:hover{background:var(--surface-2)}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.06);background:var(--accent)}
.btn.signal{background:var(--signal);color:var(--signal-ink);border-color:var(--signal)}
.btn.ghost{background:transparent;border-color:transparent}
.btn.sm{min-height:36px;padding:6px 12px;font-size:.9rem}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn svg{width:18px;height:18px}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:2px 10px;font-size:.8rem;font-weight:700;background:var(--surface-2);border:1px solid var(--line);white-space:nowrap}
.chip .sw{width:9px;height:9px;border-radius:50%}
.chip.hard{background:var(--bad-soft);border-color:transparent;color:var(--bad)}
.chip.saved{background:var(--warn-soft);border-color:transparent;color:var(--warn)}
.chip.ok{background:var(--ok-soft);border-color:transparent;color:var(--ok)}
.pos{font-family:var(--f-display);font-size:.78rem;font-weight:700;color:var(--accent);background:var(--accent-soft);padding:1px 8px;border-radius:6px}
.speak{border:1px solid var(--line);background:var(--surface);border-radius:50%;width:40px;height:40px;display:inline-grid;place-items:center;cursor:pointer;flex:none}
.speak svg{width:18px;height:18px}
.speak:hover{background:var(--accent-soft)}
.bar{height:10px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line);overflow:hidden}
.bar > i{display:block;height:100%;background:var(--accent);border-radius:999px;transition:width .5s ease}

/* Dashboard */
.hero{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:20px}
@media (max-width:860px){.hero{grid-template-columns:1fr}}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(100px,1fr));gap:10px}
.kpi{background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r-sm);padding:14px}
.kpi b{display:block;font-family:var(--f-display);font-size:1.9rem;font-weight:800;line-height:1.1;font-variant-numeric:tabular-nums}
.kpi span{font-size:.85rem;color:var(--muted)}
.reco{background:var(--accent);color:var(--accent-ink);border-radius:var(--r);padding:22px;display:grid;gap:12px;align-content:start}
.reco .eyebrow{color:inherit;opacity:.8}
.reco h2{font-size:1.35rem}
.reco p{opacity:.92}
.reco .btn{background:var(--signal);color:var(--signal-ink);border-color:var(--signal);justify-self:start}
.quick{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));gap:12px}
.qa{display:grid;gap:6px;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:16px;cursor:pointer;transition:transform .15s ease,border-color .15s ease}
.qa:hover{transform:translateY(-2px);border-color:var(--accent)}
.qa svg{width:24px;height:24px;color:var(--accent)}
.qa b{font-family:var(--f-display);font-size:1.05rem}
.qa span{font-size:.88rem;color:var(--muted)}

/* Metro line */
.line-wrap{overflow-x:auto;padding:6px 2px 4px}
.line{display:flex;align-items:flex-start;position:relative;min-width:max-content;padding:0 6px}
.line::before{content:"";position:absolute;left:24px;right:24px;top:17px;height:8px;background:var(--accent);border-radius:4px;opacity:.25}
.stn{position:relative;display:grid;justify-items:center;gap:4px;width:44px;background:none;border:0;padding:0;cursor:pointer;color:var(--ink)}
.stn .c{width:30px;height:30px;margin-top:6px;border-radius:50%;background:var(--surface);border:4px solid var(--lv0);display:grid;place-items:center;font-size:.7rem;font-weight:800;font-family:var(--f-display);transition:transform .15s ease}
.stn:hover .c{transform:scale(1.12)}
.stn.part .c{border-color:var(--accent)}
.stn.done .c{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.stn.master .c{background:var(--lv5);border-color:var(--lv5);color:var(--surface)}
.stn.here .c{box-shadow:0 0 0 4px var(--signal)}
.stn small{font-size:.66rem;color:var(--muted)}
.levels{display:flex;height:14px;border-radius:999px;overflow:hidden;background:var(--surface-2);border:1px solid var(--line)}
.levels i{display:block;height:100%;transition:width .5s ease}
.legend{display:flex;flex-wrap:wrap;gap:8px 14px;font-size:.82rem;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend .sw{width:10px;height:10px;border-radius:3px}

/* Study: vertical line diagram */
.stations{display:grid;gap:0;position:relative;padding-left:8px}
.st-row{display:grid;grid-template-columns:40px minmax(0,1fr) auto;gap:14px;align-items:center;padding:10px 0;position:relative;border:0;background:none;text-align:left;cursor:pointer;width:100%}
.st-row::before{content:"";position:absolute;left:17px;top:0;bottom:0;width:6px;background:var(--accent);opacity:.25}
.st-row:first-child::before{top:50%}.st-row:last-child::before{bottom:50%}
.st-row .c{position:relative;z-index:1;width:40px;height:40px;border-radius:50%;background:var(--surface);border:4px solid var(--lv0);display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:.85rem}
.st-row.part .c{border-color:var(--accent)}
.st-row.done .c{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.st-row.master .c{background:var(--lv5);border-color:var(--lv5);color:var(--surface)}
.st-row:hover .st-name{color:var(--accent)}
.st-name{font-family:var(--f-display);font-weight:700;min-width:0}
.st-name small{display:block;font-family:var(--f-body);font-weight:400;color:var(--muted);font-size:.86rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* Word card */
.word-head{display:flex;align-items:flex-start;gap:14px;flex-wrap:wrap}
.word-head .w{font-family:var(--f-display);font-size:clamp(2rem,6vw,3rem);font-weight:800;line-height:1;letter-spacing:-.02em;overflow-wrap:anywhere}
.word-head .meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:6px}
.sec{border-top:1px solid var(--line);padding-top:14px;display:grid;gap:8px}
.sec-h{display:flex;justify-content:space-between;align-items:center;gap:10px}
.sec-h .eyebrow{color:var(--accent)}
.reveal{border:1px dashed var(--line);border-radius:var(--r-sm);padding:12px;color:var(--muted);background:var(--surface-2);cursor:pointer;text-align:left;width:100%}
.reveal:hover{border-color:var(--accent);color:var(--ink)}
.ex-line{display:grid;gap:2px}
.ex-line .tr{color:var(--muted);font-size:.92rem}
.note{font-size:.85rem;color:var(--muted);background:var(--surface-2);border-radius:var(--r-sm);padding:8px 12px}
.colls{display:flex;flex-wrap:wrap;gap:6px}
.colls span{background:var(--accent-soft);color:var(--ink);border-radius:8px;padding:3px 10px;font-size:.92rem}
.hook{background:var(--warn-soft);border-radius:var(--r-sm);padding:12px 14px}
.fade-in{animation:fadeIn .28s ease both}
@keyframes fadeIn{from{opacity:.0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* Library */
.lib{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);gap:20px;align-items:start}
@media (max-width:860px){.lib{grid-template-columns:1fr}.lib.detail-open .lib-list{display:none}}
.lib-list{display:grid;gap:12px}
.search{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:10px 16px;min-height:44px}
.filters{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin}
.filters button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:.85rem;font-weight:700;cursor:pointer;white-space:nowrap}
.filters button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.wlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;max-height:70vh;overflow:auto;padding:2px}
.wbtn{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:var(--r-sm);padding:9px 10px;cursor:pointer;text-align:left;min-width:0}
.wbtn:hover{border-color:var(--accent)}
.wbtn[aria-current="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.wbtn .sw{width:10px;height:10px;border-radius:50%;flex:none}
.wbtn span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:700}

/* Session */
.sess-head{display:grid;gap:10px}
.sess-top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.ex{display:grid;gap:18px}
.prompt-word{font-family:var(--f-display);font-size:clamp(2rem,7vw,3.2rem);font-weight:800;letter-spacing:-.02em;line-height:1.05;overflow-wrap:anywhere}
.sentence{font-size:clamp(1.15rem,2.6vw,1.4rem);line-height:1.5}
.blank{display:inline-block;min-width:4.5em;border-bottom:3px solid var(--accent);color:transparent;line-height:1}
.opts{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr))}
.opt{display:flex;align-items:flex-start;gap:12px;text-align:left;border:2px solid var(--line);background:var(--surface);border-radius:var(--r-sm);padding:14px;cursor:pointer;transition:border-color .15s ease, background .15s ease, transform .1s ease;min-height:56px}
.opt:hover:not([disabled]){border-color:var(--accent)}
.opt:active:not([disabled]){transform:scale(.99)}
.opt kbd{font-family:var(--f-display);font-weight:800;font-size:.8rem;border:1px solid var(--line);border-radius:6px;padding:0 6px;color:var(--muted);flex:none}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft);animation:shake .3s ease}
.opt[disabled]{cursor:default}
@keyframes shake{0%,100%{transform:none}25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.answer{display:flex;gap:10px;flex-wrap:wrap}
.answer input{flex:1 1 220px;min-width:0;border:2px solid var(--line);background:var(--surface);border-radius:var(--r-sm);padding:12px 14px;font-size:1.1rem;min-height:50px}
.answer input:focus{border-color:var(--accent);outline:none}
.answer input.right{border-color:var(--ok);background:var(--ok-soft)}
.answer input.wrong{border-color:var(--bad);background:var(--bad-soft)}
textarea{width:100%;min-height:110px;border:2px solid var(--line);background:var(--surface);border-radius:var(--r-sm);padding:12px 14px;font-size:1.05rem;resize:vertical}
textarea:focus{border-color:var(--accent);outline:none}
.fb{border-radius:var(--r);padding:18px;display:grid;gap:10px;border:2px solid transparent;animation:fadeIn .25s ease both}
.fb.ok{background:var(--ok-soft);border-color:var(--ok)}
.fb.bad{background:var(--bad-soft);border-color:var(--bad)}
.fb.warn{background:var(--warn-soft);border-color:var(--warn)}
.fb-head{display:flex;align-items:center;gap:8px;font-family:var(--f-display);font-weight:800;font-size:1.15rem}
.fb.ok .fb-head{color:var(--ok)} .fb.bad .fb-head{color:var(--bad)} .fb.warn .fb-head{color:var(--warn)}
.fb-head svg{width:22px;height:22px}
.fb-body{display:grid;gap:8px}
.mini{background:var(--surface);border-radius:var(--r-sm);padding:12px 14px;display:grid;gap:6px;border:1px solid var(--line)}

/* Flashcard */
.flash{perspective:1200px}
.flash-in{position:relative;min-height:300px;transition:transform .55s cubic-bezier(.2,.7,.2,1);transform-style:preserve-3d}
.flash.flipped .flash-in{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:var(--r);border:1px solid var(--line);background:var(--surface-2);padding:22px;display:grid;align-content:center;gap:10px;overflow:auto}
.face.back{transform:rotateY(180deg);align-content:start}
.face.front{justify-items:center;text-align:center}

/* Match */
.match{display:grid;grid-template-columns:minmax(0,.8fr) minmax(0,1.2fr);gap:12px}
@media (max-width:560px){.match{grid-template-columns:1fr}}
.match .col{display:grid;gap:8px;align-content:start}
.mitem{border:2px solid var(--line);background:var(--surface);border-radius:var(--r-sm);padding:10px 12px;text-align:left;cursor:pointer;min-height:48px;transition:border-color .15s ease, background .15s ease}
.mitem.word{font-family:var(--f-display);font-weight:800}
.mitem.sel{border-color:var(--accent);background:var(--accent-soft)}
.mitem.done{border-color:var(--ok);background:var(--ok-soft);cursor:default}
.mitem.wrong{border-color:var(--bad);background:var(--bad-soft);animation:shake .3s ease}

/* Steps */
.steps{display:flex;gap:6px;flex-wrap:wrap}
.steps button{display:flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 12px 4px 4px;font-size:.85rem;font-weight:700;cursor:pointer;color:var(--muted)}
.steps button i{font-style:normal;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:var(--surface-2);font-family:var(--f-display);font-size:.78rem}
.steps button[aria-current="step"]{border-color:var(--accent);color:var(--ink)}
.steps button[aria-current="step"] i{background:var(--accent);color:var(--accent-ink)}
.steps button.seen i{background:var(--accent-soft);color:var(--accent)}
.foot{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center}

/* Challenge */
.score{display:flex;gap:10px;flex-wrap:wrap}
.score div{background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r-sm);padding:6px 12px;font-size:.85rem}
.score b{font-family:var(--f-display);font-size:1.1rem;font-variant-numeric:tabular-nums}
.streak b{color:var(--warn)}
.tier{display:inline-flex;gap:3px;vertical-align:middle}
.tier i{width:8px;height:14px;border-radius:2px;background:var(--line)}
.tier i.on{background:var(--signal)}

/* Progress charts */
.hbar{display:grid;grid-template-columns:minmax(110px,170px) minmax(0,1fr) 64px;gap:10px;align-items:center;font-size:.9rem}
.hbar .track{height:12px;background:var(--surface-2);border:1px solid var(--line);border-radius:999px;overflow:hidden}
.hbar .track i{display:block;height:100%;background:var(--accent)}

<script>const W=[];</script>
<script>/*@@WORDS@@*/</script>
<script>
(function(){
"use strict";
/* ---------- Datos ---------- */
const slug=s=>s.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
const grp=p=>/^adv/.test(p)?'adv':/^(adj|past)/.test(p)?'adj':/^v/.test(p)?'v':/^n/.test(p)?'n':/^idiom/.test(p)?'idiom':'other';
const WORDS=W.map((a,i)=>({id:slug(a[0]),i,w:a[0],pos:a[1],ipa:a[2],es:a[3],def:a[4],exM:a[5],simple:a[6],ex:[[a[7],a[8]],[a[9],a[10]]],col:a[11].split(';').map(s=>s.trim()).filter(Boolean),syn:a[12],err:a[13],hook:a[14],g:grp(a[1])}));
const BY=Object.fromEntries(WORDS.map(w=>[w.id,w]));
const BLOCK=6, BLOCKS=[];
for(let i=0;i<WORDS.length;i+=BLOCK) BLOCKS.push(WORDS.slice(i,i+BLOCK).map(w=>w.id));
const DAY=864e5, INTERVALS=[0,1,2,4,7,14,30,60];
const LEVELS=[
 {n:'Nueva',d:'Todavía no la has estudiado.'},
 {n:'En aprendizaje',d:'La estudiaste, pero aún no la has practicado con éxito.'},
 {n:'Recuerda con ayuda',d:'La reconoces cuando ves opciones o pistas.'},
 {n:'Recuerda sin ayuda',d:'La escribes desde su significado, sin opciones.'},
 {n:'La usa en frases',d:'Además, la usaste bien en una frase propia.'},
 {n:'Dominada',d:'La recordaste sin ayuda en 2 días distintos y la usaste en una frase.'}];
const TYPES={flash:'Flashcards',mc:'Opción múltiple',fill:'Completar la frase',match:'Emparejar',context:'Desafío de contexto',recall:'Recuerdo activo',sentence:'Crear frases'};
const RECALL=new Set(['fill','recall']);

/* ---------- Utilidades ---------- */
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const pick=a=>a[Math.floor(Math.random()*a.length)];
const mk=s=>esc(s).replace(/\[([^\]]+)\]/g,'<mark>$1</mark>');
const blank=s=>esc(s).replace(/\[([^\]]+)\]/g,'<span class="blank" aria-label="espacio en blanco">____</span>');
const formOf=s=>[...s.matchAll(/\[([^\]]+)\]/g)].map(m=>m[1]).join(' ');
const plain=s=>s.replace(/[\[\]]/g,'');
const norm=s=>String(s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[’‘`´]/g,"'").replace(/[^a-z' -]/g,'').replace(/\s+/g,' ').trim();
const baseOf=w=>w.w.replace(/ somebody$/,'');
function lev(a,b){const m=a.length,n=b.length;if(!m)return n;if(!n)return m;let p=Array.from({length:n+1},(_,j)=>j);for(let i=1;i<=m;i++){let c=[i];for(let j=1;j<=n;j++)c[j]=Math.min(p[j]+1,c[j-1]+1,p[j-1]+(a[i-1]===b[j-1]?0:1));p=c}return p[n]}
function dayKey(t=Date.now()){const d=new Date(t);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function accepts(w,typed,form){
  const t=norm(typed); if(!t) return {ok:false,empty:true};
  const c=new Set([w.w,baseOf(w),form].filter(Boolean).map(norm));
  for(const x of [...c]){c.add(x.replace(/-/g,' '));c.add(x.replace(/'/g,''));}
  const tv=[t,t.replace(/-/g,' '),t.replace(/'/g,'')];
  if(tv.some(x=>c.has(x))) return {ok:true};
  const b=norm(baseOf(w));
  if(b.length>=3&&t.startsWith(b)&&t.length-b.length<=3) return {ok:true,inflected:true};
  for(const x of c){const lim=x.length>=9?2:x.length>=5?1:0;if(lim&&lev(t,x)<=lim) return {ok:true,typo:x};}
  return {ok:false};
}
const ICON={
 home:'<path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/>',
 study:'<path d="M4 5h6a3 3 0 013 3v12a2 2 0 00-2-2H4z"/><path d="M20 5h-6a3 3 0 00-3 3v12a2 2 0 012-2h7z"/>',
 practice:'<circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="4"/><circle cx="12" cy="12" r=".6" fill="currentColor"/>',
 review:'<path d="M4 12a8 8 0 0114-5.3L20 8"/><path d="M20 4v4h-4"/><path d="M20 12a8 8 0 01-14 5.3L4 16"/><path d="M4 20v-4h4"/>',
 challenge:'<path d="M13 3L5 14h6l-1 7 8-11h-6z"/>',
 cards:'<rect x="3" y="6" width="14" height="14" rx="2"/><path d="M7 3h12a2 2 0 012 2v12"/>',
 progress:'<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>',
 sound:'<path d="M4 9h4l5-4v14l-5-4H4z"/><path d="M16 9a4 4 0 010 6M18.5 6.5a8 8 0 010 11"/>',
 ok:'<circle cx="12" cy="12" r="9"/><path d="M8 12l3 3 5-6"/>',
 bad:'<circle cx="12" cy="12" r="9"/><path d="M9 9l6 6M15 9l-6 6"/>',
 warn:'<circle cx="12" cy="12" r="9"/><path d="M12 7v6M12 16.5v.5"/>',
 arrowR:'<path d="M5 12h14M13 6l6 6-6 6"/>', arrowL:'<path d="M19 12H5M11 6l-6 6 6 6"/>',
 flag:'<path d="M5 21V4h11l-2 4 2 4H5"/>', bookmark:'<path d="M6 3h12v18l-6-4-6 4z"/>', check:'<path d="M5 12l5 5 9-10"/>'
};
const ic=(n,cls='')=>`<svg class="${cls}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICON[n]}</svg>`;
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('show'),2200)}
const canSpeak='speechSynthesis' in window && 'SpeechSynthesisUtterance' in window;
function speak(text){
  if(!canSpeak){toast('Este navegador no permite reproducir la pronunciación.');return}
  try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);const vs=speechSynthesis.getVoices();const v=vs.find(v=>/en[-_]GB/i.test(v.lang))||vs.find(v=>/^en/i.test(v.lang));if(v)u.voice=v;u.lang=v?v.lang:'en-GB';u.rate=.88;speechSynthesis.speak(u)}catch(e){toast('No se pudo reproducir el audio.')}
}
const spk=t=>canSpeak?`<button class="speak" data-act="speak" data-t="${esc(t)}" aria-label="Escuchar pronunciación de ${esc(t)}" title="Escuchar">${ic('sound')}</button>`:'';

/* ---------- Estado y guardado ---------- */
const LS='metro-vocab-v1';
const fresh=()=>({v:1,updated:0,p:{},types:{},daily:{},best:0,challenges:[],sent:{}});
let S=fresh();
try{const raw=localStorage.getItem(LS);if(raw){const o=JSON.parse(raw);if(o&&o.v===1)S=Object.assign(fresh(),o)}}catch(e){}
const store={mode:'local',ref:null,saving:false,again:false,failed:false};
function P(id){return S.p[id]||(S.p[id]={seen:0,box:0,due:0,rec:0,recN:0,recall:[],prod:0,wrong:0,lapse:0,hard:0,saved:0,known:0,conf:{},hist:[],last:0})}
function level(id){
  const p=S.p[id]; if(!p||(!p.seen&&!p.known)) return 0;
  let L=1;
  if(p.rec>0||p.recN>0) L=2;
  if(p.recN>0) L=3;
  if(p.prod>0&&p.recN>0) L=4;
  if(L===4&&new Set(p.recall).size>=2) L=5;
  if(p.lapse&&L>2) L=2;
  return L;
}
function save(){
  S.updated=Date.now();
  try{localStorage.setItem(LS,JSON.stringify(S))}catch(e){}
  if(store.ref){clearTimeout(save.t);save.t=setTimeout(pushCloud,1200)}
}
async function pushCloud(){
  if(!store.ref) return;
  if(store.saving){store.again=true;return}
  store.saving=true;
  try{await store.ref.set({state:JSON.stringify(S),updated:S.updated});store.mode='cloud';store.failed=false}
  catch(e){store.failed=true}
  store.saving=false; renderSaveState();
  if(store.again){store.again=false;pushCloud()}
}
function renderSaveState(){
  const el=$('#saveState'); el.classList.toggle('cloud',store.mode==='cloud'&&!store.failed);
  el.lastElementChild.textContent = store.mode==='cloud'&&!store.failed ? 'Guardado en tu cuenta' : store.failed ? 'Sin conexión · en este navegador' : 'En este navegador';
}
async function initCloud(){
  try{
    if(!window.claude||typeof window.claude.use!=='function') return;
    const [user,db]=await Promise.all([window.claude.use('user'),window.claude.use('db')]);
    if(!user||!db) return;
    const id=await user.id(); if(!id) return;
    const ref=db.doc('data/users/'+id+'/progress');
    const snap=await ref.get();
    store.ref=ref; store.mode='cloud';
    if(snap.exists){
      const d=snap.data()||{}; let c=null; try{c=JSON.parse(d.state)}catch(e){}
      if(c&&c.v===1&&(c.updated||0)>(S.updated||0)){S=Object.assign(fresh(),c);try{localStorage.setItem(LS,JSON.stringify(S))}catch(e){} if(!SES&&!ST) render()}
      else if((S.updated||0)>((c&&c.updated)||0)) pushCloud();
    } else if(S.updated) pushCloud();
  }catch(e){store.ref=null;store.mode='local'}
  finally{renderSaveState()}
}
function record(id,type,ok,o={}){
  const p=P(id), now=Date.now(), k=dayKey(now);
  p.seen=1; p.last=now;
  p.hist.push([now,type,ok?1:0]); if(p.hist.length>16) p.hist.shift();
  const t=S.types[type]||(S.types[type]={n:0,ok:0}); t.n++; if(ok) t.ok++;
  S.daily[k]=(S.daily[k]||0)+1;
  if(ok){
    if(type==='sentence'){p.prod++; if(p.box<2)p.box=2}
    else if(RECALL.has(type)&&!o.hinted){p.recN++; if(!p.recall.includes(k)){p.recall.push(k); if(p.recall.length>12)p.recall.shift()} p.lapse=0; p.box=Math.min(p.box+1,7)}
    else if(p.box<3) p.box++;
    if(o.weak) p.box=Math.max(1,p.box-1);
    p.due=now+INTERVALS[p.box]*DAY;
  } else {
    p.wrong++; p.lapse=1; p.box=1; p.due=now+10*60*1000;
    if(o.conf&&o.conf!==id) p.conf[o.conf]=(p.conf[o.conf]||0)+1;
  }
  save();
}
const isDue=(id,now=Date.now())=>{const p=S.p[id];return !!p&&((p.seen&&p.due<=now)||p.saved)};
function dueList(){
  const now=Date.now();
  return WORDS.filter(w=>isDue(w.id,now)).map(w=>{const p=S.p[w.id];const over=Math.max(0,(now-p.due)/DAY);return {id:w.id,score:over+p.wrong*1.5+p.hard*3+p.saved*4+(5-level(w.id))}}).sort((a,b)=>b.score-a.score);
}
const counts=()=>{const c=[0,0,0,0,0,0];WORDS.forEach(w=>c[level(w.id)]++);return c};
function blockState(b){
  const ids=BLOCKS[b], ls=ids.map(level);
  if(ls.every(l=>l===5)) return 'master';
  if(ls.every(l=>l>=1)) return 'done';
  if(ls.some(l=>l>=1)) return 'part';
  return '';
}
const nextBlock=()=>{const i=BLOCKS.findIndex(ids=>ids.some(id=>level(id)===0));return i<0?0:i};

/* ---------- Navegación ---------- */
const NAV=[['home','Inicio'],['study','Estudiar'],['practice','Practicar'],['review','Repaso'],['challenge','Desafío'],['cards','Fichas'],['progress','Progreso']];
let VIEW='home', SES=null, ST=null, LIB={q:'',f:'all',sel:null,open:{}};
function renderNav(){
  const due=dueList().length;
  $('#nav').innerHTML=NAV.map(([v,l])=>`<button data-act="go" data-v="${v}" ${VIEW===v?'aria-current="page"':''}>${ic(v)}<span>${l}</span>${v==='review'&&due?`<span class="badge num">${due}</span>`:''}</button>`).join('');
}
function go(v){
  if(VIEW!==v){ if(v!=='practice'&&v!=='review'&&v!=='challenge') SES=null; if(v!=='study') ST=null; if(SES&&SES.view!==v) SES=null; }
  VIEW=v; render(); window.scrollTo({top:0});
  try{history.replaceState(null,'','#'+v)}catch(e){}
}
function render(){
  renderNav();
  const v=$('#view');
  if((VIEW==='practice'||VIEW==='review'||VIEW==='challenge')&&SES) return renderSession();
  if(VIEW==='study'&&ST) return renderStudy();
  v.innerHTML=({home:viewHome,study:viewStudyIndex,practice:viewPractice,review:viewReview,challenge:viewChallenge,cards:viewCards,progress:viewProgress}[VIEW]||viewHome)();

}

/* ---------- Inicio ---------- */
function levelBar(c){const tot=WORDS.length;return `<div class="levels" role="img" aria-label="Distribución por nivel">${c.map((n,i)=>`<i style="width:${n/tot*100}%;background:var(--lv${i})" title="${LEVELS[i].n}: ${n}"></i>`).join('')}</div><div class="legend">${c.map((n,i)=>`<span><i class="sw" style="background:var(--lv${i})"></i>${LEVELS[i].n} <b class="num">${n}</b></span>`).join('')}</div>`}
function metroLine(){

}
function recommend(){
  const c=counts(), studied=WORDS.length-c[0], due=dueList().length;
  const nb=nextBlock(), bw=BLOCKS[nb].map(id=>BY[id].w);
  const learnBlock={t:`Aprende la Estación ${nb+1}`,d:`${bw.length} palabras nuevas: ${bw.join(', ')}. Primero la explicación y los ejemplos; después intentas recordarlas y escribes una frase propia.`,cta:'Empezar a estudiar',act:'block',arg:nb};
  if(studied===0) return {...learnBlock,t:'Empieza por la Estación 1',d:'Vas a aprender 6 palabras con su explicación, ejemplos y una frase propia. Son unos 15 minutos.'};
  if(due>=8) return {t:`Tienes ${due} palabras para repasar`,d:'Repasarlas ahora, justo cuando empiezan a olvidarse, es lo que más fija la memoria. Empezamos por las más difíciles.',cta:'Empezar repaso',act:'startReview'};
  if(c[1]>=4) return {t:'Pon a prueba lo que estudiaste',d:`Hay ${c[1]} palabras que estudiaste pero aún no practicaste con éxito. Una sesión mixta te dirá cuáles ya recuerdas.`,cta:'Práctica mixta',act:'startPractice',arg:'mixed'};
  if(c[2]>=6) return {t:'Pasa de reconocer a recordar',d:`${c[2]} palabras las reconoces con opciones. El siguiente paso es escribirlas sin ayuda: recuerdo activo.`,cta:'Recuerdo activo',act:'startPractice',arg:'recall'};
  if(c[3]>=4) return {t:'Úsalas en tus propias frases',d:`Ya recuerdas ${c[3]} palabras sin ayuda. Escribir una frase con cada una es lo que te permite usarlas en inglés real.`,cta:'Crear frases',act:'startPractice',arg:'sentence'};
  if(due>0) return {t:`Repasa ${due} palabra${due>1?'s':''}`,d:'Te tocan según tu calendario de repaso. Son pocas: unos minutos bastan.',cta:'Empezar repaso',act:'startReview'};
  if(c[0]>0) return learnBlock;
  return {t:'Mide tu dominio en el desafío',d:'Has recorrido toda la línea. Haz un desafío para comprobar qué palabras siguen firmes.',cta:'Empezar desafío',act:'startChallenge'};
}
function viewHome(){

  const pct=Math.round(c.reduce((s,n,i)=>s+n*i,0)/(tot*5)*100);

    </div>
  </section>
  <section class="card stack">

    <button class="qa" data-act="go" data-v="review">${ic('review')}<b>Repasar</b><span>${due?`${due} palabras esperan repaso.`:'Nada pendiente ahora mismo.'}</span></button>
    <button class="qa" data-act="go" data-v="challenge">${ic('challenge')}<b>Desafío</b><span>Quiz con dificultad progresiva y racha.</span></button>
  </section>
  <details class="card flat">
    <summary>Cómo mide el sistema tu dominio</summary>
    <div class="stack" style="margin-top:12px">
      ${LEVELS.map((l,i)=>`<div class="row" style="align-items:flex-start;flex-wrap:nowrap"><span class="chip"><i class="sw" style="background:var(--lv${i})"></i>${l.n}</span><span class="small muted">${l.d}</span></div>`).join('')}
      <p class="small muted">Acertar una pregunta de opción múltiple no basta para dominar una palabra. Si fallas una, vuelve a «Recuerda con ayuda» hasta que la escribas bien sin pistas. Los repasos se programan a 1, 2, 4, 7, 14, 30 y 60 días.</p>
    </div>
  </details>`;
}

/* ---------- Estudiar ---------- */
function viewStudyIndex(){

function mountSentence(){ const t=$('#sbText'); if(t) t.addEventListener('keydown',e=>{if(e.key==='Enter'&&(e.metaKey||e.ctrlKey)){e.preventDefault();$('[data-act="sbSubmit"]')?.click()}}) }
function mentions(w,text){
  const flat=s=>norm(s).replace(/-/g,' ').replace(/'/g,'');
  const t=' '+flat(text)+' ';
  const key=flat(baseOf(w)).split(' ').filter(x=>x.length>2&&!['the','for','act'].includes(x));
  const k=key.length?key:[flat(baseOf(w))];
  const stem=part=>{let s=part.length>3?part.replace(/e$/,''):part;if(s.length>5)s=s.slice(0,-1);return s};
  const irregular={thrust:['thrust'],wring:['wrung','wring'],sob:['sobb','sob'],stir:['stirr','stir'],stun:['stunn','stun'],come:['came','come','coming'],caught:['catch','caught'],fetch:['fetch'],defer:['deferr','defer'],intersected:['intersect'],captivated:['captivat'],demoralized:['demoralis','demoraliz'],severing:['sever'],revelries:['revelr'],clairvoyants:['clairvoyant'],buskers:['busker'],hawkers:['hawker'],advances:['advance'],papers:['paper']};
  return k.every(part=>{const stems=irregular[part]||[stem(part)];return stems.some(s=>t.includes(' '+s)||t.includes('-'+s))});
}
async function submitSentence(id,ctx){

      const r=await sampleFn.json(`You are a kind, precise English teacher for a Spanish-speaking adult learner.

Student sentence: """${text.slice(0,500)}"""

{"verdict":"correct"|"correct_but_unnatural"|"grammar_error"|"wrong_meaning","word_used_correctly":true|false,"feedback_es":"2-3 frases en español, amables y específicas: qué está bien y qué cambiar","corrected":"corrected sentence in English, or empty string if no errors","more_natural":"a more natural version in English, or empty string"}
word_used_correctly is true only if the target word is used with the meaning from the reading and with correct grammar around it.`,{modelTier:'quick'});

      return;

function distractors(w,n,pool){
  const base=(pool&&pool.length>=n+1?pool.map(i=>BY[i]):WORDS).filter(x=>x.id!==w.id);
  const same=shuffle(base.filter(x=>x.g===w.g)), other=shuffle(base.filter(x=>x.g!==w.g));
  let res=same.slice(0,n); if(res.length<n) res=res.concat(other.slice(0,n-res.length));
  if(res.length<n) res=res.concat(shuffle(WORDS.filter(x=>x.id!==w.id&&!res.includes(x))).slice(0,n-res.length));
  return res;
}

  $('#view').innerHTML=`
   <section class="sess-head">
     <div class="sess-top"><button class="btn ghost sm" data-act="exitSession">${ic('arrowL')} Salir</button><span class="small muted num">${esc(SES.title)} · ${SES.i+1} de ${n}</span></div>

   </section>
   <section class="card ex fade-in" id="ex">${EX[it.type].html(it)}</section>
   <section id="fb" hidden></section>`;
  EX[it.type].mount?.(it);

function sessResult(id,type,ok,o={}){
  record(id,type,ok,o);
  SES.res.push({id,type,ok});
  if(SES.kind==='challenge'){
    if(ok){SES.streak++;SES.best=Math.max(SES.best,SES.streak);SES.wrongRow=0;SES.score+=Math.round(10*SES.tier*(1+Math.min(SES.streak-1,5)*.1));if(SES.streak%3===0&&SES.tier<3)SES.tier++}
    else{SES.streak=0;SES.wrongRow++;if(SES.wrongRow>=2&&SES.tier>1){SES.tier--;SES.wrongRow=0}}
  } else if(!ok&&!CUR.it.retry&&type!=='match'){
    const pos=Math.min(SES.items.length,SES.i+3);

/* ---------- Construcción de sesiones ---------- */
function studiedIds(){return WORDS.filter(w=>level(w.id)>=1).map(w=>w.id)}
function poolFor(sel){
  if(sel==='hard') return WORDS.filter(w=>{const p=S.p[w.id];return p&&(p.hard||p.wrong>0)}).map(w=>w.id);
  if(sel==='all') return WORDS.map(w=>w.id);
  const s=studiedIds(); return s.length>=6?s:WORDS.map(w=>w.id);
}
function typeFor(id){
  const L=level(id), p=S.p[id]; const lastWrong=p&&p.hist.length&&!p.hist[p.hist.length-1][2];
  const tiers=[['flash'],['mc','context','flash'],['context','fill','mc'],['recall','fill','context'],['recall','sentence','fill'],['recall','context','sentence']];
  let t=L; if(lastWrong) t=Math.max(0,t-1);
  return pick(tiers[t]);
}
function prioritize(ids,n){
  const now=Date.now();
  return ids.map(id=>{const p=S.p[id];const due=p&&p.seen&&p.due<=now?3:0;return {id,s:due+(p?p.wrong*.6+p.hard*2:0)+(5-level(id))*.5+Math.random()*2}}).sort((a,b)=>b.s-a.s).slice(0,n).map(x=>x.id);
}
function buildPractice(type,sel,n=10){
  const pool=poolFor(sel);
  if(!pool.length){toast('No hay palabras en ese grupo todavía.');return null}
  if(type==='match'){const ids=shuffle(prioritize(pool,Math.min(15,pool.length)));const items=[];for(let i=0;i+2<=ids.length&&items.length<3;i+=5)items.push({type:'match',ids:ids.slice(i,i+5),id:ids[i]});return items}
  const ids=prioritize(pool,Math.min(n,pool.length));
  let items=ids.map(id=>({id,type:type==='mixed'?typeFor(id):type,pool}));
  if(type==='mixed'){
    const low=ids.filter(id=>level(id)<=2); if(low.length>=4) items.splice(Math.floor(items.length/2),0,{type:'match',ids:shuffle(low).slice(0,5),id:low[0]});
    const rank={flash:0,mc:1,match:2,context:2,fill:3,recall:4,sentence:5}; items.sort((a,b)=>rank[a.type]-rank[b.type]);
  }
  return items;
}
function startPractice(type,sel){
  const items=buildPractice(type,sel||LIB.pool||'studied'); if(!items) return;
  startSession('practice',type,items,type==='mixed'?'Práctica mixta':TYPES[type]);
}
function startReview(){
  const d=dueList(); if(!d.length){toast('No tienes palabras pendientes de repaso.');return}
  const items=d.slice(0,15).map(x=>{const L=level(x.id);const t=L>=3?pick(['recall','fill','sentence']):L>=2?pick(['fill','context','recall']):pick(['mc','context']);return {id:x.id,type:t}});
  items.forEach(it=>{P(it.id).saved=0}); save();
  startSession('review','review',items,'Repaso');
}
function fillChallenge(it){
  const used=new Set(SES.items.filter(x=>x.id).map(x=>x.id));
  const studied=studiedIds(); const src=studied.length>=8&&Math.random()<.75?studied:WORDS.map(w=>w.id);
  const cand=src.filter(id=>!used.has(id)); const id=pick(cand.length?cand:src);
  it.id=id; SES.before[id]=level(id); it.type=pick(SES.tier===1?['mc','context']:SES.tier===2?['context','fill']:['recall','fill']);
}

    ${sec('syn','Sinónimos y diferencias','<p>'+esc(w.syn)+'</p>')}
    ${sec('err','Errores comunes','<p>'+esc(w.err)+'</p>')}
    ${sec('hook','Truco para recordar','<p class="hook">'+esc(w.hook)+'</p>')}
    <div class="row"><button class="btn sm" data-act="revealAll" data-id="${id}">Revelar todo</button></div>
    <div class="foot" style="border-top:1px solid var(--line);padding-top:14px">
      <button class="btn sm ${p.known?'':'primary'}" data-act="markKnown" data-id="${id}">${ic('check')} ${p.known?'Quitar «aprendida»':'Marcar como aprendida'}</button>
      <button class="btn sm" data-act="toggleSaved" data-id="${id}">${ic('bookmark')} ${p.saved?'Quitar del repaso':'Guardar para repasar'}</button>
      <button class="btn sm" data-act="toggleHard" data-id="${id}">${ic('flag')} ${p.hard?'Quitar «difícil»':'Difícil'}</button>
      <button class="btn sm" data-act="drill" data-ids="${id}">Practicar esta palabra</button>
    </div>
    ${p.known?'<p class="small muted">Marcarla como aprendida la deja en el repaso dentro de 2 días: el sistema comprobará que la recuerdas sin ayuda antes de darla por dominada.</p>':''}
  </article>`;
}
function refreshDetail(){ if(VIEW!=='cards') return; $('#detail').innerHTML=LIB.sel?detailHTML(LIB.sel):''; $('#lib').classList.toggle('detail-open',!!LIB.sel); renderWlist() }

/* ---------- Progreso ---------- */
function hbar(label,ok,n){const pct=n?Math.round(ok/n*100):0;return `<div class="hbar"><span>${esc(label)}</span><span class="track"><i style="width:${pct}%;background:${pct>=80?'var(--ok)':pct>=50?'var(--accent)':'var(--bad)'}"></i></span><span class="v">${n?pct+'%':'—'} <small>(${ok}/${n})</small></span></div>`}
function viewProgress(){
  const c=counts(), now=Date.now();
  const seen=WORDS.filter(w=>S.p[w.id]&&S.p[w.id].hist.length);
  const best=[...seen].map(w=>{const p=S.p[w.id];const okN=p.hist.filter(h=>h[2]).length;return {w,s:level(w.id)*10+p.box*2+okN-p.wrong*3}}).filter(x=>x.s>0).sort((a,b)=>b.s-a.s).slice(0,8);
  const confused=[...seen].filter(w=>S.p[w.id].wrong>0).sort((a,b)=>S.p[b.id].wrong-S.p[a.id].wrong).slice(0,8);
  const pairs=[]; WORDS.forEach(w=>{const p=S.p[w.id];if(p)Object.entries(p.conf).forEach(([o,n])=>{if(BY[o])pairs.push({a:w,b:BY[o],n})})}); pairs.sort((x,y)=>y.n-x.n);
  const typeRows=Object.keys(TYPES).map(t=>{const v=S.types[t]||{n:0,ok:0};return hbar(TYPES[t],v.ok,v.n)}).join('');
  const days=Array.from({length:7},(_,i)=>{const start=new Date();start.setHours(0,0,0,0);const a=start.getTime()+i*DAY,b=a+DAY;const n=WORDS.filter(w=>{const p=S.p[w.id];return p&&p.seen&&(i===0?p.due<b:p.due>=a&&p.due<b)}).length;return {n,label:i===0?'Hoy':new Date(a).toLocaleDateString('es',{weekday:'short'})}});
  const maxD=Math.max(1,...days.map(d=>d.n));
  const act=Array.from({length:14},(_,i)=>{const k=dayKey(now-(13-i)*DAY);return S.daily[k]||0}); const maxA=Math.max(1,...act);
  const sents=Object.entries(S.sent).flatMap(([id,a])=>a.map(s=>({...s,id}))).sort((a,b)=>b.t-a.t).slice(0,8);
  return `<section class="card stack"><p class="eyebrow">Panel de progreso</p><h1>Progreso</h1>${levelBar(c)}</section>
  <section class="grid-2">
    <div class="card stack"><h3>Las que mejor recuerdas</h3>${best.length?`<div class="wl">${best.map(x=>`<div><button data-act="openWord" data-id="${x.w.id}">${esc(x.w.w)}</button><span class="chip"><i class="sw" style="background:var(--lv${level(x.w.id)})"></i>${LEVELS[level(x.w.id)].n}</span></div>`).join('')}</div>`:'<p class="empty">Aparecerán cuando practiques.</p>'}</div>
    <div class="card stack"><h3>Las que más te cuestan</h3>${confused.length?`<div class="wl">${confused.map(w=>`<div><button data-act="openWord" data-id="${w.id}">${esc(w.w)}</button><span class="small muted num">${S.p[w.id].wrong} error${S.p[w.id].wrong>1?'es':''}</span></div>`).join('')}</div><button class="btn sm" data-act="drill" data-ids="${confused.map(w=>w.id).join(',')}" style="justify-self:start">Practicar estas palabras</button>`:'<p class="empty">Sin errores registrados todavía.</p>'}</div>
  </section>
  <section class="grid-2">
    <div class="card stack"><h3>Confusiones frecuentes</h3><p class="small muted">Palabras que elegiste o escribiste en lugar de la correcta.</p>${pairs.length?`<div class="wl">${pairs.slice(0,8).map(x=>`<div><span><b>${esc(x.a.w)}</b> <span class="muted">↔</span> <b>${esc(x.b.w)}</b></span><span class="small muted num">${x.n}×</span></div>`).join('')}</div>`:'<p class="empty">Ninguna confusión registrada.</p>'}</div>
    <div class="card stack"><h3>Resultados por tipo de ejercicio</h3>${typeRows}</div>
  </section>
  <section class="grid-2">
    <div class="card stack"><h3>Repasos de los próximos 7 días</h3><div class="cols">${days.map(d=>`<div class="colb"><b>${d.n}</b><i style="height:${d.n/maxD*100}%"></i><small>${esc(d.label)}</small></div>`).join('')}</div></div>
    <div class="card stack"><h3>Actividad (últimos 14 días)</h3><div class="cols" style="grid-template-columns:repeat(14,minmax(0,1fr))">${act.map((n,i)=>`<div class="colb"><b>${n||''}</b><i style="height:${n/maxA*100}%;background:var(--lv2)"></i><small>${i===13?'hoy':''}</small></div>`).join('')}</div><p class="small muted">Respuestas por día.</p></div>
  </section>
  <section class="card stack"><h3>Tus frases recientes</h3>${sents.length?`<div class="wl">${sents.map(s=>`<div><span><b>${esc(BY[s.id]?.w||'')}</b> — “${esc(s.text)}”</span><span class="chip ${s.ok?'ok':'hard'}">${s.ok?'Correcta':'A revisar'}</span></div>`).join('')}</div>`:'<p class="empty">Cuando escribas frases propias aparecerán aquí.</p>'}</section>
  <section class="card stack"><h3>Copia de seguridad</h3>
    <p class="small muted">${store.mode==='cloud'?'Tu progreso ya se guarda en tu cuenta. ':'El progreso se guarda solo en este navegador. '}Copia este código y guárdalo donde quieras; pégalo aquí para restaurar tu progreso en cualquier navegador.</p>
    <div class="row"><button class="btn sm" data-act="copyCode">Copiar código de respaldo</button></div>
    <div id="codeOut"></div>
    <label class="small muted" for="restore">Restaurar desde un código</label>
    <textarea id="restore" style="min-height:70px" placeholder="Pega aquí tu código de respaldo"></textarea>
    <div class="row"><button class="btn sm" data-act="restore">Restaurar</button><button class="btn ghost sm" data-act="reset" id="resetBtn">Reiniciar todo el progreso</button></div>
  </section>`;
}
const encode=()=>btoa(unescape(encodeURIComponent(JSON.stringify(S))));
function decode(s){const o=JSON.parse(decodeURIComponent(escape(atob(s.trim()))));if(!o||o.v!==1||typeof o.p!=='object')throw 0;return Object.assign(fresh(),o)}

/* ---------- Acciones ---------- */
const ACT={
 go:b=>go(b.dataset.v),
 speak:b=>speak(b.dataset.t),
 block:b=>startBlock(b.dataset.b),
 exitStudy:()=>{ST=null;go('study');render()},
 step:b=>{ST.step=+b.dataset.s;if(ST.step!==3){delete ST.rev.recall;delete ST.rev.rated}renderStudy()},
 studyNext:()=>studyMove(1), studyPrev:()=>studyMove(-1),
 rev:b=>{ST.rev[b.dataset.k]=1;renderStudy()},
 studyRate:b=>{const id=BLOCKS[ST.b][ST.wi],r=b.dataset.r;record(id,'flash',r!=='again',{weak:r==='hard'});if(r==='again'){P(id).hard=1;save()}ST.rev.rated=1;toast(r==='good'?'¡Bien! Ahora escribe una frase.':'Anotado: la repasarás pronto.');ST.step=4;renderStudy()},
 toggleHard:b=>{const p=P(b.dataset.id);p.hard=p.hard?0:1;save();toast(p.hard?'Marcada como difícil.':'Ya no está marcada como difícil.');if(ST)renderStudy();else refreshDetail()},
 toggleSaved:b=>{const p=P(b.dataset.id);p.saved=p.saved?0:1;save();renderNav();toast(p.saved?'Guardada para tu próximo repaso.':'Quitada del repaso.');refreshDetail()},
 markKnown:b=>{const p=P(b.dataset.id);if(p.known){p.known=0}else{p.known=1;p.seen=1;p.box=Math.max(p.box,2);p.due=Date.now()+2*DAY}save();toast(p.known?'Marcada como aprendida. Se verificará en el repaso.':'Marca quitada.');refreshDetail()},
 practiceBlock:b=>{const ids=BLOCKS[+b.dataset.b];const items=[{type:'match',ids:shuffle(ids).slice(0,5),id:ids[0]}].concat(shuffle(ids).map(id=>({id,type:'mc',pool:ids})),shuffle(ids).map(id=>({id,type:'context',pool:ids})),shuffle(ids).map(id=>({id,type:'recall'})));ST=null;startSession('practice','block',items,`Práctica · Estación ${+b.dataset.b+1}`)},
 startPractice:b=>startPractice(b.dataset.t||'mixed'),
 startReview:()=>startReview(),
 startChallenge:()=>startChallenge(),
 pool:b=>{LIB.pool=b.dataset.p;render()},
 exitSession:()=>{const v=SES.view;SES=null;go(v);render()},
 again:()=>{const k=SES.kind,v=SES.view;SES=null;if(k==='challenge')startChallenge();else if(k==='review'){VIEW='review';dueList().length?startReview():render()}else{VIEW='practice';startPractice(k==='block'?'mixed':k)}},
 drill:b=>{const ids=b.dataset.ids.split(',').filter(id=>BY[id]);const items=[];ids.forEach(id=>{const L=level(id);items.push({id,type:L>=2?'context':'mc'});items.push({id,type:L>=3?'sentence':'recall'})});const ord={mc:0,context:1,recall:2,sentence:3};items.sort((a,b)=>ord[a.type]-ord[b.type]);SES=null;startSession('practice','mixed',items,ids.length===1?`Práctica · ${BY[ids[0]].w}`:'Práctica de errores')},
 opt:b=>chooseOpt(b.dataset.id),
 check:()=>check(),
 hint:()=>{const it=CUR.it,w=BY[it.id];it.hinted=1;const f=formOf(w.ex[0][0]);$('#hintOut').textContent=`Empieza por «${f[0]}» y tiene ${f.replace(/[^a-zA-Z]/g,'').length} letras.`;$('#hintBtn').disabled=true;$('#ans').focus()},
 giveUp:()=>{if(CUR.done)return;const w=BY[CUR.it.id];sessResult(w.id,CUR.it.type,false);$('#ans').readOnly=true;$('[data-act="check"]').disabled=true;feedback(false,`<p>La palabra es <b>${esc(w.w)}</b>.</p><p>${mk(w.ex[0][0])}</p>`)},
 next:()=>next(),
 flip:()=>{$('#flash').classList.add('flipped');$('#flashActs').innerHTML=`<p class="small muted">¿Lo sabías?</p><div class="row"><button class="btn" data-act="rate" data-r="again">No la sabía</button><button class="btn" data-act="rate" data-r="hard">Con dudas</button><button class="btn primary" data-act="rate" data-r="good">La sabía</button></div>`},
 rate:b=>{if(CUR.done)return;const r=b.dataset.r,w=BY[CUR.it.id];sessResult(w.id,'flash',r!=='again',{weak:r==='hard'});$('#flashActs').innerHTML='';feedback(r!=='again',r==='again'?`<p>Sin problema: ahora la conoces mejor. Volverá en unos minutos.</p>`:`<p>${r==='hard'?'La repasarás un poco antes.':'Perfecto.'} Recuerda que reconocerla no es lo mismo que recordarla: más adelante te la pediremos sin ayuda.</p>`)},
 mL:b=>matchClick('L',b.dataset.id,b), mR:b=>matchClick('R',b.dataset.id,b),
 sbSubmit:b=>submitSentence(b.dataset.id,b.dataset.ctx),
 sbRetry:()=>renderStudy(),
 selfOk:b=>{saveSentence(b.dataset.id,CUR_SB.text,true,'self');sentenceDone(b.dataset.id,true,b.dataset.ctx,`<div class="fb ok"><div class="fb-head">${ic('ok')} Frase registrada</div><p>Anotada como correcta según tu autoevaluación.</p></div>`)},
 selfBad:b=>{saveSentence(b.dataset.id,CUR_SB.text,false,'self');if(b.dataset.ctx==='study'){$('#sbText').readOnly=false;$('[data-act="sbSubmit"]').disabled=false;$('#sbOut').innerHTML='<p class="note">Corrige tu frase y vuelve a evaluarla.</p>';$('#sbText').focus()}else sentenceDone(b.dataset.id,false,'session',`<div class="fb bad"><div class="fb-head">${ic('bad')} A revisar</div><p>La practicarás de nuevo pronto.</p></div>`)},
 filter:b=>{LIB.f=b.dataset.f;$$('#filters button').forEach(x=>x.setAttribute('aria-pressed',x===b));renderWlist()},
 openWord:b=>{LIB.sel=b.dataset.id;if(VIEW!=='cards'){go('cards')}else{refreshDetail();if(innerWidth<860)window.scrollTo({top:0})}},
 closeWord:()=>{LIB.sel=null;refreshDetail();$('#detail').innerHTML='<div class="card"><p class="empty">Elige una palabra de la lista para abrir su ficha.</p></div>'},
 revealSec:b=>{const o=LIB.open[b.dataset.id]||(LIB.open[b.dataset.id]={});o[b.dataset.k]=1;P(b.dataset.id).seen=1;save();refreshDetail()},
 revealAll:b=>{LIB.open[b.dataset.id]={es:1,simple:1,ctx:1,ex:1,col:1,syn:1,err:1,hook:1};P(b.dataset.id).seen=1;save();refreshDetail()},
 copyCode:()=>{const code=encode();const out=$('#codeOut');out.innerHTML=`<div class="code" id="codeBox" tabindex="0">${esc(code)}</div>`;const sel=()=>{const r=document.createRange();r.selectNodeContents($('#codeBox'));const s=getSelection();s.removeAllRanges();s.addRange(r)};try{navigator.clipboard.writeText(code).then(()=>toast('Código copiado.'),()=>{sel();toast('Selecciona y copia el código manualmente.')})}catch(e){sel();toast('Selecciona y copia el código manualmente.')}},
 restore:()=>{try{S=decode($('#restore').value);save();if(store.ref)pushCloud();toast('Progreso restaurado.');render()}catch(e){toast('El código no es válido. Cópialo completo e inténtalo de nuevo.')}},
 reset:b=>{if(b.dataset.armed){S=fresh();save();if(store.ref)pushCloud();toast('Progreso reiniciado.');render()}else{b.dataset.armed=1;b.textContent='Pulsa otra vez para confirmar';b.classList.remove('ghost');b.style.color='var(--bad)';setTimeout(()=>{if(b.isConnected){delete b.dataset.armed;b.textContent='Reiniciar todo el progreso';b.classList.add('ghost');b.style.color=''}},4000)}}
};
document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b||b.disabled)return;const f=ACT[b.dataset.act];if(f){e.preventDefault();f(b,e)}});
document.addEventListener('keydown',e=>{
  if(!SES||!CUR||e.target.matches('input,textarea')) return;
  if(e.key==='Enter'&&CUR.done){e.preventDefault();next();return}
  if(/^[1-4]$/.test(e.key)&&!CUR.done){const b=$$('.opt')[+e.key-1];if(b){b.click()}}
});
if(canSpeak){try{speechSynthesis.getVoices();speechSynthesis.onvoiceschanged=()=>{}}catch(e){}}

/* ---------- Arranque ---------- */
const h=(location.hash||'').slice(1); if(NAV.some(n=>n[0]===h)) VIEW=h;
render(); renderSaveState();
setTimeout(()=>{ initCloud(); if(window.claude&&typeof window.claude.use==='function') window.claude.use('sample').then(s=>{sampleFn=s}).catch(()=>{}); },0);
})();
</script>

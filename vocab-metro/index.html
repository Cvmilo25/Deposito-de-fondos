<title>The Metro Vocabulary</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Overpass:wght@500;700;800&family=Noto+Sans:wght@400&display=swap">
<style>
/* Layout: una línea de metro. Los bloques de 6 palabras son estaciones; el progreso se lee como un recorrido. */
:root{
  --bg:#EDF1F0; --surface:#FFFFFF; --surface-2:#F5F8F7; --ink:#13201C; --muted:#56665F; --line:#D4DDDA;
  --accent:#2747D0; --accent-ink:#FFFFFF; --accent-soft:#E2E8FC; --signal:#F2B705; --signal-ink:#1F1700;
  --ok:#16773A; --ok-soft:#E0F2E6; --bad:#B53920; --bad-soft:#FBE6E0; --warn:#8F5D00; --warn-soft:#FBF0D6;
  --lv0:#C5D0CC; --lv1:#A6BEF4; --lv2:#6B8EEE; --lv3:#2747D0; --lv4:#E0A912; --lv5:#16773A;
  --shadow:0 1px 2px rgb(19 32 28 / .06), 0 8px 24px rgb(19 32 28 / .07);
  --f-display:"Overpass","Segoe UI",system-ui,sans-serif;
  --f-body:"Atkinson Hyperlegible","Segoe UI",system-ui,sans-serif;
  --f-ipa:"Noto Sans","Segoe UI","Lucida Sans Unicode",system-ui,sans-serif;
  --r:16px; --r-sm:10px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0E1412; --surface:#161E1B; --surface-2:#1C2622; --ink:#E6EEEA; --muted:#9AABA4; --line:#2A3632;
  --accent:#7F9CFF; --accent-ink:#0B1230; --accent-soft:#1F2A4D; --signal:#F4C430; --signal-ink:#1F1700;
  --ok:#4CC57A; --ok-soft:#14301F; --bad:#FF8466; --bad-soft:#3A1C14; --warn:#E9B54D; --warn-soft:#33270F;
  --lv0:#34403C; --lv1:#3A5296; --lv2:#5578EE; --lv3:#8FA8FF; --lv4:#F4C430; --lv5:#4CC57A;
  --shadow:0 1px 2px rgb(0 0 0 / .3), 0 8px 24px rgb(0 0 0 / .25); color-scheme:dark; } }
:root[data-theme="dark"]{
  --bg:#0E1412; --surface:#161E1B; --surface-2:#1C2622; --ink:#E6EEEA; --muted:#9AABA4; --line:#2A3632;
  --accent:#7F9CFF; --accent-ink:#0B1230; --accent-soft:#1F2A4D; --signal:#F4C430; --signal-ink:#1F1700;
  --ok:#4CC57A; --ok-soft:#14301F; --bad:#FF8466; --bad-soft:#3A1C14; --warn:#E9B54D; --warn-soft:#33270F;
  --lv0:#34403C; --lv1:#3A5296; --lv2:#5578EE; --lv3:#8FA8FF; --lv4:#F4C430; --lv5:#4CC57A;
  --shadow:0 1px 2px rgb(0 0 0 / .3), 0 8px 24px rgb(0 0 0 / .25); color-scheme:dark; }

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
h1,h2,h3,h4{font-family:var(--f-display);line-height:1.15;margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:clamp(1.7rem,4vw,2.4rem);font-weight:800}
h2{font-size:1.45rem;font-weight:800}
h3{font-size:1.1rem;font-weight:700}
p{margin:0}
button,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:6px}
mark{background:var(--signal);color:var(--signal-ink);padding:0 .2em;border-radius:4px;font-weight:700}
.ipa{font-family:var(--f-ipa);color:var(--muted)}
.muted{color:var(--muted)}
.small{font-size:.875rem}
.eyebrow{font-family:var(--f-display);font-size:.75rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.num{font-variant-numeric:tabular-nums}

/* Header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.top-in{max-width:1120px;margin:0 auto;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--f-display);font-weight:800;font-size:1.05rem;white-space:nowrap;background:none;border:0;padding:0;cursor:pointer}
.brand .roundel{width:30px;height:30px;border-radius:50%;border:5px solid var(--accent);position:relative;flex:none}
.brand .roundel::after{content:"";position:absolute;left:-9px;right:-9px;top:50%;height:6px;margin-top:-3px;background:var(--signal);border-radius:2px}
.nav{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;flex:0 1 auto;min-width:0}
.nav::-webkit-scrollbar{display:none}
.nav button{display:flex;align-items:center;gap:6px;border:0;background:none;padding:8px 12px;border-radius:999px;cursor:pointer;font-weight:700;font-size:.92rem;color:var(--muted);white-space:nowrap}
.nav button svg{width:18px;height:18px;flex:none}
.nav button:hover{background:var(--surface-2);color:var(--ink)}
.nav button[aria-current="page"]{background:var(--accent);color:var(--accent-ink)}
.nav .badge{background:var(--signal);color:var(--signal-ink);border-radius:999px;font-size:.72rem;padding:0 7px;line-height:1.5}
.save-state{margin-left:auto;font-size:.78rem;color:var(--muted);display:flex;align-items:center;gap:6px;white-space:nowrap}
.save-state .dot{width:8px;height:8px;border-radius:50%;background:var(--warn)}
.save-state.cloud .dot{background:var(--ok)}
@media (min-width:761px) and (max-width:1240px){ .save-state span:last-child{display:none} .nav button{padding:8px 10px} }
@media (max-width:760px){ .top-in{gap:8px} .nav{order:3;flex-basis:100%} .nav button span.lbl-long{display:none} }

main{max-width:1120px;margin:0 auto;padding-block:24px 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:24px}

/* Generic */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;box-shadow:var(--shadow);min-width:0}
.card.flat{box-shadow:none}
.stack{display:grid;gap:12px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.grid-2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:20px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:var(--surface);padding:10px 16px;border-radius:999px;font-weight:700;cursor:pointer;transition:transform .12s ease, background .15s ease;text-decoration:none;min-height:44px}
.btn:hover{background:var(--surface-2)}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.06);background:var(--accent)}
.btn.signal{background:var(--signal);color:var(--signal-ink);border-color:var(--signal)}
.btn.ghost{background:transparent;border-color:transparent}
.btn.sm{min-height:36px;padding:6px 12px;font-size:.9rem}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn svg{width:18px;height:18px}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:2px 10px;font-size:.8rem;font-weight:700;background:var(--surface-2);border:1px solid var(--line);white-space:nowrap}
.chip .sw{width:9px;height:9px;border-radius:50%}
.chip.hard{background:var(--bad-soft);border-color:transparent;color:var(--bad)}
.chip.saved{background:var(--warn-soft);border-color:transparent;color:var(--warn)}
.chip.ok{background:var(--ok-soft);border-color:transparent;color:var(--ok)}
.pos{font-family:var(--f-display);font-size:.78rem;font-weight:700;color:var(--accent);background:var(--accent-soft);padding:1px 8px;border-radius:6px}
.speak{border:1px solid var(--line);background:var(--surface);border-radius:50%;width:40px;height:40px;display:inline-grid;place-items:center;cursor:pointer;flex:none}
.speak svg{width:18px;height:18px}
.speak:hover{background:var(--accent-soft)}
.bar{height:10px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line);overflow:hidden}
.bar > i{display:block;height:100%;background:var(--accent);border-radius:999px;transition:width .5s ease}

/* Dashboard */
.hero{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:20px}
@media (max-width:860px){.hero{grid-template-columns:1fr}}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(100px,1fr));gap:10px}
.kpi{background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r-sm);padding:14px}
.kpi b{display:block;font-family:var(--f-display);font-size:1.9rem;font-weight:800;line-height:1.1;font-variant-numeric:tabular-nums}
.kpi span{font-size:.85rem;color:var(--muted)}
.reco{background:var(--accent);color:var(--accent-ink);border-radius:var(--r);padding:22px;display:grid;gap:12px;align-content:start}
.reco .eyebrow{color:inherit;opacity:.8}
.reco h2{font-size:1.35rem}
.reco p{opacity:.92}
.reco .btn{background:var(--signal);color:var(--signal-ink);border-color:var(--signal);justify-self:start}
.quick{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));gap:12px}
.qa{display:grid;gap:6px;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:16px;cursor:pointer;transition:transform .15s ease,border-color .15s ease}
.qa:hover{transform:translateY(-2px);border-color:var(--accent)}
.qa svg{width:24px;height:24px;color:var(--accent)}
.qa b{font-family:var(--f-display);font-size:1.05rem}
.qa span{font-size:.88rem;color:var(--muted)}

/* Metro line */
.line-wrap{overflow-x:auto;padding:6px 2px 4px}
.line{display:flex;align-items:flex-start;position:relative;min-width:max-content;padding:0 6px}
.line::before{content:"";position:absolute;left:24px;right:24px;top:17px;height:8px;background:var(--accent);border-radius:4px;opacity:.25}
.stn{position:relative;display:grid;justify-items:center;gap:4px;width:44px;background:none;border:0;padding:0;cursor:pointer;color:var(--ink)}
.stn .c{width:30px;height:30px;margin-top:6px;border-radius:50%;background:var(--surface);border:4px solid var(--lv0);display:grid;place-items:center;font-size:.7rem;font-weight:800;font-family:var(--f-display);transition:transform .15s ease}
.stn:hover .c{transform:scale(1.12)}
.stn.part .c{border-color:var(--accent)}
.stn.done .c{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.stn.master .c{background:var(--lv5);border-color:var(--lv5);color:var(--surface)}
.stn.here .c{box-shadow:0 0 0 4px var(--signal)}
.stn small{font-size:.66rem;color:var(--muted)}
.levels{display:flex;height:14px;border-radius:999px;overflow:hidden;background:var(--surface-2);border:1px solid var(--line)}
.levels i{display:block;height:100%;transition:width .5s ease}
.legend{display:flex;flex-wrap:wrap;gap:8px 14px;font-size:.82rem;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend .sw{width:10px;height:10px;border-radius:3px}

/* Study: vertical line diagram */
.stations{display:grid;gap:0;position:relative;padding-left:8px}
.st-row{display:grid;grid-template-columns:40px minmax(0,1fr) auto;gap:14px;align-items:center;padding:10px 0;position:relative;border:0;background:none;text-align:left;cursor:pointer;width:100%}
.st-row::before{content:"";position:absolute;left:17px;top:0;bottom:0;width:6px;background:var(--accent);opacity:.25}
.st-row:first-child::before{top:50%}.st-row:last-child::before{bottom:50%}
.st-row .c{position:relative;z-index:1;width:40px;height:40px;border-radius:50%;background:var(--surface);border:4px solid var(--lv0);display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:.85rem}
.st-row.part .c{border-color:var(--accent)}
.st-row.done .c{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.st-row.master .c{background:var(--lv5);border-color:var(--lv5);color:var(--surface)}
.st-row:hover .st-name{color:var(--accent)}
.st-name{font-family:var(--f-display);font-weight:700;min-width:0}
.st-name small{display:block;font-family:var(--f-body);font-weight:400;color:var(--muted);font-size:.86rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* Word card */
.word-head{display:flex;align-items:flex-start;gap:14px;flex-wrap:wrap}
.word-head .w{font-family:var(--f-display);font-size:clamp(2rem,6vw,3rem);font-weight:800;line-height:1;letter-spacing:-.02em;overflow-wrap:anywhere}
.word-head .meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:6px}
.sec{border-top:1px solid var(--line);padding-top:14px;display:grid;gap:8px}
.sec-h{display:flex;justify-content:space-between;align-items:center;gap:10px}
.sec-h .eyebrow{color:var(--accent)}
.reveal{border:1px dashed var(--line);border-radius:var(--r-sm);padding:12px;color:var(--muted);background:var(--surface-2);cursor:pointer;text-align:left;width:100%}
.reveal:hover{border-color:var(--accent);color:var(--ink)}
.ex-line{display:grid;gap:2px}
.ex-line .tr{color:var(--muted);font-size:.92rem}
.note{font-size:.85rem;color:var(--muted);background:var(--surface-2);border-radius:var(--r-sm);padding:8px 12px}
.colls{display:flex;flex-wrap:wrap;gap:6px}
.colls span{background:var(--accent-soft);color:var(--ink);border-radius:8px;padding:3px 10px;font-size:.92rem}
.hook{background:var(--warn-soft);border-radius:var(--r-sm);padding:12px 14px}
.fade-in{animation:fadeIn .28s ease both}

/* Flashcards */
.fc-tips{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:12px}
.tip{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:grid;gap:6px;align-content:start}
.tip b{font-family:var(--f-display)}
.tip i{font-style:normal;width:28px;height:28px;border-radius:50%;background:var(--signal);color:var(--signal-ink);display:grid;place-items:center;font-family:var(--f-display);font-weight:800}
.fc-modes{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));gap:10px}
.fc-mode{display:grid;gap:4px;text-align:left;border:2px solid var(--line);background:var(--surface);border-radius:var(--r-sm);padding:12px;cursor:pointer;align-content:start}
.fc-mode > span:last-child{font-size:.86rem;color:var(--muted)}
.fc-mode b{font-family:var(--f-display)}
.fc-mode[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.fc-toggle{display:inline-flex;gap:8px;align-items:center;cursor:pointer;flex-wrap:wrap}
.fc-toggle input{width:20px;height:20px;accent-color:var(--accent)}
.fc-stage{perspective:1400px;max-width:680px;width:100%;margin:0 auto}
.fc-card{display:grid;transition:transform .55s cubic-bezier(.2,.7,.2,1);transform-style:preserve-3d}
.fc-card.flipped{transform:rotateY(180deg)}
.fc-face{grid-area:1/1;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:var(--surface);border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow);padding:28px 24px;display:grid;gap:12px;align-content:center;min-height:320px;min-width:0}
.fc-front{justify-items:center;text-align:center;border-top:8px solid var(--accent)}
.fc-back{transform:rotateY(180deg);align-content:start;border-top:8px solid var(--signal)}
.fc-big{font-size:1.3rem;font-weight:700}
.fc-word{font-family:var(--f-display);font-size:2rem;font-weight:800;line-height:1.05;overflow-wrap:anywhere}
.fc-ctl{max-width:680px;width:100%;margin:0 auto;display:grid;gap:12px}
.rate{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
@media (max-width:520px){.rate{grid-template-columns:repeat(2,minmax(0,1fr))}}
.rate button{display:grid;gap:2px;justify-items:center;text-align:center;border:2px solid var(--line);background:var(--surface);border-radius:var(--r-sm);padding:10px 6px;cursor:pointer;font-weight:700;min-height:56px}
.rate button small{font-weight:400;color:var(--muted);font-size:.78rem}
.rate button:hover{background:var(--surface-2)}
.rate .again{border-color:var(--bad);color:var(--bad)} .rate .hard{border-color:var(--warn);color:var(--warn)}
.rate .good{border-color:var(--ok);color:var(--ok)} .rate .easy{border-color:var(--accent);color:var(--accent)}
@keyframes fadeIn{from{opacity:.0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* Library */
.lib{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);gap:20px;align-items:start}
@media (max-width:860px){.lib{grid-template-columns:1fr}.lib.detail-open .lib-list{display:none}}
.lib-list{display:grid;gap:12px}
.search{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:10px 16px;min-height:44px}
.filters{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin}
.filters button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:.85rem;font-weight:700;cursor:pointer;white-space:nowrap}
.filters button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.wlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;max-height:70vh;overflow:auto;padding:2px}
.wbtn{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:var(--r-sm);padding:9px 10px;cursor:pointer;text-align:left;min-width:0}
.wbtn:hover{border-color:var(--accent)}
.wbtn[aria-current="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.wbtn .sw{width:10px;height:10px;border-radius:50%;flex:none}
.wbtn span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:700}

/* Session */
.sess-head{display:grid;gap:10px}
.sess-top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.ex{display:grid;gap:18px}
.prompt-word{font-family:var(--f-display);font-size:clamp(2rem,7vw,3.2rem);font-weight:800;letter-spacing:-.02em;line-height:1.05;overflow-wrap:anywhere}
.sentence{font-size:clamp(1.15rem,2.6vw,1.4rem);line-height:1.5}
.blank{display:inline-block;min-width:4.5em;border-bottom:3px solid var(--accent);color:transparent;line-height:1}
.opts{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr))}
.opt{display:flex;align-items:flex-start;gap:12px;text-align:left;border:2px solid var(--line);background:var(--surface);border-radius:var(--r-sm);padding:14px;cursor:pointer;transition:border-color .15s ease, background .15s ease, transform .1s ease;min-height:56px}
.opt:hover:not([disabled]){border-color:var(--accent)}
.opt:active:not([disabled]){transform:scale(.99)}
.opt kbd{font-family:var(--f-display);font-weight:800;font-size:.8rem;border:1px solid var(--line);border-radius:6px;padding:0 6px;color:var(--muted);flex:none}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft);animation:shake .3s ease}
.opt[disabled]{cursor:default}
@keyframes shake{0%,100%{transform:none}25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.answer{display:flex;gap:10px;flex-wrap:wrap}
.answer input{flex:1 1 220px;min-width:0;border:2px solid var(--line);background:var(--surface);border-radius:var(--r-sm);padding:12px 14px;font-size:1.1rem;min-height:50px}
.answer input:focus{border-color:var(--accent);outline:none}
.answer input.right{border-color:var(--ok);background:var(--ok-soft)}
.answer input.wrong{border-color:var(--bad);background:var(--bad-soft)}
textarea{width:100%;min-height:110px;border:2px solid var(--line);background:var(--surface);border-radius:var(--r-sm);padding:12px 14px;font-size:1.05rem;resize:vertical}
textarea:focus{border-color:var(--accent);outline:none}
.fb{border-radius:var(--r);padding:18px;display:grid;gap:10px;border:2px solid transparent;animation:fadeIn .25s ease both}
.fb.ok{background:var(--ok-soft);border-color:var(--ok)}
.fb.bad{background:var(--bad-soft);border-color:var(--bad)}
.fb.warn{background:var(--warn-soft);border-color:var(--warn)}
.fb-head{display:flex;align-items:center;gap:8px;font-family:var(--f-display);font-weight:800;font-size:1.15rem}
.fb.ok .fb-head{color:var(--ok)} .fb.bad .fb-head{color:var(--bad)} .fb.warn .fb-head{color:var(--warn)}
.fb-head svg{width:22px;height:22px}
.fb-body{display:grid;gap:8px}
.mini{background:var(--surface);border-radius:var(--r-sm);padding:12px 14px;display:grid;gap:6px;border:1px solid var(--line)}

/* Flashcard */
.flash{perspective:1200px}
.flash-in{position:relative;min-height:300px;transition:transform .55s cubic-bezier(.2,.7,.2,1);transform-style:preserve-3d}
.flash.flipped .flash-in{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:var(--r);border:1px solid var(--line);background:var(--surface-2);padding:22px;display:grid;align-content:center;gap:10px;overflow:auto}
.face.back{transform:rotateY(180deg);align-content:start}
.face.front{justify-items:center;text-align:center}

/* Match */
.match{display:grid;grid-template-columns:minmax(0,.8fr) minmax(0,1.2fr);gap:12px}
@media (max-width:560px){.match{grid-template-columns:1fr}}
.match .col{display:grid;gap:8px;align-content:start}
.mitem{border:2px solid var(--line);background:var(--surface);border-radius:var(--r-sm);padding:10px 12px;text-align:left;cursor:pointer;min-height:48px;transition:border-color .15s ease, background .15s ease}
.mitem.word{font-family:var(--f-display);font-weight:800}
.mitem.sel{border-color:var(--accent);background:var(--accent-soft)}
.mitem.done{border-color:var(--ok);background:var(--ok-soft);cursor:default}
.mitem.wrong{border-color:var(--bad);background:var(--bad-soft);animation:shake .3s ease}

/* Steps */
.steps{display:flex;gap:6px;flex-wrap:wrap}
.steps button{display:flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 12px 4px 4px;font-size:.85rem;font-weight:700;cursor:pointer;color:var(--muted)}
.steps button i{font-style:normal;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:var(--surface-2);font-family:var(--f-display);font-size:.78rem}
.steps button[aria-current="step"]{border-color:var(--accent);color:var(--ink)}
.steps button[aria-current="step"] i{background:var(--accent);color:var(--accent-ink)}
.steps button.seen i{background:var(--accent-soft);color:var(--accent)}
.foot{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center}

/* Challenge */
.score{display:flex;gap:10px;flex-wrap:wrap}
.score div{background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r-sm);padding:6px 12px;font-size:.85rem}
.score b{font-family:var(--f-display);font-size:1.1rem;font-variant-numeric:tabular-nums}
.streak b{color:var(--warn)}
.tier{display:inline-flex;gap:3px;vertical-align:middle}
.tier i{width:8px;height:14px;border-radius:2px;background:var(--line)}
.tier i.on{background:var(--signal)}

/* Progress charts */
.hbar{display:grid;grid-template-columns:minmax(110px,170px) minmax(0,1fr) 64px;gap:10px;align-items:center;font-size:.9rem}
.hbar .track{height:12px;background:var(--surface-2);border:1px solid var(--line);border-radius:999px;overflow:hidden}
.hbar .track i{display:block;height:100%;background:var(--accent)}
.hbar .v{text-align:right;font-variant-numeric:tabular-nums;color:var(--muted)}
.cols{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px;align-items:end;height:150px;padding-top:18px}
.cols .colb{display:grid;align-content:end;justify-items:center;gap:4px;height:100%}
.cols .colb i{width:100%;max-width:38px;background:var(--accent);border-radius:6px 6px 2px 2px;min-height:2px}
.cols .colb b{font-size:.8rem;font-variant-numeric:tabular-nums}
.cols .colb small{font-size:.72rem;color:var(--muted)}
.wl{display:grid;gap:6px}
.wl > div{display:flex;justify-content:space-between;gap:10px;align-items:center;border-bottom:1px solid var(--line);padding:6px 0}
.wl > div:last-child{border-bottom:0}
.wl button{border:0;background:none;padding:0;font-weight:700;cursor:pointer;text-align:left;color:var(--ink)}
.wl button:hover{color:var(--accent)}
.empty{color:var(--muted);font-size:.92rem;padding:8px 0}
details summary{cursor:pointer;font-weight:700}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-weight:700;opacity:0;pointer-events:none;transition:opacity .2s ease, transform .2s ease;z-index:20;max-width:calc(100% - 32px);text-align:center}
.toast.show{opacity:1;transform:translateX(-50%)}
.ring{width:120px;height:120px;border-radius:50%;display:grid;place-items:center;flex:none}
.ring b{font-family:var(--f-display);font-size:1.8rem;font-weight:800;background:var(--surface);width:92px;height:92px;border-radius:50%;display:grid;place-items:center}
.code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.75rem;word-break:break-all;max-height:120px;overflow:auto;background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r-sm);padding:10px}
@media (prefers-reduced-motion: reduce){ *{animation:none!important;transition:none!important} }
</style>

<script>const W=[];</script>
<script>// Vocabulario de "The Metro" — parte 1/4
// Tupla: [word, pos, ipa, es, def, exMaterial, simple, ex1, ex1es, ex2, ex2es, collocations, synonyms, mistake, hook]
// En ex1/ex2 la palabra (en la forma usada) va entre [corchetes] para los ejercicios de completar.
W.push(
["advances","n","/ədˈvɑːnsɪz/","insinuaciones, acercamientos de tipo sexual o romántico","approaches of a sexual nature","The waitress didn't appreciate the advances from the men in the bachelor party.","Attempts to start a romantic or sexual relationship with someone, often unwanted.","She politely rejected his [advances] at the office party.","Ella rechazó educadamente sus insinuaciones en la fiesta de la oficina.","He kept making unwelcome [advances] until the manager asked him to leave.","Siguió haciendo insinuaciones no deseadas hasta que el gerente le pidió que se fuera.","make advances (to somebody); unwanted / unwelcome advances; reject somebody's advances","flirting = coquetear, más ligero y juguetón; advances = intentos más directos, a menudo no deseados.","En este sentido casi siempre va en plural: ‘make advances’, no ‘make an advance’. ‘Advance’ en singular suele significar ‘avance’ o ‘anticipo de dinero’.","Alguien ‘avanza’ hacia ti sin permiso: advances = pasos hacia adelante no invitados."],
["amicably","adv","/ˈæmɪkəbli/","amistosamente, de forma cordial","in a friendly way","The taxi driver amicably offered the poor lady a free ride.","In a friendly, peaceful way, without arguing.","The couple divorced [amicably] and stayed good friends.","La pareja se divorció de forma amistosa y siguieron siendo buenos amigos.","The neighbours settled the dispute [amicably] over a cup of tea.","Los vecinos resolvieron la disputa amistosamente con una taza de té.","part amicably; settle (a dispute) amicably; resolve amicably; split up amicably","friendly = amistoso (adjetivo). amicably se usa sobre todo para acuerdos o separaciones sin conflicto.","No digas ‘friendly-ly’; el adverbio formal es ‘amicably’ o ‘in a friendly way’.","Amic- = amigo (amicus en latín). Amicably = como amigos."],
["amorous","adj","/ˈæmərəs/","apasionado, amoroso (con deseo romántico o sexual)","full of passion","The couple that met on the beach had an amorous relationship for one week.","Showing romantic or sexual desire.","He sent her an [amorous] letter full of poetry.","Le envió una carta apasionada llena de poesía.","The cat became [amorous] every spring.","El gato se ponía en celo cada primavera.","amorous advances; amorous relationship; amorous glances; feel amorous","loving = cariñoso (amor tranquilo); amorous = con deseo y pasión; romantic = romántico, más general.","No es ‘amoroso’ en el sentido de ‘tierno con un bebé’; para eso usa ‘loving’ o ‘affectionate’.","Amor + -ous: lleno de amor apasionado."],
["antithesis","n","/ænˈtɪθəsɪs/","lo totalmente opuesto, la antítesis","the complete opposite","Even though they are identical twins, Joe and John are the antithesis of each other.","Something that is the exact opposite of something else.","His calm attitude is the [antithesis] of his brother's anger.","Su actitud tranquila es lo opuesto a la ira de su hermano.","This noisy hotel is the [antithesis] of a relaxing holiday.","Este hotel ruidoso es todo lo contrario a unas vacaciones relajantes.","the antithesis of something; the very antithesis; complete antithesis","opposite = palabra común; antithesis = formal y enfática, ‘el polo opuesto’.","Se dice ‘the antithesis OF something’, no ‘to’. Plural: antitheses /ænˈtɪθəsiːz/.","Anti- (contra) + tesis (idea): la idea contraria."],
["astute","adj","/əˈstjuːt/","astuto, perspicaz","crafty, clever","The astute fisherman had the hole in the boat patched before it sank.","Clever at understanding situations quickly and using them to your advantage.","She is an [astute] businesswoman who never misses an opportunity.","Es una empresaria astuta que nunca pierde una oportunidad.","That was an [astute] observation about the market.","Esa fue una observación muy perspicaz sobre el mercado.","astute observation; astute businessman; politically astute; astute judge of character","smart = listo (general); cunning = astuto con engaño (negativo); astute = astuto de forma positiva, perspicaz.","Es un falso amigo casi perfecto, pero ‘astute’ suele ser elogio, no implica trampa.","Suena igual que ‘astuto’: es una de las fáciles."],
["atrocity","n","/əˈtrɒsəti/","atrocidad, acto de crueldad extrema","very cruel happening or treatment","It was an atrocity when George's friends locked him outside in the snow with no shoes or socks.","An extremely cruel and shocking act.","The soldiers were accused of committing an [atrocity] against civilians.","Los soldados fueron acusados de cometer una atrocidad contra civiles.","Leaving the dog alone in the hot car was an [atrocity].","Dejar al perro solo en el coche caliente fue una atrocidad.","commit an atrocity; war atrocities; a terrible atrocity","cruelty = crueldad (cualidad); atrocity = un acto concreto, extremo y terrible.","Se usa con ‘commit’: commit an atrocity (no ‘do an atrocity’).","Atroz → atrocity: suena igual en español."],
["bizarre","adj","/bɪˈzɑː(r)/","muy extraño, estrafalario","very strange","It was so bizarre when the clown at the party knelt down and asked Judy to marry him.","Very strange and unusual, sometimes funny.","It was a [bizarre] dream about flying fish.","Fue un sueño muy extraño sobre peces voladores.","He wore a [bizarre] hat made of newspaper.","Llevaba un sombrero estrafalario hecho de periódico.","a bizarre situation; bizarre behaviour; quite bizarre; for some bizarre reason","strange = raro (neutro); weird = raro (informal); bizarre = rarísimo, chocante.","Falso amigo: en español ‘bizarro’ también significa ‘valiente’. En inglés solo es ‘muy raro’.","Imagina un bazar lleno de objetos rarísimos: bazar → bizarre."],
["bleak","adj","/bliːk/","desolador, sombrío, poco acogedor","discouraging, unappealing","I couldn't believe that homeless people were living in that bleak alley.","Cold, empty and depressing; without hope or comfort.","The future looked [bleak] after the factory closed.","El futuro parecía sombrío después de que cerró la fábrica.","They walked across a [bleak], windy hill.","Caminaron por una colina desolada y ventosa.","bleak future; bleak outlook; bleak landscape; look bleak","gloomy = triste y oscuro; bleak = frío, vacío y sin esperanza.","No confundir con ‘black’. ‘Bleak’ /iː/ larga.","Bleak suena a ‘bleh’: todo gris, frío y sin ánimo."],
["blower","n (slang)","/ˈbləʊə(r)/","(jerga británica) el teléfono","(slang) the telephone","Sandy got on the blower with her sister as soon as she heard the juicy gossip.","Informal British word for the telephone.","Get on the [blower] and order us a pizza.","Agarra el teléfono y pídenos una pizza.","He's been on the [blower] to his mum all evening.","Ha estado al teléfono con su mamá toda la tarde.","on the blower; get on the blower (to somebody)","phone = teléfono (normal). blower es coloquial y algo anticuado; casi siempre ‘on the blower’.","No lo uses en contextos formales. Literalmente ‘blower’ es ‘soplador’.","Antes se ‘soplaba’ en un tubo para hablar a otra sala: blower = teléfono."],
["brief somebody","v","/briːf ˈsʌmbədi/","informar a alguien, darle los datos necesarios","give somebody the background information/details they need","“Can you brief me on the condition of the patient?” the doctor asked the nurse.","To give someone the key information they need before they act.","The captain [briefed] the crew before take-off.","El capitán informó a la tripulación antes del despegue.","Can you [brief] me on what happened at the meeting?","¿Puedes ponerme al tanto de lo que pasó en la reunión?","brief somebody on/about something; be fully briefed; brief the press","inform = informar (general); brief = dar un resumen preparatorio y práctico.","Se dice ‘brief somebody ON something’, no ‘brief something to somebody’. Como adjetivo, ‘brief’ significa ‘breve’.","Un briefing es breve: brief = darte la información en pocas palabras antes de actuar."],
["brusquely","adv","/ˈbruːskli/","bruscamente, de forma seca","quickly, abruptly","The woman brusquely pointed out the thief in the line up of criminals.","In a quick, short way that seems a little rude.","“Not now,” he said [brusquely] and closed the door.","—Ahora no —dijo bruscamente y cerró la puerta.","The receptionist answered [brusquely] because she was busy.","La recepcionista respondió de forma seca porque estaba ocupada.","say brusquely; reply brusquely; dismiss somebody brusquely","rudely = con mala educación; brusquely = rápido y cortante, no siempre con mala intención.","Pronunciación: /ˈbruːskli/, la ‘que’ suena /sk/.","Suena a ‘brusco’: brusque → brusquely."],
["buskers","n","/ˈbʌskəz/","músicos o artistas callejeros que actúan por dinero","people who beg or entertain for money on the street","I gave the buskers a few dollars to play my favourite song.","Street performers who play music or perform for money from people passing by.","[Buskers] were playing guitar in the metro station.","Unos músicos callejeros tocaban guitarra en la estación de metro.","The square was full of [buskers] and tourists.","La plaza estaba llena de artistas callejeros y turistas.","street buskers; a busker plays / performs; give money to a busker","beggar = mendigo (solo pide); busker = actúa a cambio de monedas.","‘Busker’ es más británico; en EE. UU. también ‘street performer’.","Busker suena a ‘busca’: busca monedas tocando música."],
["cannabis","n","/ˈkænəbɪs/","cannabis, marihuana","drug from a hemp plant","The police found cannabis in the house where the thieves were living.","A drug made from the hemp plant, smoked or eaten.","He was arrested for growing [cannabis] in his garden.","Fue arrestado por cultivar cannabis en su jardín.","Some countries allow [cannabis] for medical use.","Algunos países permiten el cannabis para uso medicinal.","smoke cannabis; possession of cannabis; medical cannabis; grow cannabis","marijuana / weed (informal) son sinónimos. cannabis es el término neutro o legal.","Es incontable: ‘some cannabis’, no ‘a cannabis’.","Igual que en español: una de las fáciles."],
["captivated","past participle","/ˈkæptɪveɪtɪd/","cautivado, fascinado","unable to stop looking at something","The young children were captivated by the fireworks display.","So interested or charmed that you can't look away.","The audience was [captivated] by her voice.","El público quedó cautivado por su voz.","I was [captivated] by the view from the top of the tower.","Quedé fascinado con la vista desde lo alto de la torre.","be captivated by; captivate an audience; captivating smile","fascinated = fascinado (interés); captivated = atrapado, sin poder apartar la atención.","Usa ‘captivated BY’, no ‘captivated with’ (menos común).","Captive = cautivo: tu atención queda prisionera."],
["caught in the act","idiom","/kɔːt ɪn ðə ækt/","pillado en el acto (aquí: en plena relación sexual)","found in the middle of doing something (here, having sex)","I caught my aunt and uncle in the act in our basement when I was a child.","Discovered while doing something secret or wrong, at that exact moment.","The thief was [caught in the act] of opening the safe.","El ladrón fue pillado en el acto abriendo la caja fuerte.","She came home early and [caught] them [in the act].","Llegó temprano a casa y los pilló con las manos en la masa.","catch somebody in the act; be caught in the act (of doing something)","red-handed = con las manos en la masa (para delitos). in the act puede tener tono sexual, como en la lectura.","Se puede separar: ‘catch somebody in the act’. Usa ‘of + -ing’: in the act of stealing.","‘Act’ = acto: te pillan en mitad del acto."],
["Chihuahua","n","/tʃɪˈwɑːwə/","chihuahua (raza de perro diminuta)","tiny breed of Mexican dog","Chihuahuas have huge eyes for such little dogs.","A very small dog breed originally from Mexico, with big eyes and ears.","She carried her [Chihuahua] in a handbag.","Llevaba a su chihuahua en el bolso.","The tiny [Chihuahua] barked at the huge dog.","El diminuto chihuahua le ladró al perro enorme.","a tiny Chihuahua; Chihuahua puppy","Es un nombre propio de raza; va con mayúscula en inglés.","Pronunciación: /tʃɪˈwɑːwə/ ‘chi-uá-ua’.","Como el estado mexicano de Chihuahua."],
["clairvoyants","n","/kleəˈvɔɪənts/","clarividentes, videntes","people who claim they are able to see the future","I asked Becky if she was a clairvoyant because she always knows when I am dating someone new.","People who say they can see the future or know things without being told.","She paid a [clairvoyant] to tell her about her love life.","Le pagó a una vidente para que le hablara de su vida amorosa.","Many [clairvoyants] work at the fair, reading palms.","Muchos videntes trabajan en la feria leyendo la mano.","consult a clairvoyant; a professional clairvoyant","psychic = vidente (más común en EE. UU.); fortune-teller = adivino/a (cartas, manos).","Viene del francés: ‘clair’ (claro) + ‘voyant’ (que ve).","Clair-voyant = ‘ve claro’ lo que otros no ven."],
["claustrophobic","adj","/ˌklɔːstrəˈfəʊbɪk/","claustrofóbico, agobiante por falta de espacio","not having enough space for people to feel comfortable","I tried to sleep in the tiny attic, but it was too claustrophobic.","Describes a place so small or crowded that you feel trapped.","The lift was small and [claustrophobic].","El ascensor era pequeño y agobiante.","I feel [claustrophobic] in crowded metro carriages.","Me siento claustrofóbico en los vagones de metro llenos.","feel claustrophobic; a claustrophobic room / atmosphere","cramped = sin espacio (describe el lugar); claustrophobic = describe el lugar o lo que sientes.","Sirve para personas (I feel claustrophobic) y para lugares (a claustrophobic room).","Claustro (lugar cerrado) + fobia: miedo a los espacios cerrados."],
["coax","v","/kəʊks/","persuadir con suavidad, engatusar","persuade gently","Can I coax you into buying some chocolates for charity?","To gently persuade someone to do something, with patience and kindness.","She [coaxed] the cat out from under the bed.","Convenció con suavidad al gato para que saliera de debajo de la cama.","He [coaxed] his daughter into eating her vegetables.","Persuadió con paciencia a su hija para que comiera verduras.","coax somebody into doing something; coax somebody out of something; coax a smile","persuade = persuadir (general); coax = con dulzura y paciencia; force = obligar.","Estructura: coax somebody INTO + -ing (coax him into going), no ‘coax him to go’ (posible pero menos natural).","Coax suena a ‘coqueta’: convences con dulzura."],
["come to a head","v (idiom)","/kʌm tu ə hed/","llegar a un punto crítico","come to a point where you can't ignore something any more","The couple's financial problems came to a head when Nancy became pregnant.","When a problem becomes so serious that you must deal with it.","The tension between them [came to a head] at dinner.","La tensión entre ellos llegó a un punto crítico en la cena.","Things [came to a head] when the boss refused to pay them.","Las cosas estallaron cuando el jefe se negó a pagarles.","things come to a head; matters come to a head; bring something to a head","reach a crisis = llegar a una crisis. come to a head se usa para problemas que venían creciendo.","No es ‘come to the head’. Siempre ‘a head’.","Como un grano que ‘llega a la cabeza’ y tiene que reventar."],
["concierge","n","/ˈkɒnsieəʒ/","conserje, encargado de edificio u hotel","resident caretaker for apartments or hotel","I asked the concierge to call a taxi for room 101.","A person in a hotel or apartment building who helps residents or guests.","The [concierge] recommended a good restaurant nearby.","El conserje recomendó un buen restaurante cerca.","Leave the keys with the [concierge] downstairs.","Deja las llaves con el conserje de abajo.","hotel concierge; ask the concierge; concierge desk; concierge service","receptionist = recepcionista (registra); concierge = ayuda con servicios, recomendaciones y encargos.","Pronunciación francesa: termina en /ʒ/, como ‘llave’ en argentino.","Conserje ↔ concierge: casi la misma palabra."],
["consultation","n","/ˌkɒnslˈteɪʃn/","consulta, reunión para hablar de una posible acción o servicio","a meeting to discuss possible future action or business","The bride often goes for a hair consultation before her big day in the salon.","A meeting with an expert to get advice or plan something.","I booked a free [consultation] with a lawyer.","Reservé una consulta gratuita con un abogado.","After a short [consultation], the doctor changed my medicine.","Tras una breve consulta, el médico cambió mi medicamento.","free consultation; book a consultation; in consultation with; initial consultation","meeting = reunión (general); consultation = reunión para recibir consejo profesional.","Se dice ‘have / book a consultation’, no ‘make a consultation’.","Consultar → consultation: igual que ‘consulta’."],
["corpse","n","/kɔːps/","cadáver","dead body","The shipmates buried the corpse at sea.","The dead body of a person.","The police found a [corpse] in the river.","La policía encontró un cadáver en el río.","The detective examined the [corpse] carefully.","El detective examinó el cadáver con cuidado.","find a corpse; identify a corpse; a decomposing corpse","body = cuerpo (más neutro); corpse = cadáver (más crudo); remains = restos.","No confundir con ‘corps’ /kɔː/ (cuerpo militar), que se pronuncia sin ‘p’ ni ‘s’.","Corpse ↔ ‘corpus’ / cuerpo: un cuerpo sin vida."],
["cramped","adj","/kræmpt/","estrecho, apretado, sin espacio","having no spare room","It was so cramped on the bus that we had to sit on our bags.","Too small for the people or things inside it.","Our first apartment was tiny and [cramped].","Nuestro primer departamento era diminuto y apretado.","Five of us travelled in a [cramped] little car.","Viajamos cinco en un coche pequeño y estrecho.","cramped conditions; cramped flat / room; cramped space; feel cramped","small = pequeño; cramped = demasiado pequeño para lo que contiene, incómodo.","No confundir con ‘cramp’ (calambre) aunque comparten raíz.","Te da un calambre (cramp) por estar tan apretado: cramped."],
["crave","v","/kreɪv/","desear intensamente, antojarse (a menudo comida)","want badly (often food)","My sister craved peaches through her whole pregnancy.","To want something very strongly, often food.","I always [crave] chocolate when I'm tired.","Siempre se me antoja chocolate cuando estoy cansado.","Children [crave] attention from their parents.","Los niños anhelan la atención de sus padres.","crave attention; crave sugar / chocolate; craving for something","want = querer (neutro); crave = deseo intenso, casi físico; yearn for = anhelo emocional.","El verbo es transitivo: ‘I crave chocolate’, no ‘I crave for chocolate’. El sustantivo sí: ‘a craving for’.","Crave suena a ‘cave’: un deseo profundo como una cueva."],
["curse","v","/kɜːs/","maldecir, soltar palabrotas","use bad or rude language","My uncle was cursing as the Christmas lights fell off the roof.","To say rude or offensive words because you are angry.","He [cursed] when he hit his finger with the hammer.","Soltó una palabrota cuando se golpeó el dedo con el martillo.","She [cursed] the traffic all the way home.","Maldijo el tráfico todo el camino a casa.","curse loudly; curse under your breath; curse somebody / something","swear = decir palabrotas (más común); curse también = echar una maldición.","Como sustantivo, ‘a curse’ es una maldición. El verbo en pasado: cursed /kɜːst/.","Imagina a un pirata que maldice (curses) la tormenta: curse = maldecir."],
["cynic","n","/ˈsɪnɪk/","cínico, escéptico, alguien que desconfía de la sinceridad ajena","a person who doesn't believe another is being sincere","I never vote because I'm a cynic when it comes to politicians.","A person who believes people usually act only for themselves.","He is a [cynic] who thinks every charity is a scam.","Es un escéptico que cree que toda organización benéfica es una estafa.","Don't be such a [cynic]; maybe she really wants to help.","No seas tan desconfiado; quizá de verdad quiere ayudar.","a hardened cynic; a born cynic; cynical about","sceptic = duda de las afirmaciones; cynic = duda de las intenciones de la gente.","Falso amigo parcial: en español ‘cínico’ suele ser ‘desvergonzado’. En inglés, cynic = desconfiado.","Un cynic ve ‘sin’ (pecado) en las intenciones de todos."],
["decapitate","v","/dɪˈkæpɪteɪt/","decapitar","cut someone's head off","Long ago, prisoners were decapitated after committing serious crimes.","To cut off someone's head.","The statue was [decapitated] during the riots.","La estatua fue decapitada durante los disturbios.","In the film, the hero [decapitates] the monster.","En la película, el héroe decapita al monstruo.","be decapitated; decapitated body","behead = sinónimo más común y menos formal.","Se usa mucho en pasiva: ‘was decapitated’.","De- (quitar) + capit (cabeza, como ‘capital’)."],
["defer","v","/dɪˈfɜː(r)/","aplazar, posponer","put off until later","My holiday time was deferred because our company was so busy this summer.","To delay something until a later time.","The university let her [defer] her studies for a year.","La universidad le permitió aplazar sus estudios un año.","We decided to [defer] the decision until next month.","Decidimos posponer la decisión hasta el mes próximo.","defer payment; defer a decision; deferred until; defer a place at university","postpone = posponer (más común); delay = retrasar; defer = formal, sobre todo en trámites.","Doble ‘r’ en pasado: deferred. ‘Defer TO somebody’ significa ceder ante su opinión, es otro sentido.","Defer ≈ diferir: ‘diferir’ un pago es aplazarlo."],
["deflect","v","/dɪˈflekt/","desviar, esquivar","turn away","I always deflect phone calls from people trying to sell me something.","To make something change direction, or avoid dealing with it.","The politician [deflected] the difficult question.","El político esquivó la pregunta difícil.","The goalkeeper [deflected] the ball over the bar.","El portero desvió el balón por encima del travesaño.","deflect criticism; deflect attention; deflect a question; deflect the blame","avoid = evitar; deflect = desviar algo que viene hacia ti (preguntas, críticas, pelotas).","Va con objeto directo: deflect criticism (sin ‘from’ obligatorio). ‘Deflect attention FROM something’.","Un escudo deflector desvía los rayos: deflect."],
["demoralized","adj","/dɪˈmɒrəlaɪzd/","desmoralizado, sin ánimo","having lost hope","The demoralized cyclist put his damaged bike on his shoulders and walked to the finish line.","Having lost confidence and the will to continue.","The team felt [demoralized] after losing ten games.","El equipo se sintió desmoralizado tras perder diez partidos.","[Demoralized] workers often leave their jobs.","Los trabajadores desmoralizados a menudo dejan sus trabajos.","feel demoralized; completely demoralized; a demoralized team","discouraged = desanimado (más leve); demoralized = sin moral ni confianza.","Ortografía: demoralized (EE. UU.) / demoralised (RU). No tiene que ver con ‘moral’ ética, sino con ‘moral’ = ánimo.","Igual que en español: se te va la moral."],
["despair","v","/dɪˈspeə(r)/","desesperar, perder la esperanza","worry intently","Amanda despaired because her husband was more than three hours late from work.","To lose all hope or feel extremely worried.","Don't [despair]; we will find a solution.","No te desesperes; encontraremos una solución.","She [despaired] of ever finding a good job.","Perdió la esperanza de encontrar algún día un buen trabajo.","despair of (doing) something; in despair; sheer despair","worry = preocuparse; despair = perder toda esperanza, más intenso.","‘Despair OF + -ing’: despair of finding. También es sustantivo: ‘in despair’.","Des- (sin) + spair (esperanza, como ‘esperar’): des-esperar."],
["despondently","adv","/dɪˈspɒndəntli/","con desánimo, abatidamente","without hope","I despondently called for help but I knew there was nobody home.","In a sad way, without hope or energy.","He looked [despondently] at his exam results.","Miró con desánimo los resultados de su examen.","She sat [despondently] by the window, waiting.","Se sentó abatida junto a la ventana, esperando.","stare / sit / say despondently","sadly = con tristeza; despondently = con tristeza y sin esperanza de que mejore.","Adjetivo: despondent. No existe ‘despondly’.","Desp- como en despair: sin esperanza, ‘desplomado’."],
["Deutschmark","n","/ˈdɔɪtʃmɑːk/","marco alemán (moneda anterior al euro)","German currency (pre-Euro)","I transferred my American savings into Deutschmarks before I went to Germany.","The money used in Germany before the euro.","The coffee cost two [Deutschmarks] in 1995.","El café costaba dos marcos alemanes en 1995.","Germany replaced the [Deutschmark] with the euro in 2002.","Alemania reemplazó el marco alemán por el euro en 2002.","in Deutschmarks; the German Deutschmark","También ‘Deutsche Mark’ o ‘D-Mark’.","Pronunciación: /ˈdɔɪtʃ/ ‘doich’.","Deutsch = alemán; Mark = marco."],
["disdainfully","adv","/dɪsˈdeɪnfəli/","con desdén, con desprecio","without respect, with dislike","My grandmother stared at my new boyfriend disdainfully because of his long hair.","In a way that shows you think someone or something is not good enough.","She looked [disdainfully] at the cheap wine.","Miró con desdén el vino barato.","He spoke [disdainfully] about people who don't read.","Habló con desprecio de la gente que no lee.","look / stare / say disdainfully","contemptuously = con desprecio (más fuerte); disdainfully = con superioridad, mirando por encima del hombro.","Adjetivo: disdainful; sustantivo: disdain.","Disdain ≈ desdén: suenan parecido."],
["dismally","adv","/ˈdɪzməli/","lúgubremente, de forma deprimente","gloomily, without hope","The children stared dismally out the window until the sun finally came out.","In a sad, gloomy way; or very badly.","The team played [dismally] and lost 5–0.","El equipo jugó pésimamente y perdió 5 a 0.","It rained [dismally] all weekend.","Llovió de forma deprimente todo el fin de semana.","fail dismally; stare dismally; perform dismally","‘fail dismally’ = fracasar estrepitosamente; también significa ‘tristemente’.","Una sola ‘l’ en dismal, dos en dismally.","Dismal suena a ‘dis-mal’: todo mal y gris."],
["dismay","n","/dɪsˈmeɪ/","consternación, angustia","consternation, distress","Rebecca was full of dismay when we jumped out from behind the couch.","A feeling of shock and disappointment or worry.","To my [dismay], the shop was closed.","Para mi consternación, la tienda estaba cerrada.","She watched in [dismay] as the train left without her.","Observó consternada cómo el tren se iba sin ella.","to somebody's dismay; in dismay; express dismay","disappointment = decepción; dismay = sorpresa desagradable con preocupación.","Expresiones fijas: ‘to my dismay’, ‘in dismay’ (no ‘with dismay’ tan frecuente).","Dis-may: ‘no puede (may) ser’, piensas consternado."],
["disparity","n","/dɪˈspærəti/","disparidad, gran diferencia","big difference","There was quite a disparity between Anne and George's accounts of why their marriage failed.","A big difference, often one that seems unfair.","There is a huge [disparity] between rich and poor.","Hay una enorme disparidad entre ricos y pobres.","Police noticed a [disparity] in the two witnesses' stories.","La policía notó una disparidad en las versiones de los dos testigos.","disparity between A and B; income disparity; a wide disparity","difference = diferencia (neutro); disparity = diferencia grande y llamativa, a menudo injusta.","Usa ‘disparity BETWEEN’, no ‘disparity of’ para comparar dos cosas.","Dispar en español = desigual: disparity."],
["dispatch","v","/dɪˈspætʃ/","enviar, despachar (a menudo servicios de emergencia)","send to do something (often emergency services)","The police dog team was dispatched to an area in the woods where the criminal had been spotted.","To send someone or something somewhere for a purpose.","An ambulance was [dispatched] to the scene of the accident.","Se envió una ambulancia al lugar del accidente.","The company [dispatches] orders within 24 hours.","La empresa despacha los pedidos en 24 horas.","dispatch an ambulance / troops; dispatch goods; be dispatched to","send = enviar (general); dispatch = enviar con rapidez y un propósito oficial.","Muy usado en pasiva: ‘was dispatched to’. Ortografía británica alternativa: despatch.","Dispatch = despachar: el despachador de emergencias."]
);

["domain","n","/dəˈmeɪn/","ámbito, campo de interés o especialidad","subject of interest or expertise","Since I was five years old dancing has been my domain.","An area of knowledge or activity that someone controls or knows well.","Cooking is my father's [domain]; nobody else touches the kitchen.","La cocina es el terreno de mi padre; nadie más toca la cocina.","Technology is outside my [domain], so ask my sister.","La tecnología está fuera de mi campo, así que pregúntale a mi hermana.","in the domain of; somebody's domain; public domain; outside my domain","field = campo (académico); area = área; domain = territorio propio, donde alguien manda o domina.","No lo confundas con ‘domain name’ (dominio de internet), que es otro uso.","Domain ≈ dominio: lo que dominas."],
["duvet","n","/ˈduːveɪ/","edredón (relleno de plumas)","heavy quilt filled with feathers","We don't use our duvet on the bed in the summer; we just use a sheet.","A thick, soft cover for a bed, filled with feathers or other material.","I bought a warm [duvet] for the winter.","Compré un edredón calentito para el invierno.","She stayed under the [duvet] all Sunday morning.","Se quedó bajo el edredón toda la mañana del domingo.","duvet cover; a thick / warm duvet; under the duvet","quilt = colcha acolchada; comforter = edredón (EE. UU.); duvet = término británico.","Pronunciación: /ˈduːveɪ/, la ‘t’ no suena (palabra francesa).","Duvet suena a ‘du-vé’: suave como plumas francesas."],
["ecstasy","n","/ˈekstəsi/","éxtasis, placer intenso (a menudo sexual)","great pleasure (often sexual)","Eileen had never known true ecstasy before she started dating Charles.","A feeling of extreme happiness or pleasure.","The fans screamed in [ecstasy] when their team scored.","Los aficionados gritaron extasiados cuando su equipo marcó.","Eating that cake was pure [ecstasy].","Comer ese pastel fue puro éxtasis.","in ecstasy; pure ecstasy; ecstasy of joy","joy = alegría; bliss = dicha tranquila; ecstasy = placer intenso, desbordante. También es el nombre de una droga.","Ortografía: ecstasy (con ‘cs’ y ‘sy’), no ‘extasy’.","Ec-stasy: ‘fuera de ti’ (ec-) de tanto placer."],
["emerge","v","/iˈmɜːdʒ/","salir, emerger, aparecer","come out from somewhere","The mouse finally emerged from under the fridge.","To come out of a place where you were hidden or inside.","A man [emerged] from the dark tunnel.","Un hombre salió del túnel oscuro.","New details [emerged] during the investigation.","Surgieron nuevos detalles durante la investigación.","emerge from; emerge as; it emerged that; new evidence emerged","appear = aparecer; emerge = salir de dentro de algo o hacerse visible poco a poco.","Va con ‘from’: emerge from the water. No lleva objeto directo.","Emerger del agua: emerge."],
["enduring","adj","/ɪnˈdjʊərɪŋ/","duradero, perdurable","lasting a long time","The minister wished the newlyweds enduring happiness and love.","Continuing for a long time; lasting.","Their friendship was strong and [enduring].","Su amistad era fuerte y duradera.","The Beatles had an [enduring] influence on music.","Los Beatles tuvieron una influencia perdurable en la música.","enduring love / friendship; enduring legacy; enduring appeal","lasting = duradero (común); permanent = permanente; enduring = que resiste el paso del tiempo, positivo.","No confundir con el verbo ‘endure’ (soportar). ‘Enduring’ como adjetivo = duradero.","Endure = aguantar: lo enduring aguanta años."],
["envisage","v","/ɪnˈvɪzɪdʒ/","imaginar, prever","imagine","I envisage my first home as an old farm in the country.","To imagine something as a future possibility.","I [envisage] a future where everyone has clean water.","Imagino un futuro en el que todos tengan agua potable.","We don't [envisage] any problems with the plan.","No prevemos ningún problema con el plan.","envisage a future; envisage doing something; envisage problems","imagine = imaginar (general); envisage = imaginar algo futuro o un plan. ‘Envision’ es la forma americana.","Estructura: envisage + -ing (envisage working), no ‘envisage to work’.","En-visage: poner algo delante de tu cara (visage) mentalmente."],
["evaporate","v","/ɪˈvæpəreɪt/","evaporarse, desaparecer","disappear","All of the water in the frog's tank had evaporated by the time we got home from our weekend away.","To turn from liquid into gas; or to disappear gradually.","The puddles [evaporated] in the sun.","Los charcos se evaporaron con el sol.","My confidence [evaporated] when I saw the exam.","Mi confianza se esfumó cuando vi el examen.","water evaporates; hopes / support evaporate; evaporate quickly","disappear = desaparecer; evaporate = desaparecer poco a poco, como el agua.","Es intransitivo en sentido figurado: ‘my hope evaporated’, no ‘I evaporated my hope’.","Vapor → evaporate: se va como vapor."],
["exodus","n","/ˈeksədəs/","éxodo, salida masiva","mass departure","There was an exodus of young people on the Monday of spring break.","A situation where a lot of people leave a place at the same time.","There was an [exodus] from the city on Friday afternoon.","Hubo un éxodo de la ciudad el viernes por la tarde.","The [exodus] of doctors left the hospital short of staff.","La salida masiva de médicos dejó al hospital sin personal.","mass exodus; exodus from; exodus of people / workers","departure = salida (general); exodus = salida de mucha gente a la vez.","Normalmente singular con ‘an’: ‘an exodus’, ‘a mass exodus’.","Como el Éxodo de la Biblia: todo un pueblo saliendo."],
["exquisite","adj","/ɪkˈskwɪzɪt/","exquisito, bellísimo, de gran delicadeza","very beautiful, wonderful","The queen looked exquisite in her royal gown.","Extremely beautiful and delicate.","She wore an [exquisite] silk dress.","Llevaba un vestido de seda exquisito.","The hotel has an [exquisite] view of the lake.","El hotel tiene una vista bellísima del lago.","exquisite taste; exquisite detail; exquisitely beautiful","beautiful = bonito; exquisite = de belleza delicada y refinada. En inglés no se usa tanto para comida como en español.","Nota: en el material aparece como (v), pero es adjetivo (adj). Se acepta /ˈekskwɪzɪt/ también.","Exquisito en español, pero en inglés piensa más en belleza que en sabor."],
["extricate","v","/ˈekstrɪkeɪt/","sacar, liberar de una situación difícil","free someone from a difficult situation","The car was badly smashed up but he managed to extricate himself.","To get yourself or someone out of a difficult place or situation.","Firefighters [extricated] the driver from the car.","Los bomberos sacaron al conductor del coche.","She couldn't [extricate] herself from the conversation.","No pudo zafarse de la conversación.","extricate yourself from; extricate somebody from; manage to extricate","free = liberar; escape = escapar; extricate = sacar con esfuerzo de algo enredado.","Estructura: extricate somebody/yourself FROM something.","Ex- (fuera) + trica (enredo): salir del enredo."],
["festoon","v","/feˈstuːn/","engalanar, decorar (con guirnaldas, cintas…)","decorate","The hotel was festooned with streamers and balloons to welcome the celebrities.","To decorate a place with chains of flowers, ribbons, lights, etc.","The street was [festooned] with flags for the parade.","La calle estaba engalanada con banderas para el desfile.","They [festooned] the tree with fairy lights.","Adornaron el árbol con lucecitas.","festooned with lights / flowers / balloons","decorate = decorar (general); festoon = cubrir con muchas guirnaldas colgantes.","Casi siempre en pasiva: ‘be festooned with’.","Festoon suena a ‘fiesta’: decorar para la fiesta."],
["fetch","v","/fetʃ/","ir a buscar y traer","go and get","If you want the dog to fetch the bone you have to throw it into the ocean.","To go to another place and bring something or someone back.","Can you [fetch] my glasses from the bedroom?","¿Puedes ir a buscarme las gafas al dormitorio?","I'll [fetch] the children from school at four.","Iré a buscar a los niños al colegio a las cuatro.","fetch somebody something; go and fetch; fetch help / water","bring = traer (de allí hacia aquí); fetch = ir allá Y traer, el viaje completo.","‘Fetch’ implica ir y volver. ‘Bring me the book’ no indica que alguien vaya a buscarlo.","El juego del perro: ‘Fetch!’, y el perro va y trae la pelota."],
["fiddle around","v","/ˈfɪdl əˈraʊnd/","manosear, toquetear, hacer arreglos con las manos","do casual work using one's hands","Ben fiddled around with the wires until he got the computer working again.","To touch or move small things with your hands, trying to fix or adjust them.","He [fiddled around] with the radio until it worked.","Estuvo trasteando con la radio hasta que funcionó.","Stop [fiddling around] with your phone and listen!","¡Deja de toquetear el teléfono y escucha!","fiddle around with something; fiddle with buttons / keys","tinker = trastear para arreglar; fiddle around = toquetear, a veces sin objetivo claro.","Lleva ‘with’: fiddle around WITH the wires.","Fiddle = violín: dedos inquietos tocando cosas."],
["flock","v","/flɒk/","acudir en masa, ir en tropel","go as a group","The children flocked to the ice cream truck.","When many people go somewhere together because it is attractive.","Tourists [flock] to Paris every summer.","Los turistas acuden en masa a París cada verano.","Fans [flocked] to the stadium to see the final.","Los aficionados fueron en tropel al estadio para ver la final.","flock to; flock in; people flock; a flock of birds / sheep (n)","crowd = aglomerarse; flock = llegar muchos a un sitio atractivo, como pájaros.","Va con ‘to’: flock to the beach. Como sustantivo: a flock of sheep.","Una bandada (flock) de pájaros volando todos al mismo árbol."],
["forensic evidence","n","/fəˈrensɪk ˈevɪdəns/","pruebas forenses, evidencia científica en la escena de un crimen","scientific proof at a crime scene (for example: blood)","The forensic evidence proved that the murderer was male.","Scientific proof, like blood, DNA or fingerprints, used to solve a crime.","The [forensic evidence] linked the suspect to the crime.","Las pruebas forenses vincularon al sospechoso con el crimen.","Without [forensic evidence], the police couldn't charge him.","Sin pruebas forenses, la policía no pudo acusarlo.","gather / collect forensic evidence; forensic evidence shows / proves","proof = prueba concluyente; evidence = pruebas (incontable).","‘Evidence’ es incontable: ‘some evidence’, ‘a piece of evidence’, nunca ‘evidences’.","Como en CSI: el equipo forense busca evidencia."],
["frantic","adj","/ˈfræntɪk/","frenético, desesperado y asustado","wild and scared","The people grew frantic as the tornado got closer to the city.","Very worried, scared and acting quickly without control.","She was [frantic] when she couldn't find her child.","Estaba desesperada cuando no encontraba a su hijo.","There was a [frantic] search for the missing keys.","Hubo una búsqueda frenética de las llaves perdidas.","frantic search; frantic with worry; frantic phone calls; go frantic","panicked = en pánico; hectic = ajetreado (sin miedo); frantic = desesperado y acelerado.","‘Frantic’ es emocional (miedo). Para un día muy ocupado usa ‘hectic’.","Frantic suena a ‘frenético’."],
["frisson","n","/ˈfriːsɒn/","escalofrío (de emoción, miedo o placer)","shiver","When I watched the car accident on the news it sent a frisson up my back.","A sudden, short feeling of excitement or fear.","I felt a [frisson] of excitement as the curtain rose.","Sentí un escalofrío de emoción cuando se levantó el telón.","His words sent a [frisson] of fear through the room.","Sus palabras provocaron un escalofrío de miedo en la sala.","a frisson of excitement / fear / danger","shiver = escalofrío físico (frío); frisson = escalofrío emocional, más literario.","Palabra francesa: /ˈfriːsɒn/, la ‘s’ suena como /s/.","Frisson ≈ ‘frío’: un frío repentino de emoción."],
["fruitlessly","adv","/ˈfruːtləsli/","infructuosamente, sin éxito","unsuccessfully","The baby fruitlessly pulled at the top of the jar of candy.","Without getting any result, despite effort.","We searched [fruitlessly] for the lost ring.","Buscamos infructuosamente el anillo perdido.","He argued [fruitlessly] with the referee.","Discutió en vano con el árbitro.","search fruitlessly; try fruitlessly","in vain = en vano (más común); unsuccessfully = sin éxito; fruitlessly = sin dar ‘fruto’.","Adjetivo: fruitless (a fruitless search).","Un árbol sin fruta (fruit-less): esfuerzo sin resultado."],
["gaze","v","/ɡeɪz/","contemplar, mirar fijamente con asombro","stare at with wide eyes","The children gazed at the field of sunflowers.","To look at something for a long time, often with admiration or wonder.","She [gazed] at the stars for hours.","Contempló las estrellas durante horas.","He [gazed] out of the train window, lost in thought.","Miró fijamente por la ventana del tren, perdido en sus pensamientos.","gaze at; gaze into somebody's eyes; gaze out of the window","stare = mirar fijamente (puede ser incómodo); gaze = mirar largo rato con admiración; glance = vistazo.","Lleva ‘at’, ‘into’ o ‘out of’: gaze AT the sea.","Gaze ↔ ‘gaze-lle’: miras embobado una gacela."],
["germane","adj","/dʒɜːˈmeɪn/","pertinente, relacionado con la situación","related to the situation","At the germane moment the father walked in and heard the baby saying “Dad” for the first time.","Relevant and connected to what is being discussed.","That information is not [germane] to this case.","Esa información no es pertinente para este caso.","Please keep your comments [germane] to the topic.","Por favor, que tus comentarios sean pertinentes al tema.","germane to; not germane","relevant = relevante (común); pertinent = pertinente; germane = formal, casi siempre ‘germane to’.","Se usa con ‘to’: germane TO the discussion. Nota: en el ejemplo del material se usa de forma poco habitual (‘the germane moment’).","Germane ≈ ‘hermano’ (germanus): es ‘hermano’ del tema."],
["glower","v","/ˈɡlaʊə(r)/","mirar con enfado, fulminar con la mirada","stare angrily","I glowered at the bus driver who closed his doors just as I arrived at the stop.","To look at someone angrily, without speaking.","She [glowered] at me when I laughed.","Me fulminó con la mirada cuando me reí.","The old man [glowered] at the noisy teenagers.","El anciano miró con enfado a los adolescentes ruidosos.","glower at somebody; glower silently","glare = mirar furioso (más intenso y breve); glower = mirada enfadada y sombría, sostenida.","Rima con ‘flower’ /aʊə/. No confundir con ‘glow’ (brillar).","Glower = ‘glow’ + ‘er’: ojos que brillan de rabia."],
["grandiose","adj","/ˈɡrændiəʊs/","grandioso, pretencioso, demasiado ambicioso","large and impressive","The couple had grandiose dreams about winning the lottery.","Very big and impressive, often too ambitious or showy.","He had [grandiose] plans to build a castle.","Tenía planes grandiosos de construir un castillo.","The [grandiose] building looked out of place in the village.","El edificio pretencioso parecía fuera de lugar en el pueblo.","grandiose plans / ideas / scheme; grandiose building","grand = grande y elegante (positivo); grandiose = exagerado, a menudo con crítica.","Matiz: en inglés suele tener tono negativo (‘demasiado’), a diferencia de ‘grandioso’.","Grand + -iose: tan grande que es exagerado."],
["graphology","n","/ɡræˈfɒlədʒi/","grafología, estudio de la escritura a mano","the study of handwriting","Police use graphology to tell if a suspect is nervous.","The study of handwriting to learn about someone's personality.","She studied [graphology] to analyse old letters.","Estudió grafología para analizar cartas antiguas.","Some companies use [graphology] when hiring, but scientists doubt it.","Algunas empresas usan la grafología al contratar, pero los científicos dudan de ella.","practise graphology; graphology expert","handwriting analysis = análisis de letra (más simple).","Es incontable: ‘graphology’, sin artículo.","Graph (escribir) + -logy (estudio)."],
["gratitude","n","/ˈɡrætɪtjuːd/","gratitud, agradecimiento","thankfulness","The students showed their gratitude by sending their retired teacher flowers.","The feeling of being thankful.","I'd like to express my [gratitude] to everyone who helped.","Quiero expresar mi gratitud a todos los que ayudaron.","She cried with [gratitude] when they found her dog.","Lloró de agradecimiento cuando encontraron a su perro.","express gratitude; deep gratitude; out of gratitude; gratitude for something","thanks = gracias (informal); appreciation = aprecio; gratitude = sentimiento de agradecimiento.","Se dice ‘gratitude FOR something’ y ‘gratitude TO somebody’.","Gratitud = gratitude: casi idénticas."],
["grotesque","adj","/ɡrəʊˈtesk/","grotesco, desagradable de ver","disgusting, hard to look at","The horror movie was so grotesque I had to walk out of the theatre.","Strange and ugly in an unpleasant or shocking way.","The mask had a [grotesque] face with huge teeth.","La máscara tenía una cara grotesca con dientes enormes.","It is [grotesque] that some people waste food while others starve.","Es grotesco que algunos desperdicien comida mientras otros pasan hambre.","grotesque face / figure; grotesque display","ugly = feo; disgusting = asqueroso; grotesque = feo de manera extraña, exagerada o chocante.","Pronunciación: /ɡrəʊˈtesk/, la ‘que’ suena /k/.","Grotesco → grotesque."],
["grudgingly","adv","/ˈɡrʌdʒɪŋli/","a regañadientes, de mala gana","without wanting to","The child grudgingly took the garbage out for his mom.","Doing something although you don't really want to.","He [grudgingly] agreed to help his brother.","Aceptó a regañadientes ayudar a su hermano.","She [grudgingly] admitted that I was right.","Admitió de mala gana que yo tenía razón.","grudgingly admit / accept / agree","reluctantly = con reticencia (similar); grudgingly = con algo de resentimiento.","Adjetivo: grudging. ‘Hold a grudge’ = guardar rencor.","Grudge = rencor: lo haces con rencor, a regañadientes."],
["hastily","adv","/ˈheɪstɪli/","precipitadamente, a toda prisa","quickly and with little thought","We packed so hastily that I forgot my bathing suit.","Very quickly, without thinking carefully.","He [hastily] wrote a note and left.","Escribió precipitadamente una nota y se fue.","The meeting was [hastily] arranged after the news.","La reunión se organizó a toda prisa tras la noticia.","hastily arranged / written / prepared; leave hastily","quickly = rápido (neutro); hastily = rápido y sin pensar, con prisas.","Ortografía: haste → hasty → hastily (la ‘y’ cambia a ‘i’).","Haste makes waste: las prisas causan errores."],
["hawkers","n","/ˈhɔːkəz/","vendedores ambulantes","people who sell goods on the street","I bought this necklace from some hawkers in Amsterdam.","People who walk around selling things in the street.","[Hawkers] sold drinks to people stuck in traffic.","Unos vendedores ambulantes vendían bebidas a la gente atrapada en el tráfico.","The beach was full of [hawkers] selling sunglasses.","La playa estaba llena de vendedores ambulantes de gafas de sol.","street hawkers; hawkers sell; hawkers' stalls","vendor = vendedor (con puesto); tout = insiste y molesta; hawker = vende caminando, gritando su oferta.","Plural ‘hawkers’; verbo ‘to hawk’ = vender pregonando.","Como un halcón (hawk) que vigila a los turistas para venderles algo."],
["headshrink","n (slang)","/ˈhedʃrɪŋk/","(jerga) psiquiatra, ‘loquero’","(slang) psychiatrist","Annie cries so much I think she might need a headshrink.","An informal, slightly joking word for a psychiatrist.","Maybe you should talk to a [headshrink] about your nightmares.","Quizá deberías hablar con un loquero sobre tus pesadillas.","His [headshrink] told him to take a long holiday.","Su psiquiatra le dijo que se tomara unas largas vacaciones.","see a headshrink; need a headshrink","shrink = forma más común hoy (informal); psychiatrist / therapist = formal.","Es jerga y algo despectivo. Hoy se oye más ‘shrink’.","Head + shrink: el que ‘encoge la cabeza’ (reduce tus problemas)."],
["heroin","n","/ˈherəʊɪn/","heroína (droga)","strong narcotic drug derived from morphine","People who use heroin often need help getting over their addiction.","A very strong and addictive illegal drug made from morphine.","He spent years fighting a [heroin] addiction.","Pasó años luchando contra una adicción a la heroína.","Police seized two kilos of [heroin] at the port.","La policía incautó dos kilos de heroína en el puerto.","heroin addict; heroin addiction; take / use heroin","Es incontable.","No confundir con ‘heroine’ (heroína, la protagonista): suenan igual pero se escriben distinto.","heroin (sin ‘e’) = droga; heroine (con ‘e’) = la heroína de la historia."],
["hocus pocus","n (slang)","/ˌhəʊkəs ˈpəʊkəs/","(coloquial) magia, truco; palabrería engañosa","(slang) magic","It was like hocus pocus when the door shut by itself.","Magic tricks or words; also nonsense used to trick people.","The magician said ‘[hocus pocus]’ and the rabbit vanished.","El mago dijo ‘abracadabra’ y el conejo desapareció.","He thinks astrology is just [hocus pocus].","Él cree que la astrología es solo charlatanería.","just hocus pocus; a bit of hocus pocus","abracadabra = palabras mágicas; mumbo-jumbo = palabrería sin sentido (muy cercano).","A veces se escribe ‘hocus-pocus’ con guion.","Las palabras del mago: ‘hocus pocus’ = abracadabra."],
["homicidal","adj","/ˌhɒmɪˈsaɪdl/","homicida, con tendencia a matar","likely to kill someone","The police were extremely concerned, because the criminal that got away was homicidal.","Dangerous and likely to murder someone.","The film is about a [homicidal] robot.","La película trata de un robot homicida.","He had [homicidal] thoughts after years of abuse.","Tenía pensamientos homicidas después de años de abuso.","homicidal maniac; homicidal tendencies; homicidal rage","murderous = asesino (más común); homicidal = término más técnico, legal o médico.","Sustantivo: homicide (homicidio).","Homicidio → homicidal."],
["hue","n","/hjuː/","tono, matiz de color","shades of colour","When painting, artists often blend many hues.","A colour or shade of a colour.","The sky turned a pink [hue] at sunset.","El cielo adquirió un tono rosado al atardecer.","Her paintings use every [hue] of blue.","Sus cuadros usan todos los tonos de azul.","a golden / reddish hue; take on a hue; every hue","colour = color (general); shade = tono más claro u oscuro; hue = el tono o matiz, más literario.","Pronunciación: /hjuː/, como ‘hiú’. No suena la ‘e’.","Hue suena a ‘hue-vo’: la yema tiene un hue dorado."],
["huskiness","n","/ˈhʌskinəs/","ronquera, voz ronca y grave","rough and dry voice","Smokers often speak with a distinct huskiness.","A low, rough quality in someone's voice.","There was a sexy [huskiness] in her voice.","Había una ronquera sensual en su voz.","The [huskiness] in his voice came from shouting at the match.","La ronquera de su voz venía de gritar en el partido.","huskiness in somebody's voice; a slight huskiness","hoarseness = ronquera por enfermedad; huskiness = voz ronca, a menudo atractiva.","Adjetivo: husky (a husky voice). No tiene que ver con el perro husky.","Un perro husky que aúlla ronco: huskiness."],
["imperative","adj","/ɪmˈperətɪv/","imprescindible, de vital importancia","very important","It is imperative that you wear your seat belt during take-off.","Extremely important and necessary.","It is [imperative] that we leave before the storm.","Es imprescindible que salgamos antes de la tormenta.","Speed is [imperative] in an emergency.","La rapidez es vital en una emergencia.","it is imperative that; absolutely imperative; imperative to do something","important = importante; essential = esencial; imperative = obligatorio, urgente.","Estructura: ‘It is imperative THAT you wear’ (sin ‘to’ después de ‘you’).","Imperativo = una orden: algo que tienes que hacer sí o sí."],
["impromptu","adj","/ɪmˈprɒmptjuː/","improvisado, sin planear","without being planned","We took an impromptu vacation to Hawaii at Christmas.","Done without planning or preparation.","We had an [impromptu] party in the kitchen.","Hicimos una fiesta improvisada en la cocina.","The singer gave an [impromptu] performance in the street.","El cantante dio una actuación improvisada en la calle.","impromptu speech / party / visit / performance","spontaneous = espontáneo; improvised = improvisado (arreglado sobre la marcha); impromptu = sin planear.","Va delante del sustantivo: an impromptu visit.","Im-prompt-u: ‘pronto’, salió de repente."]

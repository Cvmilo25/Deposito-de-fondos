["incongruity","n","/ˌɪnkɒŋˈɡruːəti/","incongruencia, algo fuera de lugar","quality of being out of place","The only female felt the incongruity as the men stared at her during her workout.","The quality of not fitting in, or seeming strange in a situation.","The [incongruity] of a man in a suit on the beach made us laugh.","La incongruencia de un hombre de traje en la playa nos hizo reír.","She noticed the [incongruity] between his words and his actions.","Notó la incongruencia entre sus palabras y sus actos.","the incongruity of; incongruity between A and B","contradiction = contradicción (ideas); incongruity = algo que no encaja con el entorno.","Adjetivo: incongruous (fuera de lugar).","In-congru-ity: no ‘congenia’ con lo que lo rodea."],
["indiscretion","n","/ˌɪndɪˈskreʃn/","indiscreción, desliz (a menudo una aventura sexual)","something, especially a sexual relationship, that might be embarrassing or morally wrong","His indiscretion cost him his marriage.","An action, often a secret affair, that is embarrassing or morally wrong.","The politician apologised for his youthful [indiscretions].","El político pidió disculpas por los deslices de su juventud.","One [indiscretion] at the party ruined her reputation.","Un desliz en la fiesta arruinó su reputación.","youthful indiscretion; a moment of indiscretion; sexual indiscretion","mistake = error (general); affair = aventura amorosa; indiscretion = desliz embarazoso, a veces eufemismo de infidelidad.","Puede ser contable (an indiscretion = un desliz) o incontable (falta de discreción).","Lo contrario de ser discreto: un desliz que todos acaban sabiendo."],
["insulate","v","/ˈɪnsjuleɪt/","proteger, aislar","protect","The front seat passengers were insulated by the car's air bags.","To protect someone or something from harm, heat, cold or noise.","We [insulated] the roof to keep the house warm.","Aislamos el techo para mantener la casa caliente.","Rich parents can't [insulate] their children from every problem.","Los padres ricos no pueden proteger a sus hijos de todos los problemas.","insulate from / against; well insulated; insulate a house","isolate = aislar (separar de otros); insulate = proteger con una capa (calor, ruido, problemas).","No confundir con ‘isolate’ (aislar a alguien socialmente). ‘Insulate FROM/AGAINST’.","Insula = isla: rodeas algo de protección como una isla."],
["intently","adv","/ɪnˈtentli/","atentamente, con gran interés","eagerly, with interest","We watched intently as Monica jumped from the airplane.","With complete attention and concentration.","The students listened [intently] to the story.","Los alumnos escucharon atentamente la historia.","The cat watched the bird [intently].","El gato observaba al pájaro con gran atención.","listen / watch / stare intently","carefully = con cuidado; attentively = atentamente; intently = con concentración total.","No confundir con ‘intentionally’ (a propósito).","Intent = intención fija: no apartas la mirada."],
["intersected","v","/ˌɪntəˈsektɪd/","se cruzaron, se intersecaron","cross paths","The two highways intersected at the downtown core.","Crossed each other at a point (roads, lines or lives).","Our lives [intersected] briefly in Paris.","Nuestras vidas se cruzaron brevemente en París.","The metro lines [intersect] at the central station.","Las líneas de metro se cruzan en la estación central.","roads / lines intersect; intersect with; intersecting streets","cross = cruzar (común); intersect = más técnico (líneas, calles). Sustantivo: intersection = cruce.","Puede usarse con o sin ‘with’: ‘A intersects (with) B’.","Inter (entre) + sect (cortar): dos líneas que se cortan."],
["irritable","adj","/ˈɪrɪtəbl/","irritable, de mal humor","grumpy","I'm always irritable when it's this hot outside.","Easily annoyed or angry.","He gets [irritable] when he's hungry.","Se pone irritable cuando tiene hambre.","Lack of sleep made her [irritable] all day.","La falta de sueño la puso de mal humor todo el día.","become / get / feel irritable; irritable mood","annoyed = molesto (por algo concreto); irritable = que se molesta fácilmente (estado).","Se pronuncia /ˈɪrɪtəbl/, acento al inicio.","Irritable = irritable: idéntica."],
["jaded","adj","/ˈdʒeɪdɪd/","hastiado, cansado de algo por exceso","tired or lacking enthusiasm after having too much of something","The jaded playboy had completely lost interest in women.","Tired and bored because you have had too much of something.","After years of travelling, she was [jaded] by airports.","Después de años viajando, estaba hastiada de los aeropuertos.","[Jaded] critics found the film boring.","Los críticos hastiados encontraron la película aburrida.","jaded palate; jaded by / with; feel jaded","bored = aburrido; tired = cansado; jaded = harto por exceso, sin entusiasmo.","Usa ‘jaded by / with’ algo.","Tanto jade (piedra) que ya no te emociona verlo."],

["lead","n","/liːd/","pista (para resolver un crimen)","clue to solving a crime","We don't have any leads except that the thief is driving a brown car.","A piece of information that helps solve a crime or problem.","The detective followed a new [lead].","El detective siguió una nueva pista.","Police have no [leads] in the robbery case.","La policía no tiene pistas en el caso del robo.","follow a lead; a promising lead; have no leads","clue = pista (general, también en juegos); lead = pista que te ‘lleva’ a investigar.","Pronunciación: /liːd/ (como ‘leed’). /led/ es el metal plomo.","Lead = guiar: la pista te lleva (leads) al culpable."],

["line","n","/laɪn/","línea (de metro o subte)","a route on a subway or metro","I took the wrong subway line so I was late for my date.","A route of a metro, subway or train.","Take the red [line] to the airport.","Toma la línea roja hasta el aeropuerto.","This [line] is closed for repairs at the weekend.","Esta línea está cerrada por reparaciones el fin de semana.","metro / subway / tube line; change lines; the end of the line","route = ruta (bus, general); line = línea fija de metro o tren.","Se dice ‘take the line’, ‘change lines’, no ‘change of line’.","El mapa del metro: cada color es una ‘line’."],

["mahogany","adj","/məˈhɒɡəni/","de caoba, color caoba","reddish coloured wood","The mahogany bookshelf doesn't go with the maple furniture.","Made of mahogany, a hard reddish-brown wood; or that colour.","They ate at a long [mahogany] table.","Comieron en una larga mesa de caoba.","She has beautiful [mahogany] hair.","Tiene un precioso pelo color caoba.","mahogany table / desk / furniture; mahogany brown","Como sustantivo, mahogany = la madera de caoba.","Pronunciación: /məˈhɒɡəni/ ‘ma-JÓ-ga-ni’.","Ma-hog-any: muebles caros de caoba."],

["memorabilia","n","/ˌmemərəˈbɪliə/","recuerdos, objetos de colección","things you buy that remind you of somewhere (for example: hats, postcards, magnets)","They sell lots of 1950's memorabilia in the front lobby of the diner.","Objects collected because they are connected with a famous person, event or place.","His room is full of football [memorabilia].","Su habitación está llena de recuerdos de fútbol.","The museum shop sells Beatles [memorabilia].","La tienda del museo vende objetos de colección de los Beatles.","sports memorabilia; Elvis memorabilia; collect memorabilia","souvenir = un recuerdo comprado en un viaje; memorabilia = objetos coleccionables (plural colectivo).","Es incontable/plural colectivo: ‘some memorabilia’, no ‘a memorabilia’.","Memoria + -bilia: cosas para recordar."],

["monotone","n","/ˈmɒnətəʊn/","tono monótono, voz sin variación","sound with no change in pitch","My science teacher is so boring because he speaks in a monotone.","A voice or sound that stays on one note, without rising or falling.","He read the list in a flat [monotone].","Leyó la lista con un tono monótono.","Her [monotone] made the lecture hard to follow.","Su voz monótona hacía difícil seguir la clase.","speak in a monotone; a flat monotone","monotonous = adjetivo, ‘aburrido y repetitivo’; monotone = el sonido en un solo tono.","‘Speak IN a monotone’ (con artículo).","Mono (uno) + tone (tono): un solo tono."],

["nonchalant","adj","/ˈnɒnʃələnt/","despreocupado, indiferente","casual","The driver was pretty nonchalant about the accident even though his car was destroyed.","Calm and relaxed, as if you don't care or aren't worried.","She gave a [nonchalant] shrug.","Se encogió de hombros con indiferencia.","He was [nonchalant] about losing his job.","Se mostró despreocupado por haber perdido su trabajo.","nonchalant attitude / shrug; nonchalant about","calm = tranquilo; relaxed = relajado; nonchalant = parece no importarle, a veces fingido.","Lleva ‘about’: nonchalant about something.","Non + chaleur (calor, francés): sin calentarse por nada."],
["nominal","adj","/ˈnɒmɪnl/","simbólico, mínimo (cantidad de dinero)","(of money) small amount, a token","There is just a nominal fee to cover the cost of coffee and sandwiches.","Very small; much less than the real value.","We charge a [nominal] fee for the course.","Cobramos una tarifa simbólica por el curso.","He sold the house to his son for a [nominal] sum.","Le vendió la casa a su hijo por una suma simbólica.","nominal fee / charge / sum / rent","small = pequeño; token = simbólico; nominal = tan pequeño que es solo formal.","También significa ‘solo de nombre’ (the nominal leader). En la lectura es sobre dinero.","Nominal: el precio existe solo de nombre."],

["pique","v","/piːk/","molestar, irritar, ofender","irritate","The drivers were piqued by the way the cyclist slowed down the traffic.","To annoy someone or hurt their pride.","She was [piqued] that nobody noticed her new haircut.","Le molestó que nadie notara su nuevo corte de pelo.","His rude comment [piqued] the guests.","Su comentario grosero irritó a los invitados.","be piqued by / at; in a fit of pique (n)","annoy = molestar (común); offend = ofender; pique = herir el orgullo, molestia leve.","‘Pique somebody's curiosity / interest’ es otro uso: despertar el interés. Pronunciación /piːk/ como ‘peak’.","Te ‘pica’ el orgullo: pique."],
["placid","adj","/ˈplæsɪd/","plácido, tranquilo","calm","The placid woman sang a song in the elevator until the power was restored.","Calm and not easily upset.","The baby was [placid] and rarely cried.","El bebé era tranquilo y casi nunca lloraba.","We swam in the [placid] waters of the lake.","Nadamos en las aguas plácidas del lago.","placid lake / water / nature; placid temperament","calm = tranquilo (general); peaceful = pacífico; placid = de naturaleza tranquila, difícil de alterar.","Se usa para personas, animales y agua.","Plácido = placid."],

["poignant","adj","/ˈpɔɪnjənt/","conmovedor, emotivo (con algo de tristeza)","emotionally moving","The movie was so poignant I cried at the end.","Making you feel sad or emotional in a deep way.","It was a [poignant] moment when the soldier hugged his daughter.","Fue un momento conmovedor cuando el soldado abrazó a su hija.","The letter is a [poignant] reminder of the war.","La carta es un recuerdo conmovedor de la guerra.","poignant moment / reminder / story / scene","moving = conmovedor (general); touching = enternecedor; poignant = conmovedor con tristeza o nostalgia.","Pronunciación: la ‘g’ no suena: /ˈpɔɪnjənt/.","Poignant ‘pincha’ (poign- = punzante) el corazón."],
["precision","n","/prɪˈsɪʒn/","precisión, exactitud","perfect accuracy","Janice paints her nails with such precision it looks like she gets them done professionally.","The quality of being exact and accurate.","The watch is made with Swiss [precision].","El reloj está hecho con precisión suiza.","Surgeons must work with great [precision].","Los cirujanos deben trabajar con gran precisión.","with precision; great precision; precision instruments","accuracy = exactitud (resultado correcto); precision = exactitud fina, al detalle.","Adjetivo: precise. ‘With precision’, no ‘with precise’.","Precisión = precision."],
["preposterous","adj","/prɪˈpɒstərəs/","absurdo, ridículo","ridiculous, impossible to be true","It was preposterous that the fourteen year old needed a babysitter.","So silly or unreasonable that it is shocking or funny.","That's a [preposterous] excuse for being late!","¡Esa es una excusa absurda para llegar tarde!","The idea of a flying car seemed [preposterous] in 1900.","La idea de un coche volador parecía ridícula en 1900.","preposterous idea / claim / suggestion; absolutely preposterous","ridiculous = ridículo; absurd = absurdo; preposterous = absurdo hasta el escándalo.","No es ‘prepóstero’; no tiene equivalente directo.","Pre (antes) + post (después): poner lo de antes después, ¡absurdo!"],
["prowl","v","/praʊl/","merodear, rondar sigilosamente","move about and search stealthily","The thief was prowling through our jewellery box when we got home.","To move around quietly, often looking for something to steal or hunt.","A fox [prowled] around the chicken house.","Un zorro merodeaba alrededor del gallinero.","Someone was [prowling] in the garden last night.","Alguien rondaba por el jardín anoche.","prowl around / about; on the prowl; prowl the streets","wander = deambular sin rumbo; sneak = moverse a escondidas; prowl = merodear buscando una presa.","‘On the prowl’ = al acecho (también para quien busca pareja).","Como un gato acechando (prowling) a su presa."],
["publicity card","n","/pʌbˈlɪsəti kɑːd/","tarjeta de presentación publicitaria","small piece of paper (business card) that advertises your career or title","My publicity card has my picture and my company's email address on it.","A small card that advertises a person or business.","The magician handed out [publicity cards] after the show.","El mago repartió tarjetas publicitarias después del espectáculo.","Her [publicity card] showed her phone number and website.","Su tarjeta publicitaria mostraba su número de teléfono y su sitio web.","hand out publicity cards","business card = tarjeta de visita (más común); flyer = volante.","Hoy se dice más ‘business card’.","Publicidad + carta: tarjeta para darte publicidad."],
["rapport","n","/ræˈpɔː(r)/","buena relación, sintonía","relationship","I have a good rapport with my boss, so I'm not afraid to ask for vacation time.","A friendly relationship where people understand each other well.","The teacher has a great [rapport] with her students.","La profesora tiene una gran sintonía con sus alumnos.","It takes time to build [rapport] with new clients.","Lleva tiempo crear una buena relación con clientes nuevos.","build / establish rapport; good rapport with; develop a rapport","relationship = relación (general); rapport = conexión positiva y fluida.","La ‘t’ final no suena: /ræˈpɔː/. Se dice ‘rapport WITH somebody’.","Rapport ≈ ‘apport’: lo que se aportan mutuamente."],
["recoil","v","/rɪˈkɔɪl/","retroceder, echarse atrás (por miedo o asco)","move back in fear","I can't help but recoil when they show operations on television.","To move back suddenly because something frightens or disgusts you.","She [recoiled] when she saw the snake.","Retrocedió cuando vio la serpiente.","He [recoiled] from the smell of rotten fish.","Se echó atrás por el olor a pescado podrido.","recoil in horror / disgust; recoil from","flinch = estremecerse; back away = alejarse poco a poco; recoil = salto rápido hacia atrás.","Se usa ‘recoil FROM’ algo o ‘recoil in horror’. También es el retroceso de un arma.","Re- (atrás) + coil (enrollarse): te enroscas hacia atrás."],
["reconcile","v","/ˈrekənsaɪl/","conciliar, cuadrar (cuentas)","settle or reorganize (finances)","I reconciled my loans and savings accounts after getting my inheritance.","To make financial records agree; or to make people friends again.","I [reconcile] my bank account at the end of each month.","Concilio mi cuenta bancaria a fin de cada mes.","After years of silence, the brothers finally [reconciled].","Tras años de silencio, los hermanos por fin se reconciliaron.","reconcile accounts; reconcile with somebody; reconcile A with B; be reconciled","settle = saldar; balance = cuadrar; reconcile = hacer que dos registros coincidan, o reconciliar a personas.","En el texto el sentido es financiero. ‘Reconcile yourself TO something’ = resignarse.","Re-conciliar: volver a poner de acuerdo números o personas."],
["resignation","n","/ˌrezɪɡˈneɪʃn/","dimisión, renuncia (a un trabajo)","the giving up of a job","The president of the company offered his resignation after he found out his illness was very serious.","The act of leaving your job officially.","She handed in her [resignation] on Monday.","Presentó su renuncia el lunes.","The scandal led to the minister's [resignation].","El escándalo llevó a la dimisión del ministro.","hand in / offer / announce your resignation; letter of resignation","retirement = jubilación; dismissal = despido; resignation = renuncia voluntaria.","También significa ‘resignación’ (aceptar algo malo), pero aquí es renuncia. Verbo: resign /rɪˈzaɪn/.","Re-sign: firmas (sign) tu salida."]

["save for","prep","/seɪv fɔː(r)/","excepto, salvo","except for","All of the girls at the party were wearing dresses save for Andrea, who always wears jeans.","Except; apart from.","The room was empty [save for] an old chair.","La habitación estaba vacía salvo por una silla vieja.","Everyone passed the test [save for] Tom.","Todos aprobaron el examen excepto Tom.","save for; all save one","except (for) = excepto (común); apart from = aparte de; save for = formal y literario.","No tiene que ver con ‘save’ (guardar o ahorrar). Es formal; en conversación usa ‘except’.","‘Salvo’ en español ≈ ‘save’: todos se salvan, salvo uno."],
["severing","n","/ˈsevərɪŋ/","corte, separación (cortar algo por completo)","the cutting off of","The severing of his own arm was what saved the climber's life.","The act of cutting something off completely.","The [severing] of the cable caused a blackout.","El corte del cable provocó un apagón.","The [severing] of ties with the company was painful.","La ruptura de vínculos con la empresa fue dolorosa.","the severing of ties / relations; sever a nerve / cable (v)","cutting = corte (general); severing = corte total y definitivo.","Verbo: sever /ˈsevə/. ‘Sever ties’ = romper relaciones.","Sever ≈ severo: un corte severo y definitivo."],
["shrine","n","/ʃraɪn/","santuario, lugar dedicado a alguien venerado","a place dedicated to a religious or important figure","My aunt's bedroom is like an Elvis Presley shrine.","A holy place, or a place full of objects honouring someone special.","Pilgrims visited the [shrine] every year.","Los peregrinos visitaban el santuario cada año.","His bedroom is a [shrine] to his favourite footballer.","Su habitación es un santuario dedicado a su futbolista favorito.","a shrine to somebody; visit a shrine; roadside shrine","temple = templo (edificio grande); shrine = santuario, a menudo pequeño o dedicado a una persona.","Usa ‘a shrine TO somebody’.","Shrine suena a ‘shine’: un lugar que brilla de devoción."],
["sob","v","/sɒb/","sollozar, llorar desconsoladamente","cry loudly","We were all sobbing at Angelica's farewell party.","To cry loudly with short breaths.","The little boy [sobbed] when his balloon flew away.","El niño sollozó cuando su globo salió volando.","She was [sobbing] on the phone after the news.","Sollozaba al teléfono después de la noticia.","sob uncontrollably; sob your heart out; sob story (n)","cry = llorar (general); weep = llorar (literario, en silencio); sob = llorar con sollozos.","Doble ‘b’: sobbed, sobbing. ‘Sob story’ = historia lacrimógena para dar pena.","‘Sob’ es corto como un sollozo: ¡sob!"],
["splay","v","/spleɪ/","extender, abrir (brazos, piernas o dedos)","spread wide apart","The woman's arms were splayed out as her husband stepped off the plane.","To spread arms, legs or fingers wide apart.","He lay on the bed with his arms [splayed] out.","Estaba tumbado en la cama con los brazos extendidos.","The puppy [splayed] its legs on the slippery floor.","El cachorro abrió las patas en el suelo resbaladizo.","splay out; splayed fingers / legs","spread = extender (general); splay = abrir mucho y hacia afuera.","Casi siempre ‘splay out’ o participio ‘splayed’.","Splay = spread + play: te abres jugando en la cama."],
["stern","adj","/stɜːn/","estricto, severo","strict","My grandfather was so stern that we had to eat every crumb on our dinner plate before we got up from the table.","Serious and strict, expecting to be obeyed.","The teacher gave us a [stern] look.","La profesora nos lanzó una mirada severa.","She received a [stern] warning from the judge.","Recibió una advertencia severa del juez.","stern look / warning / voice; stern face","strict = estricto (reglas); stern = severo en la expresión o el tono.","Como sustantivo, ‘stern’ es la popa de un barco (otro significado).","Stern ≈ ‘estern’: un padre de cara seria como piedra."],
["stir","v","/stɜː(r)/","moverse ligeramente (al dormir), desperezarse","move in one's sleep, wake slightly","The child stirred when the phone rang but thankfully went back to sleep.","To move a little, especially when sleeping or waking up.","The baby [stirred] but didn't wake up.","El bebé se movió un poco, pero no se despertó.","Nobody was [stirring] in the house at 6 a.m.","Nadie se movía en la casa a las 6 de la mañana.","stir in your sleep; begin to stir; not a creature was stirring","move = moverse (general); wake = despertar; stir = moverse levemente, empezar a despertar.","También significa ‘remover’ (stir the soup). Doble ‘r’: stirred, stirring.","Como remover un café: algo se agita un poquito."],
["straddle","v","/ˈstrædl/","estar a horcajadas, a ambos lados de algo","stand on both sides","When I went travelling, I often straddled borders for photographs.","To have one leg or part on each side of something.","He [straddled] the bike and rode off.","Se subió a horcajadas a la bici y se fue.","The town [straddles] the border between two countries.","El pueblo se extiende a ambos lados de la frontera entre dos países.","straddle a horse / bike / chair; straddle the border / line","sit on = sentarse en; straddle = con una pierna a cada lado.","Lleva objeto directo: straddle the fence (sin ‘on’).","Straddle ≈ ‘saddle’ (montura): una pierna a cada lado."],
["stun","v","/stʌn/","dejar atónito, sorprender mucho","surprise","I was stunned when my best friend told me she was moving to the other side of the world.","To shock or surprise someone so much they can't react.","The news [stunned] the whole country.","La noticia dejó atónito a todo el país.","I was [stunned] by her beauty.","Me quedé deslumbrado por su belleza.","be stunned by; stunned silence; stun gun","surprise = sorprender (general); shock = conmocionar; stun = dejar paralizado de sorpresa.","Doble ‘n’: stunned, stunning. Adjetivo ‘stunning’ = impresionante, bellísimo.","Una pistola paralizante (stun gun): te deja inmóvil."],

["tawdry","adj","/ˈtɔːdri/","de mal gusto, chabacano, barato","cheap, of fake appearance","The hostess was wearing a tawdry pearl necklace that looked like it came out of a cereal box.","Cheap, showy and of poor quality.","The shop sold [tawdry] souvenirs.","La tienda vendía recuerdos de mal gusto.","It was a [tawdry] little hotel near the station.","Era un hotelucho chabacano cerca de la estación.","tawdry jewellery / decorations; tawdry affair","cheap = barato; tacky = hortera, de mal gusto (informal); tawdry = barato y vistoso, también moralmente sórdido.","También se usa para historias o escándalos ‘sórdidos’ (a tawdry affair).","Tawdry suena a ‘todo de rastro’: baratijas brillantes."],

["uncanny","adj","/ʌnˈkæni/","asombroso, inexplicable, extraño","difficult to explain","It was uncanny how much the child looked like his adopted mother.","Strange and difficult to explain, sometimes a little scary.","She has an [uncanny] ability to guess what I'm thinking.","Tiene una habilidad asombrosa para adivinar lo que pienso.","There's an [uncanny] silence in the empty station.","Hay un silencio extraño en la estación vacía.","uncanny resemblance / ability / accuracy","strange = raro; eerie = inquietante; uncanny = raro y difícil de explicar, a menudo con admiración.","‘An uncanny resemblance’ es la colocación más típica.","Un-canny: algo que ‘no se puede’ (can't) explicar."],
["unfaithful","adj","/ʌnˈfeɪθfl/","infiel","not keeping a promise to only have one sexual partner","Mrs. Jones divorced her husband when she learned that he was being unfaithful to her.","Having a sexual relationship with someone who is not your partner.","He was [unfaithful] to his wife for years.","Le fue infiel a su esposa durante años.","She left him after discovering he had been [unfaithful].","Lo dejó tras descubrir que había sido infiel.","be unfaithful to somebody; unfaithful husband / wife","cheat (on) = engañar (informal); unfaithful = infiel (neutro).","Se dice ‘unfaithful TO somebody’, no ‘with’ (with = con la otra persona).","Un-faith-ful: sin fidelidad."],

["veritable","adj","/ˈverɪtəbl/","verdadero, auténtico (para enfatizar)","rightly called","The papers said the parade was a veritable disaster because of the poor weather.","Used to emphasize that a description is really true.","The garden was a [veritable] paradise.","El jardín era un auténtico paraíso.","The kitchen became a [veritable] battlefield.","La cocina se convirtió en un verdadero campo de batalla.","a veritable feast / paradise / disaster","real = real; true = verdadero; veritable = enfático, ‘un auténtico…’ (casi siempre metafórico).","Va delante del sustantivo: a veritable feast. No se dice ‘The paradise was veritable’.","Veritas (verdad): un verdadero desastre."],

<script>
(function(){

/* ---------- Datos ---------- */

 {n:'Nueva',d:'Todavía no la has estudiado.'},

const norm=s=>String(s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[’‘`´]/g,"'").replace(/[^a-z' -]/g,'').replace(/\s+/g,' ').trim();
const baseOf=w=>w.w.replace(/ somebody$/,'');
function lev(a,b){const m=a.length,n=b.length;if(!m)return n;if(!n)return m;let p=Array.from({length:n+1},(_,j)=>j);for(let i=1;i<=m;i++){let c=[i];for(let j=1;j<=n;j++)c[j]=Math.min(p[j]+1,c[j-1]+1,p[j-1]+(a[i-1]===b[j-1]?0:1));p=c}return p[n]}
function dayKey(t=Date.now()){const d=new Date(t);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function accepts(w,typed,form){
  const t=norm(typed); if(!t) return {ok:false,empty:true};
  const c=new Set([w.w,baseOf(w),form].filter(Boolean).map(norm));

  const tv=[t,t.replace(/-/g,' '),t.replace(/'/g,'')];
  if(tv.some(x=>c.has(x))) return {ok:true};
  const b=norm(baseOf(w));
  if(b.length>=3&&t.startsWith(b)&&t.length-b.length<=3) return {ok:true,inflected:true};
  for(const x of c){const lim=x.length>=9?2:x.length>=5?1:0;if(lim&&lev(t,x)<=lim) return {ok:true,typo:x};}
  return {ok:false};
}

 practice:'<circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="4"/><circle cx="12" cy="12" r=".6" fill="currentColor"/>',

};

const canSpeak='speechSynthesis' in window && 'SpeechSynthesisUtterance' in window;

}

/* ---------- Estado y guardado ---------- */
const LS='metro-vocab-v1';
const fresh=()=>({v:1,updated:0,p:{},types:{},daily:{},best:0,challenges:[],sent:{}});
let S=fresh();
try{const raw=localStorage.getItem(LS);if(raw){const o=JSON.parse(raw);if(o&&o.v===1)S=Object.assign(fresh(),o)}}catch(e){}
const store={mode:'local',ref:null,saving:false,again:false,failed:false};
function P(id){return S.p[id]||(S.p[id]={seen:0,box:0,due:0,rec:0,recN:0,recall:[],prod:0,wrong:0,lapse:0,hard:0,saved:0,known:0,conf:{},hist:[],last:0})}
function level(id){
  const p=S.p[id]; if(!p||(!p.seen&&!p.known)) return 0;
  let L=1;
  if(p.rec>0||p.recN>0) L=2;
  if(p.recN>0) L=3;
  if(p.prod>0&&p.recN>0) L=4;
  if(L===4&&new Set(p.recall).size>=2) L=5;

  return L;
}
function save(){

}
async function pushCloud(){
  if(!store.ref) return;
  if(store.saving){store.again=true;return}
  store.saving=true;
  try{await store.ref.set({state:JSON.stringify(S),updated:S.updated});store.mode='cloud';store.failed=false}
  catch(e){store.failed=true}
  store.saving=false; renderSaveState();

}
function renderSaveState(){
  const el=$('#saveState'); el.classList.toggle('cloud',store.mode==='cloud'&&!store.failed);

async function initCloud(){
  try{
    if(!window.claude||typeof window.claude.use!=='function') return;
    const [user,db]=await Promise.all([window.claude.use('user'),window.claude.use('db')]);
    if(!user||!db) return;
    const id=await user.id(); if(!id) return;
    const ref=db.doc('data/users/'+id+'/progress');
    const snap=await ref.get();
    store.ref=ref; store.mode='cloud';
    if(snap.exists){
      const d=snap.data()||{}; let c=null; try{c=JSON.parse(d.state)}catch(e){}
      if(c&&c.v===1&&(c.updated||0)>(S.updated||0)){S=Object.assign(fresh(),c);try{localStorage.setItem(LS,JSON.stringify(S))}catch(e){} if(!SES&&!ST) render()}
      else if((S.updated||0)>((c&&c.updated)||0)) pushCloud();
    } else if(S.updated) pushCloud();
  }catch(e){store.ref=null;store.mode='local'}
  finally{renderSaveState()}
}
function record(id,type,ok,o={}){
  const p=P(id), now=Date.now(), k=dayKey(now);
  p.seen=1; p.last=now;
  p.hist.push([now,type,ok?1:0]); if(p.hist.length>16) p.hist.shift();
  const t=S.types[type]||(S.types[type]={n:0,ok:0}); t.n++; if(ok) t.ok++;
  S.daily[k]=(S.daily[k]||0)+1;
  if(ok){
    if(type==='sentence'){p.prod++; if(p.box<2)p.box=2}
    else if(RECALL.has(type)&&!o.hinted){p.recN++; if(!p.recall.includes(k)){p.recall.push(k); if(p.recall.length>12)p.recall.shift()} p.lapse=0; p.box=Math.min(p.box+1,7)}
    else if(p.box<3) p.box++;

    if(o.easy) p.box=Math.min(7,p.box+1);
    p.due=now+INTERVALS[p.box]*DAY;
  } else {
    p.wrong++; p.lapse=1; p.box=1; p.due=now+10*60*1000;
    if(o.conf&&o.conf!==id) p.conf[o.conf]=(p.conf[o.conf]||0)+1;
  }
  save();
}
const isDue=(id,now=Date.now())=>{const p=S.p[id];return !!p&&((p.seen&&p.due<=now)||p.saved)};
function dueList(){
  const now=Date.now();
  return WORDS.filter(w=>isDue(w.id,now)).map(w=>{const p=S.p[w.id];const over=Math.max(0,(now-p.due)/DAY);return {id:w.id,score:over+p.wrong*1.5+p.hard*3+p.saved*4+(5-level(w.id))}}).sort((a,b)=>b.score-a.score);
}
const counts=()=>{const c=[0,0,0,0,0,0];WORDS.forEach(w=>c[level(w.id)]++);return c};

function mountSentence(){ const t=$('#sbText'); if(t) t.addEventListener('keydown',e=>{if(e.key==='Enter'&&(e.metaKey||e.ctrlKey)){e.preventDefault();$('[data-act="sbSubmit"]')?.click()}}) }
function mentions(w,text){
  const flat=s=>norm(s).replace(/-/g,' ').replace(/'/g,'');
  const t=' '+flat(text)+' ';
  const key=flat(baseOf(w)).split(' ').filter(x=>x.length>2&&!['the','for','act'].includes(x));
  const k=key.length?key:[flat(baseOf(w))];
  const stem=part=>{let s=part.length>3?part.replace(/e$/,''):part;if(s.length>5)s=s.slice(0,-1);return s};
  const irregular={thrust:['thrust'],wring:['wrung','wring'],sob:['sobb','sob'],stir:['stirr','stir'],stun:['stunn','stun'],come:['came','come','coming'],caught:['catch','caught'],fetch:['fetch'],defer:['deferr','defer'],intersected:['intersect'],captivated:['captivat'],demoralized:['demoralis','demoraliz'],severing:['sever'],revelries:['revelr'],clairvoyants:['clairvoyant'],buskers:['busker'],hawkers:['hawker'],advances:['advance'],papers:['paper']};
  return k.every(part=>{const stems=irregular[part]||[stem(part)];return stems.some(s=>t.includes(' '+s)||t.includes('-'+s))});
}
async function submitSentence(id,ctx){
  const w=BY[id], ta=$('#sbText'), out=$('#sbOut'), text=(ta.value||'').trim();

    out.innerHTML=`<p class="note">Evaluando tu frase…</p>`;

      const r=await sampleFn.json(`You are a kind, precise English teacher for a Spanish-speaking adult learner.

Student sentence: """${text.slice(0,500)}"""

Reply ONLY with JSON:
{"verdict":"correct"|"correct_but_unnatural"|"grammar_error"|"wrong_meaning","word_used_correctly":true|false,"feedback_es":"2-3 frases en español, amables y específicas: qué está bien y qué cambiar","corrected":"corrected sentence in English, or empty string if no errors","more_natural":"a more natural version in English, or empty string"}
word_used_correctly is true only if the target word is used with the meaning from the reading and with correct grammar around it.`,{modelTier:'quick'});
      const ok=!!r.word_used_correctly&&r.verdict!=='wrong_meaning';

      return;
    }catch(e){ if(e&&e.code==='not_granted') sampleState='denied'; }
  }

function distractors(w,n,pool){
  const base=(pool&&pool.length>=n+1?pool.map(i=>BY[i]):WORDS).filter(x=>x.id!==w.id);
  const same=shuffle(base.filter(x=>x.g===w.g)), other=shuffle(base.filter(x=>x.g!==w.g));
  let res=same.slice(0,n); if(res.length<n) res=res.concat(other.slice(0,n-res.length));
  if(res.length<n) res=res.concat(shuffle(WORDS.filter(x=>x.id!==w.id&&!res.includes(x))).slice(0,n-res.length));
  return res;
}

  if(SES.i>=SES.items.length) return renderSummary();
  const it=SES.items[SES.i];
  if(SES.kind==='challenge'&&!it.type) fillChallenge(it);
  CUR={it,done:false};
  const n=SES.items.length;
  const head=SES.kind==='challenge'?`<div class="score"><div>Puntos <b class="num">${SES.score}</b></div><div class="streak">Racha <b class="num">${SES.streak}</b></div><div>Dificultad <span class="tier">${[1,2,3].map(t=>`<i class="${t<=SES.tier?'on':''}"></i>`).join('')}</span></div></div>`:'';
  $('#view').innerHTML=`
   <section class="sess-head">
     <div class="sess-top"><button class="btn ghost sm" data-act="exitSession">${ic('arrowL')} Salir</button><span class="small muted num">${esc(SES.title)} · ${SES.i+1} de ${n}</span></div>
     <div class="bar"><i style="width:${SES.i/n*100}%"></i></div>${head}
   </section>
   <section class="card ex fade-in" id="ex">${EX[it.type].html(it)}</section>
   <section id="fb" hidden></section>`;
  EX[it.type].mount?.(it);
  const inp=$('#ans'); if(inp){inp.focus({preventScroll:true});inp.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault(); if(CUR.done) next(); else check()}})}
}
function sessResult(id,type,ok,o={}){
  record(id,type,ok,o);
  SES.res.push({id,type,ok});
  if(SES.kind==='challenge'){
    if(ok){SES.streak++;SES.best=Math.max(SES.best,SES.streak);SES.wrongRow=0;SES.score+=Math.round(10*SES.tier*(1+Math.min(SES.streak-1,5)*.1));if(SES.streak%3===0&&SES.tier<3)SES.tier++}
    else{SES.streak=0;SES.wrongRow++;if(SES.wrongRow>=2&&SES.tier>1){SES.tier--;SES.wrongRow=0}}
  } else if(!ok&&!CUR.it.retry&&type!=='match'){
    const pos=Math.min(SES.items.length,SES.i+3);
    SES.items.splice(pos,0,{id,type:easier(type),retry:true,pool:CUR.it.pool});
  }
}
function showFeedbackRaw(inner,cls,showMini){
  CUR.done=true;
  const fb=$('#fb'); fb.hidden=false;
  const w=BY[CUR.it.id];
  fb.innerHTML=`<div class="stack">${inner}${showMini&&w&&CUR.it.type!=='sentence'?`<div class="card flat stack"><p class="eyebrow">Repaso rápido</p>${miniCard(w)}<p class="small muted">Volverás a ver esta palabra en unos minutos con otro ejercicio.</p></div>`:''}<div class="row"><button class="btn primary" data-act="next" id="nextBtn">${SES.i+1>=SES.items.length?'Ver resultados':'Siguiente'} ${ic('arrowR')}</button><span class="small muted">o pulsa Enter</span></div></div>`;
  $('#nextBtn').focus({preventScroll:true});
  fb.scrollIntoView({block:'nearest',behavior:'smooth'});
}
function feedback(ok,body,partial){
  const head=ok?(partial?'Correcto, con un detalle':pick(['Correcto','¡Bien hecho!','Exacto'])):'Todavía no';
  showFeedbackRaw(`<div class="fb ${ok?(partial?'warn':'ok'):'bad'}"><div class="fb-head">${ic(ok?(partial?'warn':'ok'):'bad')} ${head}</div><div class="fb-body">${body}</div></div>`,'',!ok&&SES.kind!=='challenge');
}
function next(){ if(!CUR||!CUR.done) return; SES.i++; renderSession(); window.scrollTo({top:0,behavior:'smooth'}) }
function chooseOpt(id){
  if(CUR.done) return; const it=CUR.it, w=BY[it.id], ok=id===it.id, o=BY[id];
  $$('.opt').forEach(b=>{b.disabled=true;if(b.dataset.id===it.id)b.classList.add('right');else if(b.dataset.id===id)b.classList.add('wrong')});
  sessResult(it.id,it.type,ok,{conf:ok?null:id});
  if(it.type==='mc') feedback(ok, ok?`<p><b>${esc(w.w)}</b> = ${esc(w.es)}.</p><p>${mk(w.ex[0][0])}</p><p class="small muted">${esc(w.ex[0][1])}</p>`:`<p><b>${esc(w.w)}</b> significa <b>${esc(w.es)}</b>.</p><p>La opción que elegiste corresponde a <b>${esc(o.w)}</b>. Fíjate en la diferencia: ${esc(w.simple)}</p>`);
  else feedback(ok, `<p class="sentence" style="font-size:1.1rem">${mk(w.ex[1][0])}</p><p class="small muted">${esc(w.ex[1][1])}</p>`+(ok?`<p>Encaja porque <b>${esc(w.w)}</b> significa “${esc(w.es)}”.</p>`:`<p>Elegiste <b>${esc(o.w)}</b> (“${esc(o.es)}”), que no encaja aquí. La palabra correcta es <b>${esc(w.w)}</b>: ${esc(w.es)}.</p>`));
}
function check(){
  if(CUR.done) return; const it=CUR.it, w=BY[it.id], inp=$('#ans'); if(!inp) return;
  const form=it.type==='fill'?formOf(w.ex[0][0]):'';
  const r=accepts(w,inp.value,form);
  if(r.empty){inp.focus();toast('Escribe tu respuesta primero.');return}
  inp.readOnly=true; inp.classList.add(r.ok?'right':'wrong'); $('[data-act="check"]').disabled=true; $('#hintBtn')&&($('#hintBtn').disabled=true); $('[data-act="giveUp"]')&&($('[data-act="giveUp"]').disabled=true);
  const guess=!r.ok?WORDS.find(x=>x.id!==w.id&&accepts(x,inp.value,'').ok):null;
  sessResult(w.id,it.type,r.ok,{hinted:it.hinted,conf:guess?guess.id:null});
  const formNote=it.type==='fill'&&norm(form)!==norm(baseOf(w))?`<p>En esta frase la forma es <b>${esc(form)}</b> (de <i>${esc(w.w)}</i>).</p>`:'';
  const sent=it.type==='fill'?`<p>${mk(w.ex[0][0])}</p>`:`<p>${mk(w.ex[0][0])}</p><p class="small muted">${esc(w.ex[0][1])}</p>`;
  if(r.ok) feedback(true, (r.typo?`<p>Lo entendimos, pero revisa la ortografía: se escribe <b>${esc(it.type==='fill'?form:w.w)}</b>.</p>`:'')+sent+formNote+(it.hinted?'<p class="small muted">Usaste la pista: cuenta como recuerdo con ayuda.</p>':''), !!r.typo);
  else feedback(false, `<p>La respuesta era <b>${esc(it.type==='fill'?form:w.w)}</b>${it.type==='fill'&&norm(form)!==norm(baseOf(w))?` (forma de <i>${esc(w.w)}</i>)`:''}. Escribiste “${esc(inp.value)}”.</p>${guess?`<p>“${esc(inp.value)}” es otra palabra de la lista: <b>${esc(guess.w)}</b> = ${esc(guess.es)}.</p>`:''}${sent}`);
}
function matchClick(side,id,btn){
  const it=CUR.it, st=it.state; if(CUR.done||st.done[id]&&side==='L') return;
  if(side==='L'){ $$('.mitem.word').forEach(b=>b.classList.remove('sel')); btn.classList.add('sel'); st.sel=id; return }
  if(!st.sel||btn.classList.contains('done')){ if(!st.sel) toast('Primero elige una palabra a la izquierda.'); return }
  const L=$(`.mitem.word[data-id="${st.sel}"]`);
  if(id===st.sel){ L.classList.remove('sel');L.classList.add('done');btn.classList.add('done');st.done[id]=1;
    if(!st.miss[id]) {record(id,'match',true);SES.res.push({id,type:'match',ok:true})}
  } else { btn.classList.remove('wrong');void btn.offsetWidth;btn.classList.add('wrong');
    if(!st.miss[st.sel]){st.miss[st.sel]=1;record(st.sel,'match',false,{conf:id});SES.res.push({id:st.sel,type:'match',ok:false})}
  }
  st.sel=id===st.sel?null:st.sel;
  if(Object.keys(st.done).length===it.ids.length){
    const miss=Object.keys(st.miss);
    CUR.it.id=miss[0]||it.ids[0];
    feedback(!miss.length, miss.length?`<p>Te costaron: ${miss.map(m=>`<b>${esc(BY[m].w)}</b> (${esc(BY[m].es)})`).join(', ')}.</p>`:`<p>Emparejaste las ${it.ids.length} palabras a la primera.</p>`);
    if(miss.length) miss.forEach(m=>{const pos=Math.min(SES.items.length,SES.i+2);SES.items.splice(pos,0,{id:m,type:'mc',retry:true})});
  }
}

  const ring=`<div class="ring" style="background:conic-gradient(var(--ok) ${pct*3.6}deg, var(--line) 0)"><b class="num">${pct}%</b></div>`;

    <p class="muted">${ok} de ${res.length} respuestas correctas.${SES.kind==='challenge'?` Puntuación <b>${SES.score}</b> · mejor racha <b>${SES.best}</b> · récord ${S.best}.`:''}${ups.length?` ${ups.length} palabra${ups.length>1?'s subieron':' subió'} de nivel.`:''}</p></div></div>

/* ---------- Construcción de sesiones ---------- */
function studiedIds(){return WORDS.filter(w=>level(w.id)>=1).map(w=>w.id)}
function poolFor(sel){
  if(sel==='hard') return WORDS.filter(w=>{const p=S.p[w.id];return p&&(p.hard||p.wrong>0)}).map(w=>w.id);
  if(sel==='all') return WORDS.map(w=>w.id);
  const s=studiedIds(); return s.length>=6?s:WORDS.map(w=>w.id);
}
function typeFor(id){
  const L=level(id), p=S.p[id]; const lastWrong=p&&p.hist.length&&!p.hist[p.hist.length-1][2];
  const tiers=[['flash'],['mc','context','flash'],['context','fill','mc'],['recall','fill','context'],['recall','sentence','fill'],['recall','context','sentence']];
  let t=L; if(lastWrong) t=Math.max(0,t-1);
  return pick(tiers[t]);
}
function prioritize(ids,n){
  const now=Date.now();
  return ids.map(id=>{const p=S.p[id];const due=p&&p.seen&&p.due<=now?3:0;return {id,s:due+(p?p.wrong*.6+p.hard*2:0)+(5-level(id))*.5+Math.random()*2}}).sort((a,b)=>b.s-a.s).slice(0,n).map(x=>x.id);
}
function buildPractice(type,sel,n=10){
  const pool=poolFor(sel);
  if(!pool.length){toast('No hay palabras en ese grupo todavía.');return null}
  if(type==='match'){const ids=shuffle(prioritize(pool,Math.min(15,pool.length)));const items=[];for(let i=0;i+2<=ids.length&&items.length<3;i+=5)items.push({type:'match',ids:ids.slice(i,i+5),id:ids[i]});return items}
  const ids=prioritize(pool,Math.min(n,pool.length));
  let items=ids.map(id=>({id,type:type==='mixed'?typeFor(id):type,pool}));
  if(type==='mixed'){
    const low=ids.filter(id=>level(id)<=2); if(low.length>=4) items.splice(Math.floor(items.length/2),0,{type:'match',ids:shuffle(low).slice(0,5),id:low[0]});
    const rank={flash:0,mc:1,match:2,context:2,fill:3,recall:4,sentence:5}; items.sort((a,b)=>rank[a.type]-rank[b.type]);
  }
  return items;
}
function startPractice(type,sel){
  const items=buildPractice(type,sel||LIB.pool||'studied'); if(!items) return;
  startSession('practice',type,items,type==='mixed'?'Práctica mixta':TYPES[type]);
}
function startReview(){
  const d=dueList(); if(!d.length){toast('No tienes palabras pendientes de repaso.');return}
  const items=d.slice(0,15).map(x=>{const L=level(x.id);const t=L>=3?pick(['recall','fill','sentence']):L>=2?pick(['fill','context','recall']):pick(['mc','context']);return {id:x.id,type:t}});
  items.forEach(it=>{P(it.id).saved=0}); save();
  startSession('review','review',items,'Repaso');
}
function fillChallenge(it){
  const used=new Set(SES.items.filter(x=>x.id).map(x=>x.id));
  const studied=studiedIds(); const src=studied.length>=8&&Math.random()<.75?studied:WORDS.map(w=>w.id);
  const cand=src.filter(id=>!used.has(id)); const id=pick(cand.length?cand:src);
  it.id=id; SES.before[id]=level(id); it.type=pick(SES.tier===1?['mc','context']:SES.tier===2?['context','fill']:['recall','fill']);
}
function startChallenge(){startSession('challenge','challenge',Array.from({length:12},()=>({})),'Desafío')}

/* ---------- Fichas ---------- */
const FILTERS=[['all','Todas'],['0','Nuevas'],['1','En aprendizaje'],['2','Con ayuda'],['3','Sin ayuda'],['4','En frases'],['5','Dominadas'],['hard','Difíciles'],['saved','Guardadas']];
function libMatches(w){
  const q=norm(LIB.q); if(q&&!norm(w.w).includes(q)&&!norm(w.es).includes(q)) return false;
  const f=LIB.f, p=S.p[w.id];
  if(f==='all') return true; if(f==='hard') return !!(p&&p.hard); if(f==='saved') return !!(p&&p.saved);
  return level(w.id)===+f;
}
function viewCards(){
  return `<section class="card stack"><p class="eyebrow">Fichas de vocabulario</p><h1>Fichas</h1><p class="muted">Abre una palabra y revela su información paso a paso. Intenta adivinar cada sección antes de revelarla.</p></section>
  <section class="lib ${LIB.sel?'detail-open':''}" id="lib">

      <input class="search" id="q" type="search" placeholder="Buscar en inglés o español" value="${esc(LIB.q)}" aria-label="Buscar palabra">

}

let FC=null;

const FC_MODES={
 en:{n:'Inglés → español',k:'Reconocer',d:'Ves la palabra y recuerdas qué significa.'},
 es:{n:'Español → inglés',k:'Recordar',d:'Ves el significado y recuerdas la palabra. Más difícil y más eficaz.'},
 ctx:{n:'Contexto',k:'Comprender',d:'Ves una frase con un hueco y recuerdas qué palabra falta.'},
 mix:{n:'Mezcla',k:'Alternar',d:'Combina las tres direcciones para fijar la palabra desde varios ángulos.'}};
const FC_SRC=[['smart','Recomendado'],['station','Por estación'],['due','Para repasar'],['hard','Difíciles'],['saved','Guardadas'],['all','Todas al azar']];
const FC_RATES=[['again','Otra vez','No lo recordé'],['hard','Difícil','Con esfuerzo'],['good','Bien','Lo recordé'],['easy','Fácil','Al instante']];
function fcDeck(c){
  const all=WORDS.map(w=>w.id); let ids;
  if(c.src==='station') return [...BLOCKS[c.st]];
  if(c.src==='due') ids=dueList().map(x=>x.id);
  else if(c.src==='hard') ids=all.filter(id=>{const p=S.p[id];return p&&(p.hard||p.wrong>0)});
  else if(c.src==='saved') ids=all.filter(id=>S.p[id]&&S.p[id].saved);
  else if(c.src==='all') ids=shuffle(all);
  else{
    const due=dueList().map(x=>x.id);
    const learning=shuffle(all.filter(id=>{const L=level(id);return L>=1&&L<=2&&!due.includes(id)}));
    const fresh=BLOCKS[nextBlock()].filter(id=>level(id)===0).slice(0,5);
    ids=[...due,...learning].slice(0,Math.max(0,c.size-fresh.length)).concat(fresh);
  }
  return [...new Set(ids)].slice(0,c.size);
}

    <div class="tip"><i>3</i><b>Repite hasta recordar</b><span class="small muted">Las tarjetas que marcas «Otra vez» vuelven en la misma sesión, unas tarjetas más tarde.</span></div>
    <div class="tip"><i>4</i><b>Cambia de dirección</b><span class="small muted">Reconocer (inglés → español) es más fácil que recordar (español → inglés). Para hablar inglés necesitas las dos.</span></div>
  </section>
  <section class="card stack" style="gap:16px">
    <h3>1. Elige el mazo</h3>
    <div class="filters" role="group" aria-label="Mazo">${chips('src',FC_SRC,c.src)}</div>
    ${c.src==='station'?`<div class="filters" role="group" aria-label="Estación">${BLOCKS.map((ids,b)=>`<button data-act="fcSet" data-k="st" data-v="${b}" aria-pressed="${c.st===b}" title="${esc(ids.map(id=>BY[id].w).join(', '))}">Estación ${b+1}</button>`).join('')}</div>`:''}

}
function fcStart(ids,mode){
  const c=FCP(); ids=ids||fcDeck(c); mode=mode||c.mode; if(!ids.length) return;
  const dirs=['en','es','ctx'];
  FC={mode,type:c.type,i:0,flip:false,chk:null,typed:'',res:[],first:{},logged:false,
      before:Object.fromEntries(ids.map(id=>[id,level(id)])),
      q:shuffle(ids).map((id,i)=>{const isNew=level(id)===0;return {id,mode:isNew?'en':mode==='mix'?dirs[i%3]:mode,reps:0,isNew}})};
  VIEW='flash'; render(); window.scrollTo({top:0});
}
function fcPreview(id,r,recallType){
  if(r==='again') return '10 min';
  const p=S.p[id]; let b=p?p.box:0;
  if(recallType) b=Math.min(b+1,7); else if(b<3) b++;
  if(r==='hard') b=Math.max(1,b-1); if(r==='easy') b=Math.min(7,b+1);
  const d=INTERVALS[b]; return d<=1?'1 día':`${d} días`;
}

function fcFlip(skip){
  if(!FC||FC.flip) return;
  const it=FC.q[FC.i], w=BY[it.id], m=it.mode;
  FC.typed=skip?'':(($('#fcAns')||{}).value||'').trim();

  FC.skipped=!!skip; FC.flip=true;
  $('#fcCard').classList.add('flipped'); $('#fcFront').setAttribute('aria-hidden','true'); $('#fcBack').removeAttribute('aria-hidden');

}

    <p class="small muted" style="text-align:center">${rates.length>1?'¿Cuánto te costó recordarla? (teclas 1–4)':'Pulsa para continuar (tecla 1)'}</p>
    <div class="rate" ${rates.length===1?'style="grid-template-columns:1fr;max-width:320px;margin:0 auto;width:100%"':''}>${rates.map(([r,l,d],i)=>`<button class="${r}" data-act="fcRate" data-r="${r}" data-n="${i+1}"><span>${l}</span><small>${d} · ${fcPreview(it.id,r,recallType)}</small></button>`).join('')}</div>`;
  $('#fcCtl').scrollIntoView({block:'nearest',behavior:'smooth'});

function fcRate(r){
  if(!FC||!FC.flip) return;
  const it=FC.q[FC.i], ok=r!=='again';
  const typedType=FC.chk?(it.mode==='es'?'recall':'fill'):null;
  const type=typedType&&(ok?FC.chk.ok:true)?typedType:'flash';
  record(it.id,type,ok,{weak:r==='hard',easy:r==='easy'});
  if(it.reps===0&&!(it.id in FC.first)) FC.first[it.id]=ok;
  FC.res.push({id:it.id,mode:it.mode,r,rep:it.reps,type});
  if(!ok&&it.reps<3) FC.q.splice(Math.min(FC.q.length,FC.i+4),0,{id:it.id,mode:it.mode,reps:it.reps+1});
  else if(ok&&it.isNew&&it.reps===0&&FC.mode!=='en') FC.q.splice(Math.min(FC.q.length,FC.i+5),0,{id:it.id,mode:FC.mode==='ctx'?'ctx':'es',reps:1});
  FC.i++; FC.flip=false; FC.chk=null; FC.typed='';
  renderFC(); window.scrollTo({top:0,behavior:'smooth'});
}

      <p class="muted">Recordaste ${known.length} de ${ids.length} tarjetas a la primera.${recalls?` ${recalls} respuesta${recalls>1?'s escritas cuentan':' escrita cuenta'} como recuerdo sin ayuda.`:''}${ups.length?` ${ups.length} palabra${ups.length>1?'s subieron':' subió'} de nivel.`:''}</p></div>

}

/* ---------- Progreso ---------- */
function hbar(label,ok,n){const pct=n?Math.round(ok/n*100):0;return `<div class="hbar"><span>${esc(label)}</span><span class="track"><i style="width:${pct}%;background:${pct>=80?'var(--ok)':pct>=50?'var(--accent)':'var(--bad)'}"></i></span><span class="v">${n?pct+'%':'—'} <small>(${ok}/${n})</small></span></div>`}
function viewProgress(){
  const c=counts(), now=Date.now();
  const seen=WORDS.filter(w=>S.p[w.id]&&S.p[w.id].hist.length);
  const best=[...seen].map(w=>{const p=S.p[w.id];const okN=p.hist.filter(h=>h[2]).length;return {w,s:level(w.id)*10+p.box*2+okN-p.wrong*3}}).filter(x=>x.s>0).sort((a,b)=>b.s-a.s).slice(0,8);
  const confused=[...seen].filter(w=>S.p[w.id].wrong>0).sort((a,b)=>S.p[b.id].wrong-S.p[a.id].wrong).slice(0,8);
  const pairs=[]; WORDS.forEach(w=>{const p=S.p[w.id];if(p)Object.entries(p.conf).forEach(([o,n])=>{if(BY[o])pairs.push({a:w,b:BY[o],n})})}); pairs.sort((x,y)=>y.n-x.n);
  const typeRows=Object.keys(TYPES).map(t=>{const v=S.types[t]||{n:0,ok:0};return hbar(TYPES[t],v.ok,v.n)}).join('');
  const days=Array.from({length:7},(_,i)=>{const start=new Date();start.setHours(0,0,0,0);const a=start.getTime()+i*DAY,b=a+DAY;const n=WORDS.filter(w=>{const p=S.p[w.id];return p&&p.seen&&(i===0?p.due<b:p.due>=a&&p.due<b)}).length;return {n,label:i===0?'Hoy':new Date(a).toLocaleDateString('es',{weekday:'short'})}});
  const maxD=Math.max(1,...days.map(d=>d.n));
  const act=Array.from({length:14},(_,i)=>{const k=dayKey(now-(13-i)*DAY);return S.daily[k]||0}); const maxA=Math.max(1,...act);
  const sents=Object.entries(S.sent).flatMap(([id,a])=>a.map(s=>({...s,id}))).sort((a,b)=>b.t-a.t).slice(0,8);
  return `<section class="card stack"><p class="eyebrow">Panel de progreso</p><h1>Progreso</h1>${levelBar(c)}</section>
  <section class="grid-2">
    <div class="card stack"><h3>Las que mejor recuerdas</h3>${best.length?`<div class="wl">${best.map(x=>`<div><button data-act="openWord" data-id="${x.w.id}">${esc(x.w.w)}</button><span class="chip"><i class="sw" style="background:var(--lv${level(x.w.id)})"></i>${LEVELS[level(x.w.id)].n}</span></div>`).join('')}</div>`:'<p class="empty">Aparecerán cuando practiques.</p>'}</div>
    <div class="card stack"><h3>Las que más te cuestan</h3>${confused.length?`<div class="wl">${confused.map(w=>`<div><button data-act="openWord" data-id="${w.id}">${esc(w.w)}</button><span class="small muted num">${S.p[w.id].wrong} error${S.p[w.id].wrong>1?'es':''}</span></div>`).join('')}</div><button class="btn sm" data-act="drill" data-ids="${confused.map(w=>w.id).join(',')}" style="justify-self:start">Practicar estas palabras</button>`:'<p class="empty">Sin errores registrados todavía.</p>'}</div>
  </section>
  <section class="grid-2">
    <div class="card stack"><h3>Confusiones frecuentes</h3><p class="small muted">Palabras que elegiste o escribiste en lugar de la correcta.</p>${pairs.length?`<div class="wl">${pairs.slice(0,8).map(x=>`<div><span><b>${esc(x.a.w)}</b> <span class="muted">↔</span> <b>${esc(x.b.w)}</b></span><span class="small muted num">${x.n}×</span></div>`).join('')}</div>`:'<p class="empty">Ninguna confusión registrada.</p>'}</div>
    <div class="card stack"><h3>Resultados por tipo de ejercicio</h3>${typeRows}</div>
  </section>
  <section class="grid-2">
    <div class="card stack"><h3>Repasos de los próximos 7 días</h3><div class="cols">${days.map(d=>`<div class="colb"><b>${d.n}</b><i style="height:${d.n/maxD*100}%"></i><small>${esc(d.label)}</small></div>`).join('')}</div></div>
    <div class="card stack"><h3>Actividad (últimos 14 días)</h3><div class="cols" style="grid-template-columns:repeat(14,minmax(0,1fr))">${act.map((n,i)=>`<div class="colb"><b>${n||''}</b><i style="height:${n/maxA*100}%;background:var(--lv2)"></i><small>${i===13?'hoy':''}</small></div>`).join('')}</div><p class="small muted">Respuestas por día.</p></div>
  </section>
  <section class="card stack"><h3>Tus frases recientes</h3>${sents.length?`<div class="wl">${sents.map(s=>`<div><span><b>${esc(BY[s.id]?.w||'')}</b> — “${esc(s.text)}”</span><span class="chip ${s.ok?'ok':'hard'}">${s.ok?'Correcta':'A revisar'}</span></div>`).join('')}</div>`:'<p class="empty">Cuando escribas frases propias aparecerán aquí.</p>'}</section>
  <section class="card stack"><h3>Copia de seguridad</h3>
    <p class="small muted">${store.mode==='cloud'?'Tu progreso ya se guarda en tu cuenta. ':'El progreso se guarda solo en este navegador. '}Copia este código y guárdalo donde quieras; pégalo aquí para restaurar tu progreso en cualquier navegador.</p>
    <div class="row"><button class="btn sm" data-act="copyCode">Copiar código de respaldo</button></div>
    <div id="codeOut"></div>
    <label class="small muted" for="restore">Restaurar desde un código</label>
    <textarea id="restore" style="min-height:70px" placeholder="Pega aquí tu código de respaldo"></textarea>
    <div class="row"><button class="btn sm" data-act="restore">Restaurar</button><button class="btn ghost sm" data-act="reset" id="resetBtn">Reiniciar todo el progreso</button></div>
  </section>`;
}
const encode=()=>btoa(unescape(encodeURIComponent(JSON.stringify(S))));
function decode(s){const o=JSON.parse(decodeURIComponent(escape(atob(s.trim()))));if(!o||o.v!==1||typeof o.p!=='object')throw 0;return Object.assign(fresh(),o)}

/* ---------- Acciones ---------- */
const ACT={
 go:b=>go(b.dataset.v),
 speak:b=>speak(b.dataset.t),
 block:b=>startBlock(b.dataset.b),
 exitStudy:()=>{ST=null;go('study');render()},
 step:b=>{ST.step=+b.dataset.s;if(ST.step!==3){delete ST.rev.recall;delete ST.rev.rated}renderStudy()},
 studyNext:()=>studyMove(1), studyPrev:()=>studyMove(-1),
 rev:b=>{ST.rev[b.dataset.k]=1;renderStudy()},
 studyRate:b=>{const id=BLOCKS[ST.b][ST.wi],r=b.dataset.r;record(id,'flash',r!=='again',{weak:r==='hard'});if(r==='again'){P(id).hard=1;save()}ST.rev.rated=1;toast(r==='good'?'¡Bien! Ahora escribe una frase.':'Anotado: la repasarás pronto.');ST.step=4;renderStudy()},
 toggleHard:b=>{const p=P(b.dataset.id);p.hard=p.hard?0:1;save();toast(p.hard?'Marcada como difícil.':'Ya no está marcada como difícil.');if(ST)renderStudy();else refreshDetail()},
 toggleSaved:b=>{const p=P(b.dataset.id);p.saved=p.saved?0:1;save();renderNav();toast(p.saved?'Guardada para tu próximo repaso.':'Quitada del repaso.');refreshDetail()},
 markKnown:b=>{const p=P(b.dataset.id);if(p.known){p.known=0}else{p.known=1;p.seen=1;p.box=Math.max(p.box,2);p.due=Date.now()+2*DAY}save();toast(p.known?'Marcada como aprendida. Se verificará en el repaso.':'Marca quitada.');refreshDetail()},
 practiceBlock:b=>{const ids=BLOCKS[+b.dataset.b];const items=[{type:'match',ids:shuffle(ids).slice(0,5),id:ids[0]}].concat(shuffle(ids).map(id=>({id,type:'mc',pool:ids})),shuffle(ids).map(id=>({id,type:'context',pool:ids})),shuffle(ids).map(id=>({id,type:'recall'})));ST=null;startSession('practice','block',items,`Práctica · Estación ${+b.dataset.b+1}`)},
 startPractice:b=>startPractice(b.dataset.t||'mixed'),
 startReview:()=>startReview(),
 startChallenge:()=>startChallenge(),
 pool:b=>{LIB.pool=b.dataset.p;render()},
 exitSession:()=>{const v=SES.view;SES=null;go(v);render()},
 again:()=>{const k=SES.kind,v=SES.view;SES=null;if(k==='challenge')startChallenge();else if(k==='review'){VIEW='review';dueList().length?startReview():render()}else{VIEW='practice';startPractice(k==='block'?'mixed':k)}},
 drill:b=>{const ids=b.dataset.ids.split(',').filter(id=>BY[id]);const items=[];ids.forEach(id=>{const L=level(id);items.push({id,type:L>=2?'context':'mc'});items.push({id,type:L>=3?'sentence':'recall'})});const ord={mc:0,context:1,recall:2,sentence:3};items.sort((a,b)=>ord[a.type]-ord[b.type]);SES=null;startSession('practice','mixed',items,ids.length===1?`Práctica · ${BY[ids[0]].w}`:'Práctica de errores')},
 opt:b=>chooseOpt(b.dataset.id),
 check:()=>check(),
 hint:()=>{const it=CUR.it,w=BY[it.id];it.hinted=1;const f=formOf(w.ex[0][0]);$('#hintOut').textContent=`Empieza por «${f[0]}» y tiene ${f.replace(/[^a-zA-Z]/g,'').length} letras.`;$('#hintBtn').disabled=true;$('#ans').focus()},
 giveUp:()=>{if(CUR.done)return;const w=BY[CUR.it.id];sessResult(w.id,CUR.it.type,false);$('#ans').readOnly=true;$('[data-act="check"]').disabled=true;feedback(false,`<p>La palabra es <b>${esc(w.w)}</b>.</p><p>${mk(w.ex[0][0])}</p>`)},
 next:()=>next(),
 flip:()=>{$('#flash').classList.add('flipped');$('#flashActs').innerHTML=`<p class="small muted">¿Lo sabías?</p><div class="row"><button class="btn" data-act="rate" data-r="again">No la sabía</button><button class="btn" data-act="rate" data-r="hard">Con dudas</button><button class="btn primary" data-act="rate" data-r="good">La sabía</button></div>`},
 rate:b=>{if(CUR.done)return;const r=b.dataset.r,w=BY[CUR.it.id];sessResult(w.id,'flash',r!=='again',{weak:r==='hard'});$('#flashActs').innerHTML='';feedback(r!=='again',r==='again'?`<p>Sin problema: ahora la conoces mejor. Volverá en unos minutos.</p>`:`<p>${r==='hard'?'La repasarás un poco antes.':'Perfecto.'} Recuerda que reconocerla no es lo mismo que recordarla: más adelante te la pediremos sin ayuda.</p>`)},
 mL:b=>matchClick('L',b.dataset.id,b), mR:b=>matchClick('R',b.dataset.id,b),
 sbSubmit:b=>submitSentence(b.dataset.id,b.dataset.ctx),
 sbRetry:()=>renderStudy(),
 selfOk:b=>{saveSentence(b.dataset.id,CUR_SB.text,true,'self');sentenceDone(b.dataset.id,true,b.dataset.ctx,`<div class="fb ok"><div class="fb-head">${ic('ok')} Frase registrada</div><p>Anotada como correcta según tu autoevaluación.</p></div>`)},
 selfBad:b=>{saveSentence(b.dataset.id,CUR_SB.text,false,'self');if(b.dataset.ctx==='study'){$('#sbText').readOnly=false;$('[data-act="sbSubmit"]').disabled=false;$('#sbOut').innerHTML='<p class="note">Corrige tu frase y vuelve a evaluarla.</p>';$('#sbText').focus()}else sentenceDone(b.dataset.id,false,'session',`<div class="fb bad"><div class="fb-head">${ic('bad')} A revisar</div><p>La practicarás de nuevo pronto.</p></div>`)},
 filter:b=>{LIB.f=b.dataset.f;$$('#filters button').forEach(x=>x.setAttribute('aria-pressed',x===b));renderWlist()},
 openWord:b=>{LIB.sel=b.dataset.id;if(VIEW!=='cards'){go('cards')}else{refreshDetail();if(innerWidth<860)window.scrollTo({top:0})}},
 closeWord:()=>{LIB.sel=null;refreshDetail();$('#detail').innerHTML='<div class="card"><p class="empty">Elige una palabra de la lista para abrir su ficha.</p></div>'},
 revealSec:b=>{const o=LIB.open[b.dataset.id]||(LIB.open[b.dataset.id]={});o[b.dataset.k]=1;P(b.dataset.id).seen=1;save();refreshDetail()},
 revealAll:b=>{LIB.open[b.dataset.id]={es:1,simple:1,ctx:1,ex:1,col:1,syn:1,err:1,hook:1};P(b.dataset.id).seen=1;save();refreshDetail()},
 copyCode:()=>{const code=encode();const out=$('#codeOut');out.innerHTML=`<div class="code" id="codeBox" tabindex="0">${esc(code)}</div>`;const sel=()=>{const r=document.createRange();r.selectNodeContents($('#codeBox'));const s=getSelection();s.removeAllRanges();s.addRange(r)};try{navigator.clipboard.writeText(code).then(()=>toast('Código copiado.'),()=>{sel();toast('Selecciona y copia el código manualmente.')})}catch(e){sel();toast('Selecciona y copia el código manualmente.')}},
 fcSet:b=>{const c=FCP(),k=b.dataset.k,v=b.dataset.v;c[k]=k==='st'||k==='size'?+v:v;save();render()},
 fcStart:()=>fcStart(),
 fcFlip:b=>fcFlip(!!b.dataset.skip),
 fcRate:b=>fcRate(b.dataset.r),
 fcOverride:()=>{FC.chk={ok:true,manual:true};fcControls()},
 fcRedo:b=>{const c=FCP();fcStart(b.dataset.ids.split(',').filter(id=>BY[id]),c.mode)},
 fcNew:()=>{FC=null;render();window.scrollTo({top:0})},
 fcExit:()=>{FC=null;render();window.scrollTo({top:0})},
 restore:()=>{try{S=decode($('#restore').value);save();if(store.ref)pushCloud();toast('Progreso restaurado.');render()}catch(e){toast('El código no es válido. Cópialo completo e inténtalo de nuevo.')}},
 reset:b=>{if(b.dataset.armed){S=fresh();save();if(store.ref)pushCloud();toast('Progreso reiniciado.');render()}else{b.dataset.armed=1;b.textContent='Pulsa otra vez para confirmar';b.classList.remove('ghost');b.style.color='var(--bad)';setTimeout(()=>{if(b.isConnected){delete b.dataset.armed;b.textContent='Reiniciar todo el progreso';b.classList.add('ghost');b.style.color=''}},4000)}}
};
document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b||b.disabled)return;const f=ACT[b.dataset.act];if(f){e.preventDefault();f(b,e)}});
document.addEventListener('change',e=>{if(e.target.id==='fcType'){FCP().type=e.target.checked;save()}});
document.addEventListener('keydown',e=>{
  if(VIEW==='flash'&&FC&&FC.i<FC.q.length){
    if(e.target.matches('input,textarea,summary')) return;
    if((e.key===' '||e.key==='Enter')&&!FC.flip&&!e.target.matches('button')){e.preventDefault();fcFlip();return}
    if(e.key===' '&&!FC.flip){e.preventDefault();fcFlip();return}
    if(FC.flip&&/^[1-4]$/.test(e.key)){const b=$(`[data-act="fcRate"][data-n="${e.key}"]`);if(b){e.preventDefault();b.click()}}
    return;
  }
  if(!SES||!CUR||e.target.matches('input,textarea')) return;
  if(e.key==='Enter'&&CUR.done){e.preventDefault();next();return}
  if(/^[1-4]$/.test(e.key)&&!CUR.done){const b=$$('.opt')[+e.key-1];if(b){b.click()}}
});
if(canSpeak){try{speechSynthesis.getVoices();speechSynthesis.onvoiceschanged=()=>{}}catch(e){}}

/* ---------- Arranque ---------- */
const h=(location.hash||'').slice(1); if(NAV.some(n=>n[0]===h)) VIEW=h;
render(); renderSaveState();
setTimeout(()=>{ initCloud(); if(window.claude&&typeof window.claude.use==='function') window.claude.use('sample').then(s=>{sampleFn=s}).catch(()=>{}); },0);
})();
</script>
